<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stress Battery — Anti-Fragile Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fafafa; color: #1a1a1a; padding: 20px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
  .overall { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.95rem; margin-bottom: 24px; }
  .overall.ANTI-FRAGILE { background: #d4edda; color: #155724; }
  .overall.RESILIENT { background: #fff3cd; color: #856404; }
  .overall.FRAGILE { background: #f8d7da; color: #721c24; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #f7b408; }
  .card h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .card .score { font-size: 2rem; font-weight: 700; color: #f7b408; }
  .card .meta { font-size: 0.85rem; color: #666; margin-top: 8px; line-height: 1.5; }
  .card .detail { font-size: 0.82rem; color: #888; margin-top: 12px; background: #f8f8f8; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .card.green { border-left-color: #28a745; }
  .card.yellow { border-left-color: #ffc107; }
  .card.red { border-left-color: #dc3545; }
  .history { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 32px; }
  .history h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .chart { width: 100%; height: 200px; position: relative; }
  canvas { width: 100%; height: 100%; }
  .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 0.82rem; color: #666; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 1.1rem; }
  .thresholds { font-size: 0.82rem; color: #888; margin-top: 16px; }
  .thresholds span { margin-right: 16px; }
</style>
</head>
<body>
<h1>Anti-Fragile Stress Battery</h1>
<p class="subtitle">3-chamber nightly test: Compression · Contradiction · Identity</p>

<div id="app"><div class="empty">Loading battery data...</div></div>

<script>
async function load() {
  const app = document.getElementById('app');
  let latest, state;

  try {
    const [lr, sr] = await Promise.all([
      fetch('/stress-battery/data'),
      fetch('/stress-battery/history')
    ]);
    latest = await lr.json();
    state = await sr.json();
  } catch (e) {
    app.innerHTML = '<div class="empty">No battery data yet. Run: node stress-battery.js</div>';
    return;
  }

  if (!latest || !latest.date) {
    app.innerHTML = '<div class="empty">No battery results found.</div>';
    return;
  }

  const c = latest.compression || {};
  const t = latest.contradiction || {};
  const id = latest.identity || {};
  const overall = latest.overall || 'UNKNOWN';
  const history = (state && state.history) || [];

  function cardColor(test, value) {
    if (test === 'compression') return value >= 70 ? 'green' : value >= 50 ? 'yellow' : 'red';
    if (test === 'contradiction') return value >= 6 ? 'green' : value >= 4 ? 'yellow' : 'red';
    if (test === 'identity') return value >= 0.85 ? 'green' : value >= 0.70 ? 'yellow' : 'red';
    return '';
  }

  let html = `<div class="overall ${overall}">${overall}</div>`;
  html += `<p class="subtitle">Battery #${latest.testNumber} — ${latest.date}</p>`;
  html += '<div class="cards">';

  html += `<div class="card ${cardColor('compression', c.score)}">
    <h2>Chamber 1: Compression</h2>
    <div class="score">${c.score || 0}%</div>
    <div class="meta">
      Original concepts: ${c.originalCount || 0}<br>
      Recovered: ${c.recoveredCount || 0}<br>
      Lost: ${c.lost || 0}
    </div>
    <div class="detail">${(c.files || []).join(', ')}\n\n${c.compressed || ''}</div>
  </div>`;

  html += `<div class="card ${cardColor('contradiction', t.survival)}">
    <h2>Chamber 2: Contradiction</h2>
    <div class="score">${t.survival || 0}/10</div>
    <div class="meta">
      Principle: ${t.principle || 'none'}<br>
      Verdict: ${t.verdict || 'UNKNOWN'}
    </div>
    <div class="detail">${t.evaluation || ''}</div>
  </div>`;

  html += `<div class="card ${cardColor('identity', id.similarity)}">
    <h2>Chamber 3: Identity</h2>
    <div class="score">${id.similarity || 0}</div>
    <div class="meta">
      Drift: ${id.drift || 'UNKNOWN'}<br>
      Baseline: ${id.baselineExists ? 'established' : 'pending first run'}
    </div>
    <div class="detail">${id.response || ''}</div>
  </div>`;

  html += '</div>';

  // Thresholds
  html += '<div class="thresholds">';
  html += '<span>Compression: 70%+ = green</span>';
  html += '<span>Contradiction: 6+ = green</span>';
  html += '<span>Identity: 0.85+ = green</span>';
  html += '</div>';

  // History chart
  if (history.length > 1) {
    html += '<div class="history"><h2>Trend (last 90 runs)</h2>';
    html += '<div class="chart"><canvas id="chart"></canvas></div>';
    html += '<div class="legend">';
    html += '<span><span class="dot" style="background:#f7b408"></span> Compression %</span>';
    html += '<span><span class="dot" style="background:#e74c3c"></span> Contradiction /10</span>';
    html += '<span><span class="dot" style="background:#3498db"></span> Identity sim</span>';
    html += '</div></div>';
  }

  app.innerHTML = html;

  if (history.length > 1) drawChart(history);
}

function drawChart(history) {
  const canvas = document.getElementById('chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = 400;
  ctx.scale(2, 2);
  const w = rect.width, h = 200;
  const pad = { l: 40, r: 20, t: 10, b: 30 };
  const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;

  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, w, h);

  const n = history.length;
  const xStep = pw / Math.max(1, n - 1);

  function drawLine(data, color, maxVal) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    data.forEach((v, i) => {
      const x = pad.l + i * xStep;
      const y = pad.t + ph - (v / maxVal) * ph;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // Grid lines
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (ph / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
  }

  // Y labels
  ctx.fillStyle = '#999';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ['100', '75', '50', '25', '0'].forEach((label, i) => {
    ctx.fillText(label, pad.l - 6, pad.t + (ph / 4) * i + 4);
  });

  // X labels (dates)
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(n / 6));
  history.forEach((h, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = pad.l + i * xStep;
      ctx.fillText(h.date.slice(5), x, h + pad.t + ph + 16);
    }
  });

  drawLine(history.map(h => h.compression || 0), '#f7b408', 100);
  drawLine(history.map(h => (h.contradiction || 0) * 10), '#e74c3c', 100);
  drawLine(history.map(h => (h.identity || 0) * 100), '#3498db', 100);
}

load();
</script>
</body>
</html>
