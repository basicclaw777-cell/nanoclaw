<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reed — Higgsfield Test Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'DM Sans', system-ui, sans-serif; padding: 20px; }
  h1 { color: #B87333; font-family: 'Bebas Neue', sans-serif; font-size: 2em; margin-bottom: 4px; letter-spacing: 2px; }
  .subtitle { color: #666; margin-bottom: 20px; font-size: 0.85em; }
  .stats { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat { background: #151515; border: 1px solid #222; border-radius: 8px; padding: 12px 18px; }
  .stat-val { font-size: 1.6em; color: #B87333; font-weight: bold; }
  .stat-label { font-size: 0.75em; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .filters { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8em; }
  .filter-btn.active { background: #B87333; color: #000; border-color: #B87333; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #151515; border: 1px solid #222; border-radius: 8px; overflow: hidden; transition: border-color 0.2s; }
  .card:hover { border-color: #B87333; }
  .card-media { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; display: block; }
  .card-body { padding: 12px; }
  .card-title { font-weight: 600; margin-bottom: 4px; }
  .card-meta { font-size: 0.75em; color: #888; margin-bottom: 8px; }
  .grade { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; }
  .grade-A { background: #1a3a1a; color: #4ade80; }
  .grade-B { background: #2a2a1a; color: #B87333; }
  .grade-C { background: #2a2a1a; color: #fbbf24; }
  .grade-D { background: #3a1a1a; color: #f87171; }
  .grade-untested { background: #1a1a2a; color: #818cf8; }
  .prompt { font-size: 0.75em; color: #666; margin-top: 8px; font-style: italic; max-height: 3em; overflow: hidden; }
  .duration { font-size: 0.7em; color: #555; }
  .empty { text-align: center; padding: 60px; color: #444; }
  a { color: #B87333; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>REED — HIGGSFIELD TEST GALLERY</h1>
<p class="subtitle">Autonomous model testing results. Updated on each test run.</p>

<div class="stats" id="stats"></div>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<script>
const LOG_URL = '/reed-lab/test-log.json';
const MAP_URL = '/higgsfield-map.json';

let allEntries = [];
let activeFilter = 'all';

async function load() {
  try {
    const [logResp, mapResp] = await Promise.all([fetch(LOG_URL), fetch(MAP_URL)]);
    const log = logResp.ok ? await logResp.json() : [];
    const map = mapResp.ok ? await mapResp.json() : {};

    // Merge: test log entries + map model test history
    allEntries = [...log];
    for (const [section, models] of [['image_models', map.image_models], ['video_models', map.video_models]]) {
      if (!models) continue;
      for (const [key, model] of Object.entries(models)) {
        if (!model.tests) continue;
        for (const t of model.tests) {
          if (!allEntries.some(e => e.model === model.jst && e.timestamp?.startsWith(t.date))) {
            allEntries.push({
              model: model.jst || key, name: model.name, type: section === 'image_models' ? 'image' : 'video',
              grade: t.grade || model.grade, notes: t.result, prompt: t.prompt || '',
              timestamp: t.date, duration_ms: t.duration_ms || 0, output: null, file: null
            });
          }
        }
      }
    }

    // Sort newest first
    allEntries.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));

    // Stats
    const grades = { A: 0, B: 0, C: 0, D: 0, untested: 0 };
    allEntries.forEach(e => { grades[e.grade] = (grades[e.grade] || 0) + 1; });
    const totalImg = Object.keys(map.image_models || {}).length;
    const totalVid = Object.keys(map.video_models || {}).length;
    const testedImg = Object.values(map.image_models || {}).filter(m => m.grade !== 'untested').length;
    const testedVid = Object.values(map.video_models || {}).filter(m => m.grade !== 'untested').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-val">${allEntries.length}</div><div class="stat-label">Total Tests</div></div>
      <div class="stat"><div class="stat-val">${testedImg}/${totalImg}</div><div class="stat-label">Image Models Tested</div></div>
      <div class="stat"><div class="stat-val">${testedVid}/${totalVid}</div><div class="stat-label">Video Models Tested</div></div>
      <div class="stat"><div class="stat-val">${grades.A || 0}</div><div class="stat-label">Grade A</div></div>
      <div class="stat"><div class="stat-val">${grades.B || 0}</div><div class="stat-label">Grade B</div></div>
      <div class="stat"><div class="stat-val">${grades.D || 0}</div><div class="stat-label">Grade D (Failed)</div></div>
    `;

    // Filters
    const types = ['all', 'image', 'video', 'A', 'B', 'C', 'D'];
    document.getElementById('filters').innerHTML = types.map(t =>
      `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="setFilter('${t}')">${t.toUpperCase()}</button>`
    ).join('');

    render();
  } catch (err) {
    document.getElementById('grid').innerHTML = `<div class="empty">Error loading data: ${err.message}</div>`;
  }
}

function setFilter(f) {
  activeFilter = f;
  load();
}

function render() {
  let entries = allEntries;
  if (activeFilter === 'image' || activeFilter === 'video') entries = entries.filter(e => e.type === activeFilter);
  else if (['A','B','C','D'].includes(activeFilter)) entries = entries.filter(e => e.grade === activeFilter);

  if (entries.length === 0) {
    document.getElementById('grid').innerHTML = '<div class="empty">No test results yet. hf-tester is running...</div>';
    return;
  }

  document.getElementById('grid').innerHTML = entries.map(e => {
    const mediaUrl = e.output || '';
    const isVideo = e.type === 'video';
    const media = mediaUrl
      ? (isVideo
        ? `<video class="card-media" src="${mediaUrl}" controls preload="metadata"></video>`
        : `<img class="card-media" src="${mediaUrl}" loading="lazy" onerror="this.style.display='none'">`)
      : `<div class="card-media" style="display:flex;align-items:center;justify-content:center;color:#333;">No preview</div>`;
    const dur = e.duration_ms ? `${(e.duration_ms / 1000).toFixed(0)}s` : '';

    return `<div class="card">
      ${media}
      <div class="card-body">
        <div class="card-title">${e.name || e.model}</div>
        <div class="card-meta">
          <span class="grade grade-${e.grade}">${e.grade}</span>
          ${e.type} ${dur ? `<span class="duration">${dur}</span>` : ''}
          ${e.timestamp ? `<span style="margin-left:8px">${e.timestamp.slice(0,10)}</span>` : ''}
        </div>
        ${e.notes ? `<div style="font-size:0.8em;color:#aaa;margin-top:4px">${e.notes}</div>` : ''}
        ${e.prompt ? `<div class="prompt">${e.prompt}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

load();
setInterval(load, 30000); // Auto-refresh every 30s
</script>
</body>
</html>
