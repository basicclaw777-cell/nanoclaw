<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathedral Deck — System Cards</title>
<style>
  :root {
    --bg: #09090f;
    --surface: #0f0f18;
    --border: #1a1a2e;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.15);
    --blue: #378ADD;
    --green: #22c55e;
    --red: #ef4444;
    --purple: #534AB7;
    --accent: #8B2020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; }

  header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); }
  .header-right { display: flex; gap: 12px; align-items: center; }
  .count { font-size: 11px; color: var(--muted); }

  .filters { display: flex; gap: 6px; padding: 16px 32px 0; flex-wrap: wrap; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 16px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }

  .deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px 32px 40px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: default; transition: all 0.3s; position: relative; }
  .card:hover { border-color: var(--amber); box-shadow: 0 0 24px rgba(245,158,11,0.06); transform: translateY(-2px); }
  .card.expanded { grid-column: span 2; }

  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .card-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .card-number { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .card-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .card-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .card-status { position: absolute; top: 16px; right: 16px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
  .status-live { background: rgba(34,197,94,0.15); color: var(--green); }
  .status-building { background: var(--amber-dim); color: var(--amber); }
  .status-planned { background: rgba(107,107,128,0.15); color: var(--muted); }
  .status-dormant { background: rgba(239,68,68,0.1); color: #666; }

  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }

  .card-facts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .fact { background: rgba(255,255,255,0.04); border-radius: 4px; padding: 3px 8px; font-size: 10px; color: var(--text); font-weight: 600; }

  .card-connections { font-size: 10px; color: var(--muted); }
  .conn-link { color: var(--amber); cursor: pointer; text-decoration: none; }
  .conn-link:hover { text-decoration: underline; }

  .card-frontier { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--amber); font-style: italic; }

  .card-locations { margin-top: 8px; font-size: 10px; color: var(--muted); font-family: 'SF Mono', monospace; }

  .section-divider { padding: 24px 32px 8px; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; border-top: 1px solid var(--border); margin-top: 8px; }

  @media (max-width: 700px) { .deck { grid-template-columns: 1fr; padding: 12px; } header { padding: 16px; } .card.expanded { grid-column: span 1; } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Cathedral Deck</h1>
    <div class="count" id="deckCount">Loading...</div>
  </div>
  <div class="header-right">
    <div class="count" id="statusCount"></div>
  </div>
</header>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="live">Live</button>
  <button class="filter-btn" data-filter="building">Building</button>
  <button class="filter-btn" data-filter="planned">Planned</button>
  <button class="filter-btn" data-filter="frontier">Has Frontier</button>
</div>

<div class="deck" id="deck"></div>

<div class="section-divider">Session Build History</div>
<div class="deck" id="sessionDeck"></div>

<script>
const BASE = 'http://localhost:8080';
let deckData = [];
let nameMap = {};

function statusClass(s) {
  if (s === 'live') return 'status-live';
  if (s === 'building') return 'status-building';
  if (s === 'planned') return 'status-planned';
  return 'status-dormant';
}

function renderCard(card) {
  const connections = (card.connects || [])
    .map(id => nameMap[id] ? `<a class="conn-link" onclick="scrollToCard(${id})">#${String(id).padStart(3,'0')} ${nameMap[id]}</a>` : `#${id}`)
    .join(' · ');

  return `<div class="card" id="card-${card.id}" data-status="${card.status}">
    <span class="card-status ${statusClass(card.status)}">${card.status}</span>
    <div class="card-header">
      <div class="card-icon" style="background:${card.color}22;color:${card.color}">${card.icon || '#'}</div>
      <div>
        <div class="card-number">#${String(card.id).padStart(3, '0')}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-subtitle">${card.subtitle || ''}</div>
      </div>
    </div>
    <div class="card-desc">${card.description || ''}</div>
    ${card.key_facts ? `<div class="card-facts">${card.key_facts.map(f => `<span class="fact">${f}</span>`).join('')}</div>` : ''}
    ${connections ? `<div class="card-connections">Connects: ${connections}</div>` : ''}
    ${card.frontier ? `<div class="card-frontier">${card.frontier}</div>` : ''}
    ${card.locations ? `<div class="card-locations">${card.locations.slice(0,2).join(' · ')}</div>` : ''}
    ${card.dashboards && card.dashboards.length ? `<div class="card-locations" style="margin-top:4px">${card.dashboards.map(d => `<a href="${d}" style="color:var(--blue)" target="_blank">${d}</a>`).join(' ')}</div>` : ''}
  </div>`;
}

function scrollToCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function applyFilter(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  const cards = document.querySelectorAll('#deck .card');
  cards.forEach(c => {
    if (filter === 'all') { c.style.display = ''; return; }
    if (filter === 'frontier') { c.style.display = c.querySelector('.card-frontier') ? '' : 'none'; return; }
    c.style.display = c.dataset.status === filter ? '' : 'none';
  });
}

async function loadDeck() {
  try {
    const r = await fetch(`${BASE}/reed-slides/deck`);
    if (!r.ok) return;
    deckData = await r.json();

    // Build name map for connections
    deckData.forEach(c => { nameMap[c.id] = c.name; });

    document.getElementById('deck').innerHTML = deckData.map(renderCard).join('');
    document.getElementById('deckCount').textContent = `${deckData.length} cards`;

    const live = deckData.filter(c => c.status === 'live').length;
    const building = deckData.filter(c => c.status === 'building').length;
    const planned = deckData.filter(c => c.status === 'planned').length;
    document.getElementById('statusCount').textContent = `${live} live · ${building} building · ${planned} planned`;

    // Bind filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => applyFilter(btn.dataset.filter);
    });
  } catch(e) { console.error('Deck:', e); }
}

async function loadSessionSlides() {
  try {
    const r = await fetch(`${BASE}/reed-slides/catalogue`);
    if (!r.ok) return;
    const slides = await r.json();
    if (!slides || slides.length === 0) {
      document.getElementById('sessionDeck').innerHTML = '<div style="color:var(--muted);padding:20px;font-size:12px;font-style:italic">Auto-generated from session harvests</div>';
      return;
    }
    document.getElementById('sessionDeck').innerHTML = slides.slice(-12).reverse().map((s, i) => `
      <div class="card" data-status="live">
        <span class="card-status status-live">${s.date || 'Build'}</span>
        <div class="card-header">
          <div class="card-icon" style="background:var(--amber-dim);color:var(--amber)">${String(s.date || '').slice(-2) || '#'}</div>
          <div>
            <div class="card-name">${s.title || 'Session Build'}</div>
            <div class="card-subtitle">${s.subtitle || ''}</div>
          </div>
        </div>
        ${s.highlights ? `<div class="card-facts">${s.highlights.slice(0,4).map(h => `<span class="fact">${h}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
  } catch(e) {}
}

loadDeck();
loadSessionSlides();
</script>
</body>
</html>
