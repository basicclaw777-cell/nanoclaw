<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>.lobby-btn{position:fixed;top:12px;left:12px;z-index:99999;background:#1a1a1f;border:1px solid #2a2a33;color:#d4a853;padding:6px 14px;font:12px 'Share Tech Mono',monospace;cursor:pointer;border-radius:4px;text-decoration:none;display:flex;align-items:center;gap:6px;opacity:0.8;transition:opacity 0.2s}.lobby-btn:hover{opacity:1;border-color:#d4a853}</style>
<a class="lobby-btn" href="/env">&#x25C0; LOBBY</a>
<title>The Forgotten Shelf — Archaeologist Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0d0d0f; --surface: #151518; --card: #1a1a1f; --card-hover: #22222a;
    --border: #2a2a33; --text: #e8e8ec; --text2: #888890; --text3: #555560;
    --amber: #d4a853; --amber-dim: #8a6e30; --amber-glow: rgba(212,168,83,0.15);
    --blue: #378add; --green: #1d9e75; --red: #ef4444; --purple: #7c6bc4;
  }
  body { font-family: 'Share Tech Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 18px; color: var(--amber); letter-spacing: 2px; text-transform: uppercase; }
  .header .stats { color: var(--text2); font-size: 12px; }
  .header .stats b { color: var(--amber); }

  /* Controls */
  .controls { padding: 16px 24px; display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .search-box { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: inherit; font-size: 13px; border-radius: 4px; }
  .search-box:focus { outline: none; border-color: var(--amber); }
  .domain-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { padding: 4px 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 11px; cursor: pointer; color: var(--text2); background: transparent; font-family: inherit; transition: all 0.2s; }
  .pill:hover { border-color: var(--amber-dim); color: var(--text); }
  .pill.active { border-color: var(--amber); color: var(--amber); background: var(--amber-glow); }
  .pill .count { color: var(--text3); margin-left: 4px; }

  /* Layout */
  .main { display: flex; height: calc(100vh - 130px); }
  .list-panel { width: 420px; min-width: 320px; overflow-y: auto; border-right: 1px solid var(--border); }
  .detail-panel { flex: 1; overflow-y: auto; padding: 24px; }

  /* List items */
  .item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .item:hover { background: var(--card); }
  .item.selected { background: var(--card-hover); border-left: 3px solid var(--amber); }
  .item-name { font-size: 13px; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item-meta { font-size: 11px; color: var(--text3); margin-top: 4px; display: flex; gap: 10px; }
  .domain-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .domain-tag.ai_ml { color: var(--blue); border: 1px solid var(--blue); }
  .domain-tag.finance_trading { color: var(--green); border: 1px solid var(--green); }
  .domain-tag.sports_science { color: var(--red); border: 1px solid var(--red); }
  .domain-tag.audio_acoustics { color: var(--purple); border: 1px solid var(--purple); }
  .domain-tag.coaching_psychology { color: #e09040; border: 1px solid #e09040; }
  .domain-tag.signal_processing { color: #40b0e0; border: 1px solid #40b0e0; }
  .domain-tag.computer_vision { color: #e06080; border: 1px solid #e06080; }
  .domain-tag.knowledge_management { color: var(--amber); border: 1px solid var(--amber); }

  /* Detail view */
  .detail-panel h2 { font-size: 16px; color: var(--amber); margin-bottom: 16px; line-height: 1.4; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h3 { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .detail-section p { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .detail-section.cathedral p { color: var(--amber); }
  .detail-section.valid p { color: var(--green); }
  .detail-section.abandoned p { color: var(--text3); }
  .build-badge { display: inline-block; padding: 2px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; font-size: 11px; color: var(--text2); }
  .empty-state { color: var(--text3); font-size: 14px; text-align: center; margin-top: 100px; }

  /* Domain overview cards */
  .overview { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .overview-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px; cursor: pointer; transition: all 0.2s; }
  .overview-card:hover { border-color: var(--amber-dim); transform: translateY(-2px); }
  .overview-card h3 { font-size: 13px; color: var(--text); margin-bottom: 8px; }
  .overview-card .num { font-size: 28px; color: var(--amber); font-weight: bold; }
  .overview-card .bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .overview-card .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .result-count { padding: 8px 16px; font-size: 11px; color: var(--text3); border-bottom: 1px solid var(--border); }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .list-panel { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .detail-panel { height: 50vh; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>The Forgotten Shelf</h1>
  <div class="stats">
    <b id="total-count">—</b> forgotten techniques across <b id="domain-count">8</b> domains
    &nbsp;|&nbsp; <span id="search-status"></span>
  </div>
</div>

<div class="controls">
  <input class="search-box" id="search" type="text" placeholder="Search techniques, applications, origins..." />
  <div class="domain-pills" id="pills"></div>
</div>

<div class="main">
  <div class="list-panel" id="list-panel">
    <div class="result-count" id="result-count"></div>
    <div id="list"></div>
  </div>
  <div class="detail-panel" id="detail">
    <div class="empty-state">Select a technique to explore</div>
  </div>
</div>

<script>
const API = '/api/archaeologist';
let allData = [];
let filtered = [];
let activeDomain = null;
let selectedId = null;
let searchTimeout = null;

const DOMAIN_NAMES = {
  ai_ml: 'AI / ML', finance_trading: 'Finance', sports_science: 'Sports Science',
  audio_acoustics: 'Audio', coaching_psychology: 'Coaching', signal_processing: 'Signal Processing',
  computer_vision: 'Computer Vision', knowledge_management: 'Knowledge Mgmt'
};
const DOMAIN_COLORS = {
  ai_ml: '#378add', finance_trading: '#1d9e75', sports_science: '#ef4444',
  audio_acoustics: '#7c6bc4', coaching_psychology: '#e09040', signal_processing: '#40b0e0',
  computer_vision: '#e06080', knowledge_management: '#d4a853'
};

async function init() {
  const res = await fetch(API);
  const json = await res.json();
  allData = json.discoveries || json;
  document.getElementById('total-count').textContent = allData.length.toLocaleString();
  buildPills();
  applyFilters();
}

function buildPills() {
  const counts = {};
  allData.forEach(d => { counts[d.domain] = (counts[d.domain] || 0) + 1; });
  const pills = document.getElementById('pills');
  pills.innerHTML = '<button class="pill active" onclick="setDomain(null)">ALL<span class="count">' + allData.length + '</span></button>';
  Object.entries(counts).sort((a,b) => b[1]-a[1]).forEach(([domain, count]) => {
    pills.innerHTML += `<button class="pill" data-domain="${domain}" onclick="setDomain('${domain}')">${DOMAIN_NAMES[domain] || domain}<span class="count">${count}</span></button>`;
  });
}

function setDomain(domain) {
  activeDomain = domain;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.toggle('active', domain === null ? !p.dataset.domain : p.dataset.domain === domain);
  });
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = allData.filter(d => {
    if (activeDomain && d.domain !== activeDomain) return false;
    if (q) {
      const hay = [d.technique, d.origin, d.abandoned_reason, d.valid_reason, d.cathedral_application, d.uniqueness, d.build_estimate].join(' ').toLowerCase();
      return q.split(/\s+/).every(word => hay.includes(word));
    }
    return true;
  });
  document.getElementById('result-count').textContent = filtered.length + ' techniques';
  renderList();
}

function renderList() {
  const list = document.getElementById('list');
  // Render in chunks for performance
  const chunk = filtered.slice(0, 200);
  list.innerHTML = chunk.map(d => `
    <div class="item ${d.id === selectedId ? 'selected' : ''}" onclick="showDetail(${d.id})">
      <div class="item-name">${esc(d.technique)}</div>
      <div class="item-meta">
        <span class="domain-tag ${d.domain}">${DOMAIN_NAMES[d.domain] || d.domain}</span>
        ${d.build_estimate ? '<span>' + esc(d.build_estimate.slice(0, 20)) + '</span>' : ''}
      </div>
    </div>
  `).join('');
  if (filtered.length > 200) {
    list.innerHTML += '<div style="padding:12px 16px;color:var(--text3);font-size:11px;">Showing 200 of ' + filtered.length + ' — narrow your search</div>';
  }
}

function showDetail(id) {
  selectedId = id;
  const d = allData.find(x => x.id === id);
  if (!d) return;
  document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
  event?.target?.closest?.('.item')?.classList?.add('selected');

  document.getElementById('detail').innerHTML = `
    <h2>${esc(d.technique)}</h2>
    <span class="domain-tag ${d.domain}" style="margin-bottom:16px;display:inline-block">${DOMAIN_NAMES[d.domain]}</span>
    ${d.build_estimate ? ' <span class="build-badge">' + esc(d.build_estimate) + '</span>' : ''}

    <div class="detail-section" style="margin-top:16px">
      <h3>Origin</h3>
      <p>${esc(d.origin || 'Unknown')}</p>
    </div>

    <div class="detail-section abandoned">
      <h3>Why It Was Abandoned</h3>
      <p>${esc(d.abandoned_reason || 'Unknown')}</p>
    </div>

    <div class="detail-section valid">
      <h3>Why It's Still Valid</h3>
      <p>${esc(d.valid_reason || 'Unknown')}</p>
    </div>

    <div class="detail-section cathedral">
      <h3>Cathedral Application</h3>
      <p>${esc(d.cathedral_application || 'Not assessed')}</p>
    </div>

    <div class="detail-section">
      <h3>Uniqueness</h3>
      <p>${esc(d.uniqueness || 'Unknown')}</p>
    </div>

    ${d.ensemble_score ? `<div class="detail-section"><h3>Ensemble Gate</h3><p>Score: ${d.ensemble_score} — ${d.ensemble_verdict}</p></div>` : ''}
  `;
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(applyFilters, 200);
});

init();
</script>
</body>
</html>
