// ─── RENDER ──────────────────────────────────────────────────
const world = document.getElementById('world');
const svg = document.getElementById('connections');
const tooltip = document.getElementById('tooltip');
const mapEl = document.getElementById('map');

// Stats
document.getElementById('stats').innerHTML = `
  <strong>${nodes.length}</strong> nodes<br>
  <strong>${connections.length}</strong> connections<br>
  <strong>5</strong> zones
`;

// Draw zones
zones.forEach(z => {
  const el = document.createElement('div');
  el.className = `zone ${z.cls}`;
  el.style.cssText = `left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px`;
  el.innerHTML = `<div class="zone-label">${z.label}</div>`;
  world.appendChild(el);
});

// Draw nodes
const nodeEls = {};
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = `node ${n.cls}`;
  el.style.cssText = `left:${n.x}px;top:${n.y}px`;
  el.innerHTML = `
    <div class="node-icon">${n.icon}</div>
    <div class="node-title">${n.title}</div>
    <div class="node-sub">${n.sub}</div>
  `;
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = el.getBoundingClientRect();
    tooltip.innerHTML = `<h3>${n.title}</h3>${n.tip}`;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(r.right + 10, window.innerWidth - 300) + 'px';
    tooltip.style.top = r.top + 'px';
  });
  world.appendChild(el);
  nodeEls[n.id] = el;
});

mapEl.addEventListener('click', () => { tooltip.style.display = 'none'; });

// Draw connections
function drawConnections() {
  const lines = connections.map(c => {
    const fromEl = nodeEls[c.from];
    const toEl = nodeEls[c.to];
    if (!fromEl || !toEl) return '';
    const fr = fromEl.getBoundingClientRect();
    const tr = toEl.getBoundingClientRect();
    const wr = world.getBoundingClientRect();
    const x1 = (fr.left + fr.width/2 - wr.left) / scale;
    const y1 = (fr.top + fr.height/2 - wr.top) / scale;
    const x2 = (tr.left + tr.width/2 - wr.left) / scale;
    const y2 = (tr.top + tr.height/2 - wr.top) / scale;
    // Curved path
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const cx = mx - dy * 0.15;
    const cy = my + dx * 0.15;
    return `<path class="conn ${c.cls}" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}"/>`;
  }).join('');
  svg.innerHTML = lines;
  svg.setAttribute('viewBox', `0 0 ${2200} ${1800}`);
  svg.style.width = '2200px';
  svg.style.height = '1800px';
}

// ─── PAN & ZOOM ──────────────────────────────────────────────
let scale = 0.55;
let panX = -20, panY = -20;
let dragging = false, startX, startY;

function applyTransform() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  drawConnections();
}

mapEl.addEventListener('mousedown', e => {
  dragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  mapEl.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  mapEl.classList.remove('dragging');
});

mapEl.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  scale *= factor;
  scale = Math.max(0.3, Math.min(2.5, scale));
  applyTransform();
}, { passive: false });

function zoomTo(s) {
  scale = Math.max(0.3, Math.min(2.5, s));
  applyTransform();
}
function resetView() {
  scale = 0.55; panX = -20; panY = -20;
  applyTransform();
}

applyTransform();
