<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR Daily Brief — Friday, 16 Oct 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 600px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid #222;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8B2020;
    margin-bottom: 8px;
  }
  .header .date {
    font-size: 28px;
    font-weight: 300;
    color: #fff;
  }
  .header .count {
    font-size: 13px;
    color: #666;
    margin-top: 6px;
  }
  .section {
    margin-bottom: 24px;
    padding: 16px;
    background: #111;
    border-radius: 8px;
    border-left: 3px solid #333;
  }
  .section.risk { border-left-color: #ef4444; }
  .section.absent { border-left-color: #f59e0b; }
  .section.improving { border-left-color: #22c55e; }
  .section.milestone { border-left-color: #8B2020; }
  .section.expiring { border-left-color: #f97316; }
  .section.challenge { border-left-color: #a855f7; }
  .section.focus { border-left-color: #3b82f6; background: #0d1117; }
  .section h2 {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 12px;
  }
  .student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .student-row:last-child { border-bottom: none; }
  .student-name { font-weight: 500; color: #fff; }
  .student-detail { font-size: 13px; color: #888; }
  .risk-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .risk-red { background: #2d1111; color: #ef4444; }
  .risk-yellow { background: #2d2511; color: #f59e0b; }
  .focus-item {
    padding: 10px 0;
    border-bottom: 1px solid #1a1a1a;
    font-size: 15px;
    color: #ccc;
  }
  .focus-item:last-child { border-bottom: none; }
  .focus-name { color: #fff; font-weight: 500; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #111;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 300;
    color: #fff;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #666;
    margin-top: 4px;
  }
  .delta-positive { color: #22c55e; }
  .delta-negative { color: #ef4444; }
  .empty-state {
    color: #444;
    font-style: italic;
    font-size: 14px;
    padding: 8px 0;
  }
  .footer {
    text-align: center;
    padding: 20px 0;
    color: #333;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Basic Reflex</h1>
    <div class="date">Friday, 16 Oct 2026</div>
    <div class="count">2 students tracked</div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-value ">0</div>
      <div class="stat-label">At Risk</div>
    </div>
    <div class="stat-card">
      <div class="stat-value ">0</div>
      <div class="stat-label">Improving</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">0</div>
      <div class="stat-label">Sessions (7d)</div>
    </div>
  </div>

  

  

  

  

  

  

  <div class="section focus">
    <h2>Focus Today</h2>
    
    
    
    
    <div class="focus-item">All good — focus on quality coaching</div>
  </div>

  <div class="footer">Coach Paul &middot; Basic Reflex</div>
</div>
</body>
</html>
