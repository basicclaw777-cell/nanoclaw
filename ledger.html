<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ledger — Cathedral</title>
<style>
  :root{
    --bg:#0a0b0e;--panel:#14161c;--panel2:#1b1e26;--line:#2a2f3a;
    --gold:#c9a24b;--gold-bright:#e3bd63;--ember:#c8542f;
    --ink:#e9e7e1;--muted:#888d99;--green:#22c55e;--blue:#378ADD;--purple:#534AB7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 'SF Mono','Fira Code',monospace;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:30px 20px 80px}
  header{text-align:center;margin-bottom:24px}
  h1{font-size:24px;letter-spacing:1px} h1 .l{color:var(--gold)}
  .tag{color:var(--muted);font-size:12px;margin-top:4px}

  .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;
       padding:6px 14px;border-radius:18px;cursor:pointer}
  .tab:hover{border-color:var(--gold);color:var(--ink)}
  .tab.active{background:var(--gold);color:#1a1405;border-color:var(--gold)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .stat .n{font-size:28px;font-weight:700;color:var(--gold)}
  .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .section{display:none} .section.show{display:block}
  h2{font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;
     border-bottom:1px solid var(--line);padding-bottom:6px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .card .title{font-weight:700;margin-bottom:4px}
  .card .meta{font-size:11px;color:var(--muted)}
  .card .conf{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px}
  .conf.high{background:#22c55e22;color:var(--green);border:1px solid var(--green)}
  .conf.mid{background:#378ADD22;color:var(--blue);border:1px solid var(--blue)}
  .conf.low{background:#c8542f22;color:var(--ember);border:1px solid var(--ember)}

  .grad{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .grad-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative}
  .grad-card .agent-name{font-weight:700;font-size:15px;margin-bottom:6px}
  .grad-card .score{font-size:32px;font-weight:700;margin:8px 0}
  .grad-card .level{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .level.autonomous{background:#22c55e22;color:var(--green);border:1px solid var(--green)}
  .level.trusted{background:#378ADD22;color:var(--blue);border:1px solid var(--blue)}
  .level.limited{background:#EF9F2722;color:#EF9F27;border:1px solid #EF9F27}
  .level.shadow{background:#534AB722;color:var(--purple);border:1px solid var(--purple)}
  .level.simulation{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .level.insufficient_data{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .gates{margin-top:10px;font-size:12px}
  .gates .gate{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a22}
  .gates .gate .v{font-weight:700}
  .decay{font-size:11px;color:var(--muted);margin-top:6px}

  .proposal-actions{display:flex;gap:6px;margin-top:8px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:4px 12px;border-radius:8px;
       font-size:11px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--gold)}
  .btn.accept{border-color:var(--green);color:var(--green)}
  .btn.decline{border-color:var(--ember);color:var(--ember)}

  .empty{text-align:center;color:var(--muted);padding:40px;font-size:13px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:40px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The <span class="l">Ledger</span></h1>
    <div class="tag">Proposal Protocol — how ideas enter the organization, earn trust, and become authority.</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <div class="tab active" data-tab="pending">Pending</div>
    <div class="tab" data-tab="graduation">Graduation</div>
    <div class="tab" data-tab="roads">Roads Not Taken</div>
    <div class="tab" data-tab="emit">Emit Proposal</div>
  </div>

  <div class="section show" id="sec-pending"></div>
  <div class="section" id="sec-graduation"></div>
  <div class="section" id="sec-roads"></div>
  <div class="section" id="sec-emit">
    <h2>Emit a Proposal</h2>
    <div class="card">
      <div style="display:grid;gap:8px">
        <input id="e-agent" placeholder="Agent name" class="btn" style="width:100%;text-align:left;padding:8px 12px">
        <select id="e-domain" class="btn" style="width:100%;text-align:left;padding:8px 12px">
          <option value="finance">Finance</option><option value="coaching">Coaching</option>
          <option value="gym">Gym</option><option value="research">Research</option>
          <option value="builder">Builder</option><option value="entrepreneur">Entrepreneur</option>
        </select>
        <textarea id="e-proposal" placeholder="What's being proposed?" class="btn" style="width:100%;text-align:left;padding:8px 12px;min-height:60px;resize:vertical;font-family:inherit"></textarea>
        <input id="e-confidence" type="number" min="0" max="1" step="0.05" placeholder="Confidence (0-1)" class="btn" style="width:100%;text-align:left;padding:8px 12px">
        <input id="e-expected" placeholder="Expected value (text)" class="btn" style="width:100%;text-align:left;padding:8px 12px">
        <input id="e-expiry" type="date" class="btn" style="width:100%;text-align:left;padding:8px 12px">
        <input id="e-initiative" placeholder="Initiative ID (optional)" class="btn" style="width:100%;text-align:left;padding:8px 12px">
        <button class="btn accept" onclick="emitProposal()" style="padding:10px">Submit Proposal</button>
      </div>
    </div>
  </div>

  <div class="foot">
    The Proposal Protocol — universal contract for earned authority.<br>
    Autonomy is a spectrum, not a switch.
  </div>
</div>

<script>
const $=s=>document.querySelector(s);

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));
    t.classList.add('active');
    $(`#sec-${t.dataset.tab}`).classList.add('show');
  };
});

function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function confClass(c){return c>=0.7?'high':c>=0.4?'mid':'low'}
function ago(iso){if(!iso)return'—';const d=Date.now()-new Date(iso).getTime();const h=d/3600000;if(h<1)return Math.round(h*60)+'m ago';if(h<24)return Math.round(h)+'h ago';return Math.round(h/24)+'d ago'}

async function load(){
  const [sum,pend,grad,roads]=await Promise.all([
    fetch('/ledger/summary').then(r=>r.json()),
    fetch('/ledger/pending').then(r=>r.json()),
    fetch('/ledger/graduation').then(r=>r.json()),
    fetch('/ledger/roads-not-taken').then(r=>r.json()),
  ]);

  $('#stats').innerHTML=`
    <div class="stat"><div class="n">${sum.total}</div><div class="label">Total</div></div>
    <div class="stat"><div class="n">${sum.proposed}</div><div class="label">Pending</div></div>
    <div class="stat"><div class="n">${sum.accepted}</div><div class="label">Accepted</div></div>
    <div class="stat"><div class="n">${sum.declined}</div><div class="label">Declined</div></div>
    <div class="stat"><div class="n">${sum.measured}</div><div class="label">Measured</div></div>
    <div class="stat"><div class="n">${sum.agents.length}</div><div class="label">Agents</div></div>
  `;

  if(!pend.length) $('#sec-pending').innerHTML='<div class="empty">No pending proposals. Agents haven\'t emitted yet — or Paul cleared the queue.</div>';
  else $('#sec-pending').innerHTML='<h2>Pending Proposals</h2>'+pend.map(p=>`
    <div class="card" id="p-${p.id}">
      <div class="title">${esc(p.proposal)}</div>
      <div class="meta">${esc(p.agent)} · ${esc(p.domain)} · ${ago(p.proposed_at)}
        ${p.confidence!=null?`<span class="conf ${confClass(p.confidence)}">${(p.confidence*100).toFixed(0)}%</span>`:''}
        ${p.expiry?` · expires ${p.expiry}`:''}
        ${p.initiative_id?` · initiative: ${esc(p.initiative_id)}`:''}
      </div>
      ${p.evidence?`<div style="margin-top:6px;font-size:12px;color:var(--muted)">${esc(p.evidence).slice(0,200)}</div>`:''}
      <div class="proposal-actions">
        <button class="btn accept" onclick="decideProp(${p.id},'accepted')">Accept</button>
        <button class="btn decline" onclick="decideProp(${p.id},'declined','agent_wrong')">Decline: Wrong</button>
        <button class="btn decline" onclick="decideProp(${p.id},'declined','paul_context')">Decline: I Know More</button>
        <button class="btn decline" onclick="decideProp(${p.id},'declined','right_wrong_timing')">Decline: Wrong Timing</button>
      </div>
    </div>
  `).join('');

  if(!grad.length) $('#sec-graduation').innerHTML='<div class="empty">No agents with proposals yet.</div>';
  else $('#sec-graduation').innerHTML='<h2>Graduation Scores</h2><div class="grad">'+grad.map(g=>`
    <div class="grad-card">
      <div class="agent-name">${esc(g.agent)}</div>
      <div class="score" style="color:${g.score>=0.65?'var(--green)':g.score>=0.35?'var(--gold)':'var(--muted)'}">${g.score!=null?g.score:'—'}</div>
      <span class="level ${g.level}">${g.level.replace('_',' ')}</span>
      ${g.gates?`<div class="gates">
        <div class="gate"><span>Reliability</span><span class="v">${g.gates.reliability}</span></div>
        <div class="gate"><span>Calibration</span><span class="v">${g.gates.calibration}</span></div>
        <div class="gate"><span>Value</span><span class="v">${g.gates.value}</span></div>
        <div class="gate"><span>Containment</span><span class="v">${g.gates.containment}</span></div>
      </div>`:''}
      ${g.decay!=null?`<div class="decay">Trust decay: ${g.decay} · ${g.stats.total} proposals · ${g.stats.measured} measured</div>`:''}
    </div>
  `).join('')+'</div>';

  if(!roads.length) $('#sec-roads').innerHTML='<div class="empty">No declined proposals yet. Roads not taken appear here.</div>';
  else $('#sec-roads').innerHTML='<h2>Roads Not Taken</h2>'+roads.map(r=>`
    <div class="card">
      <div class="title">${esc(r.proposal)}</div>
      <div class="meta">${esc(r.agent)} · ${esc(r.domain)} · declined ${ago(r.decided_at)}
        ${r.decline_bucket?` · ${esc(r.decline_bucket.replace(/_/g,' '))}`:''}
      </div>
      ${r.decline_reason?`<div style="margin-top:4px;font-size:12px;color:var(--muted)">${esc(r.decline_reason)}</div>`:''}
      ${r.outcome?`<div style="margin-top:4px;font-size:12px;color:var(--ember)">Outcome: ${esc(r.outcome)}</div>`:''}
    </div>
  `).join('');
}

async function decideProp(id,decision,bucket){
  await fetch(`/ledger/decide/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({decision,decline_bucket:bucket||null})});
  const el=$(`#p-${id}`);if(el)el.style.opacity='0.3';
  setTimeout(load,500);
}

async function emitProposal(){
  const body={
    agent:$('#e-agent').value,domain:$('#e-domain').value,
    proposal:$('#e-proposal').value,
    confidence:$('#e-confidence').value?+$('#e-confidence').value:null,
    expected_value:$('#e-expected').value||null,
    expiry:$('#e-expiry').value||null,
    initiative_id:$('#e-initiative').value||null,
  };
  if(!body.agent||!body.proposal){alert('Agent and proposal required');return;}
  const r=await fetch('/ledger/emit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.id){$('#e-proposal').value='';load();document.querySelector('[data-tab="pending"]').click();}
}

load();
</script>
</body>
</html>
