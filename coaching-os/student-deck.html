<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Student Deck — Basic Reflex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-rest: #0c0e10;
  --border: #2a2a2a;
  --gold: #f7b408;
  --gold-dim: rgba(247, 180, 8, 0.55);
  --gold-faint: rgba(247, 180, 8, 0.15);
  --gold-glow: rgba(247, 180, 8, 0.25);
  --engine-body: #f7b408;
  --engine-mind: #3b82f6;
  --engine-emotion: #f59e0b;
  --white: #ffffff;
  --text-muted: #888888;
  --text-dim: rgba(255, 255, 255, 0.35);
  --rest-accent: #3b82f6;
  --font-display: 'Anton', sans-serif;
  --font-body: 'Epilogue', sans-serif;
  --fast: 150ms;
  --normal: 300ms;
  --slow: 600ms;
  --slam: cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: pan-x;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Progress bar (top) ────────────────────────────────────── */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  display: flex;
  gap: 2px;
  z-index: 50;
  padding: 0 2px;
  background: var(--bg);
}

.progress-seg {
  flex: 1;
  height: 100%;
  background: rgba(255, 255, 255, 0.08);
  transition: background var(--normal) ease;
  border-radius: 1px;
}
.progress-seg.done { background: var(--white); opacity: 0.4; }
.progress-seg.active { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
.progress-seg.rest-active { background: var(--rest-accent); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }

/* ── Deck viewport ─────────────────────────────────────────── */
.deck-viewport {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

.deck-track {
  display: flex;
  height: 100vh;
  transition: transform var(--normal) ease-out;
  will-change: transform;
}

.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.slide-inner {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 48px 32px;
}

/* ── LANDING / TITLE SLIDE ─────────────────────────────────── */
.slide-landing .slide-inner {
  background: var(--bg);
}

.landing-brand {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0;
  animation: fadeSlideUp 0.5s var(--slam) 0.3s forwards;
}

.landing-title {
  font-family: var(--font-display);
  font-size: clamp(52px, 12vw, 180px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 0.95;
  color: var(--white);
  margin: 20px 0 24px;
  opacity: 0;
  transform: scale(1.8);
  animation: typographicSlam 0.6s var(--slam) 0.6s forwards;
}

.landing-meta {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: clamp(13px, 2vw, 20px);
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  opacity: 0;
  animation: fadeSlideUp 0.4s ease-out 1.0s forwards;
}

.landing-meta .slash {
  color: var(--gold);
  font-family: var(--font-display);
  font-size: clamp(16px, 2.5vw, 24px);
}

.landing-engine {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.engine-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.engine-dot.body { background: var(--engine-body); }
.engine-dot.mind { background: var(--engine-mind); }
.engine-dot.emotion { background: var(--engine-emotion); }

.landing-begin {
  margin-top: 48px;
  font-family: var(--font-display);
  font-size: clamp(18px, 3vw, 28px);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--gold);
  border: none;
  padding: 16px 56px;
  border-radius: 100px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  animation: fadeSlideUp 0.4s ease-out 1.3s forwards;
  transition: transform var(--fast), box-shadow var(--fast);
}
.landing-begin:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 30px var(--gold-glow);
}
.landing-begin:active {
  transform: scale(0.97);
  box-shadow: none;
}

.landing-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
  animation: breathe 5s ease-in-out infinite;
}

@keyframes typographicSlam {
  0%   { opacity: 0; transform: scale(1.8); }
  60%  { opacity: 1; transform: scale(0.97); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes fadeSlideUp {
  0%   { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes breathe {
  0%, 100% { opacity: 0.6; }
  50%      { opacity: 0.8; }
}

/* ── COUNTDOWN OVERLAY ─────────────────────────────────────── */
.countdown-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.countdown-overlay.active { display: flex; }

.countdown-num {
  font-family: var(--font-display);
  font-size: clamp(120px, 30vw, 300px);
  color: var(--gold);
  animation: countPulse 0.8s ease-out;
}

.countdown-go {
  font-family: var(--font-display);
  font-size: clamp(80px, 20vw, 200px);
  color: var(--gold);
  animation: countPulse 0.5s ease-out;
}

@keyframes countPulse {
  0%   { transform: scale(1.5); opacity: 0; }
  40%  { transform: scale(0.95); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── ROUND SLIDE (work) ────────────────────────────────────── */
.slide-round .slide-inner {
  background: var(--bg);
  gap: 0;
}

.round-label {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  position: relative;
  z-index: 2;
}

.round-number {
  font-family: var(--font-display);
  font-size: clamp(100px, 24vw, 260px);
  color: var(--gold);
  line-height: 0.9;
  margin-bottom: 8px;
}

.drill-name {
  font-family: var(--font-display);
  font-size: clamp(32px, 6vw, 72px);
  text-transform: uppercase;
  color: var(--white);
  line-height: 1.05;
  letter-spacing: 0.02em;
  margin-bottom: 12px;
  max-width: 90%;
}

.coaching-cue {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: clamp(16px, 2.5vw, 28px);
  color: var(--text-muted);
  max-width: 600px;
  line-height: 1.4;
}

.round-timer {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 96px);
  color: var(--white);
  font-variant-numeric: tabular-nums;
  margin-top: auto;
  padding-top: 32px;
  transition: color var(--normal), text-shadow var(--normal);
}
.round-timer.warning {
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold-glow);
}
.round-timer.pulse {
  animation: heartbeat 1s ease-in-out;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15%      { transform: scale(1.06); }
  30%      { transform: scale(1); }
}

/* ── Transport controls ────────────────────────────────────── */
.transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
  position: relative;
  z-index: 10;
}

.transport-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  background: transparent;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.transport-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
}
.transport-btn:active {
  transform: scale(0.92);
}

.transport-btn.primary {
  width: 56px;
  height: 56px;
  border-color: var(--gold-dim);
  color: var(--gold);
  font-size: 20px;
}
.transport-btn.primary:hover {
  border-color: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
}

.transport-btn.reset {
  font-size: 14px;
  width: 40px;
  height: 40px;
}

.engine-stripe {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
}
.engine-stripe.body { background: var(--engine-body); }
.engine-stripe.mind { background: var(--engine-mind); }
.engine-stripe.emotion { background: var(--engine-emotion); }
.engine-stripe.mixed {
  background: linear-gradient(90deg, var(--engine-body) 0%, var(--engine-mind) 50%, var(--engine-emotion) 100%);
}

/* ── REST SLIDE ────────────────────────────────────────────── */
.slide-rest .slide-inner {
  background: var(--surface-rest);
}

.slide-rest .round-label { color: rgba(255,255,255,0.3); z-index: 2; }
.slide-rest .round-number {
  color: rgba(255,255,255,0.08);
  -webkit-text-stroke: 1px rgba(255,255,255,0.12);
  font-size: clamp(80px, 20vw, 200px);
}

.rest-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 7vw, 80px);
  text-transform: uppercase;
  color: var(--white);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}

.rest-cue {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: clamp(16px, 2.5vw, 24px);
  color: var(--rest-accent);
  letter-spacing: 1px;
}

.slide-rest .round-timer { color: rgba(255,255,255,0.5); }
.slide-rest .round-timer.warning { color: var(--white); text-shadow: none; }

/* ── COMPLETION SLIDE ──────────────────────────────────────── */
.slide-complete .slide-inner {
  background: var(--bg);
  gap: 12px;
}

.complete-title {
  font-family: var(--font-display);
  font-size: clamp(42px, 8vw, 96px);
  text-transform: uppercase;
  color: var(--gold);
  line-height: 1;
  letter-spacing: 0.02em;
}

.complete-summary {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: clamp(16px, 2.5vw, 24px);
  color: var(--text-muted);
  margin-top: 8px;
}

.complete-line {
  width: 60px;
  height: 2px;
  background: var(--gold);
  margin: 16px 0;
}

.complete-coach {
  font-family: var(--font-display);
  font-size: clamp(14px, 2vw, 20px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold);
}

/* ── WORKOUT SELECTOR (landing, no class) ──────────────────── */
.selector-wrap {
  height: 100vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: 48px 24px 80px;
}

.selector-header {
  text-align: center;
  margin-bottom: 36px;
}

.selector-brand {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.selector-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 48px);
  text-transform: uppercase;
  color: var(--white);
  letter-spacing: 0.02em;
}

.workout-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  max-width: 600px;
  margin: 0 auto;
}

.workout-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all var(--normal) ease;
  text-decoration: none;
  display: block;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.workout-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}
.workout-card.engine-body::before { background: var(--engine-body); }
.workout-card.engine-mind::before { background: var(--engine-mind); }
.workout-card.engine-emotion::before { background: var(--engine-emotion); }

.workout-card:hover, .workout-card:active {
  border-color: var(--gold);
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
}

.wc-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.wc-engine-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.wc-meta {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  text-transform: uppercase;
}

.wc-title {
  font-family: var(--font-display);
  font-size: 26px;
  text-transform: uppercase;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 16px;
}

.wc-start {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--gold);
  border: none;
  padding: 10px 32px;
  border-radius: 100px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--fast), box-shadow var(--fast);
  pointer-events: none;
}

.workout-card:hover .wc-start {
  box-shadow: 0 0 16px var(--gold-glow);
}

.selector-footer {
  text-align: center;
  margin-top: 32px;
}

.selector-coach {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold);
}

/* ── Error ──────────────────────────────────────────────────── */
.error-wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  background: var(--bg);
}

.error-title {
  font-family: var(--font-display);
  font-size: 36px;
  text-transform: uppercase;
  color: #ef4444;
  margin-bottom: 12px;
}

.error-detail {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  color: var(--text-muted);
  line-height: 1.6;
  max-width: 400px;
}

/* ── Loading ───────────────────────────────────────────────── */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 14px;
  color: var(--text-muted);
}

.loading-state .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--gold-faint);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Nav toggle ────────────────────────────────────────────── */
.nav-toggle {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border: none;
  background: rgba(255,255,255,0.06);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--fast);
}
.nav-toggle:hover { background: rgba(255,255,255,0.1); }

.nav-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 10px 16px;
  display: none;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  z-index: 190;
}
.nav-bar.visible { display: flex; }

.nav-bar a {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 6px;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}
.nav-bar a:hover { color: var(--white); background: rgba(255,255,255,0.06); }
.nav-bar a.current { color: var(--gold); }

/* ── Monitor responsive ────────────────────────────────────── */
@media (max-width: 480px) {
  .slide-inner { padding: 40px 24px 32px; }
}

@media (min-width: 1024px) {
  .workout-grid {
    grid-template-columns: repeat(2, 1fr);
    max-width: 800px;
  }
  .coaching-cue { font-size: 24px; }
}

@media (min-width: 1400px) {
  .workout-grid {
    grid-template-columns: repeat(3, 1fr);
    max-width: 1200px;
  }
  .slide-inner { padding: 80px 120px; }
}
</style>
</head>
<body>

<button class="nav-toggle" id="navToggle" onclick="toggleNav()">&#x2026;</button>
<nav class="nav-bar" id="navBar">
  <a href="/coaching-os">Builder</a>
  <a href="/student-deck" class="current">Deck</a>
  <a href="/drill-library">Drills</a>
  <a href="/workout-builder">Planner</a>
</nav>

<div id="app">
  <div class="loading-state">
    <div class="spinner"></div>
    Loading...
  </div>
</div>

<div class="countdown-overlay" id="countdownOverlay">
  <div id="countdownDisplay"></div>
</div>

<script>
const API = '/coaching';

let currentSlide = 0;
let totalSlides = 0;
let touchStartX = 0;
let touchDeltaX = 0;
let isDragging = false;
let navVisible = false;
let roundTimers = {};
let activeTimerInterval = null;
let isRest = [];

// ── Init ────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const classId = params.get('class');

  if (!classId) {
    await showSelector();
    return;
  }

  try {
    const [clsRes, drillsRes] = await Promise.all([
      fetch(`${API}/classes/${classId}`),
      fetch(`${API}/drills`)
    ]);

    if (!clsRes.ok) {
      showError(classId, clsRes.status === 404 ? 'Class not found' : 'Server error');
      return;
    }

    const cls = await clsRes.json();
    const drills = await drillsRes.json();
    const drillMap = {};
    for (const d of drills) drillMap[d.id] = d;
    renderDeck(cls, drillMap);
  } catch (e) {
    showError(classId, 'Cannot reach the API.');
  }
}

// ── Workout Selector (no class ID) ──────────────────────────
async function showSelector() {
  let cardsHTML = '';
  try {
    const res = await fetch(`${API}/classes`);
    const classes = await res.json();

    for (const c of classes) {
      const segs = (c.segments || []).filter(s => s.drill_id);
      const mins = segs.reduce((s, seg) => s + (seg.duration_minutes || 3), 0);
      const engineClass = 'body';
      cardsHTML += `
        <a class="workout-card engine-${engineClass}" href="?class=${c.id}">
          <div class="wc-top">
            <div class="wc-engine-dot" style="background:var(--engine-${engineClass})"></div>
            <span class="wc-meta">${segs.length} RDS &middot; ~${mins || '?'} MIN</span>
          </div>
          <div class="wc-title">${esc(c.title)}</div>
          <div class="wc-start">START WORKOUT &rarr;</div>
        </a>
      `;
    }
  } catch (_) {}

  document.getElementById('app').innerHTML = `
    <div class="selector-wrap">
      <div class="selector-header">
        <div class="selector-brand">BASIC REFLEX</div>
        <div class="selector-title">Today's Workouts</div>
      </div>
      <div class="workout-grid">
        ${cardsHTML || '<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;">No classes found.</p>'}
      </div>
      <div class="selector-footer">
        <div class="selector-coach">Coach Paul</div>
      </div>
    </div>
  `;
}

// ── Error state ─────────────────────────────────────────────
function showError(classId, message) {
  document.getElementById('app').innerHTML = `
    <div class="error-wrap">
      <div class="error-title">ERROR</div>
      <div class="error-detail">
        ${esc(message)}<br><br>
        Class: <strong style="color:var(--white)">${esc(classId)}</strong>
      </div>
    </div>
  `;
}

// ── Render deck ─────────────────────────────────────────────
function renderDeck(cls, drillMap) {
  const segments = (cls.segments || []).filter(s => s.drill_id);
  const totalTime = segments.reduce((sum, s) => sum + (s.duration_minutes || 3), 0);
  const engines = detectEngines(segments, drillMap);
  const primaryEngine = engines[0] || 'body';

  let slidesHTML = '';
  isRest = [];

  // Landing slide
  slidesHTML += `
    <div class="slide slide-landing">
      <div class="slide-inner">
        <div class="landing-vignette"></div>
        <div class="landing-brand">BASIC REFLEX</div>
        <div class="landing-title">${esc(cls.title)}</div>
        <div class="landing-meta">
          <span>${segments.length} ROUNDS</span>
          <span class="slash">/</span>
          <span>${totalTime} MIN</span>
          <span class="slash">/</span>
          <span class="landing-engine">
            <span class="engine-dot ${primaryEngine}"></span>
            ENGINE: ${primaryEngine.toUpperCase()}
          </span>
        </div>
        <button class="landing-begin" onclick="beginWorkout()">BEGIN</button>
      </div>
    </div>
  `;
  isRest.push(false);

  // Round slides
  segments.forEach((seg, i) => {
    const drill = drillMap[seg.drill_id];
    if (!drill) return;

    const time = seg.duration_minutes || 3;
    const drillEngines = safeJSON(drill.engines, ['body']);
    const engine = drillEngines[0] || 'body';
    const engineClass = drillEngines.length > 1 ? 'mixed' : engine;
    const domain = (drill.domain || '').toLowerCase();
    const isRestRound = domain === 'rest' || domain === 'recovery' || (drill.name || '').toLowerCase().includes('rest');
    const cue = seg.drill_notes || drill.description || '';
    const cueOneLine = cue.length > 80 ? cue.substring(0, 77) + '...' : cue;

    isRest.push(isRestRound);
    roundTimers[i + 1] = time * 60;

    const transportHTML = `
      <div class="transport">
        <button class="transport-btn" onclick="transportPrev(event)" title="Previous round">&#9664;</button>
        <button class="transport-btn primary" id="pauseBtn-${i + 1}" onclick="transportPause(${i + 1}, event)" title="Pause / Resume">&#10074;&#10074;</button>
        <button class="transport-btn" onclick="transportNext(event)" title="Next round">&#9654;</button>
        <button class="transport-btn reset" onclick="transportReset(${i + 1}, ${time * 60}, event)" title="Reset timer">&#8634;</button>
      </div>
    `;

    if (isRestRound) {
      slidesHTML += `
        <div class="slide slide-rest" data-round="${i + 1}" data-seconds="${time * 60}">
          <div class="slide-inner">
            <div class="round-label">REST</div>
            <div class="round-number">${i + 1}</div>
            <div class="rest-title">BREATHE</div>
            <div class="rest-cue">${esc(cueOneLine) || 'Reset. Water. Refocus.'}</div>
            <div class="round-timer" id="timer-${i + 1}">${formatTime(time * 60)}</div>
            ${transportHTML}
          </div>
        </div>
      `;
    } else {
      slidesHTML += `
        <div class="slide slide-round" data-round="${i + 1}" data-seconds="${time * 60}">
          <div class="slide-inner">
            <div class="round-label">ROUND</div>
            <div class="round-number">${i + 1}</div>
            <div class="drill-name">${esc(drill.name)}</div>
            <div class="coaching-cue">${esc(cueOneLine)}</div>
            <div class="round-timer" id="timer-${i + 1}">${formatTime(time * 60)}</div>
            ${transportHTML}
            <div class="engine-stripe ${engineClass}"></div>
          </div>
        </div>
      `;
    }
  });

  // Completion slide
  slidesHTML += `
    <div class="slide slide-complete">
      <div class="slide-inner">
        <div class="complete-title">SESSION<br>COMPLETE</div>
        <div class="complete-line"></div>
        <div class="complete-summary">${segments.length} rounds &middot; ${totalTime} minutes</div>
        <div class="complete-coach">Coach Paul</div>
      </div>
    </div>
  `;
  isRest.push(false);

  totalSlides = segments.length + 2;

  // Progress bar
  let progressHTML = '';
  for (let i = 0; i < totalSlides; i++) {
    progressHTML += `<div class="progress-seg ${i === 0 ? 'active' : ''}" data-idx="${i}"></div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="progress-bar" id="progressBar">${progressHTML}</div>
    <div class="deck-viewport" id="viewport">
      <div class="deck-track" id="track">${slidesHTML}</div>
    </div>
  `;

  document.title = `${cls.title} — Basic Reflex`;
  setupNavigation();
}

// ── Begin workout (countdown) ───────────────────────────────
function beginWorkout() {
  const overlay = document.getElementById('countdownOverlay');
  const display = document.getElementById('countdownDisplay');
  overlay.classList.add('active');

  let count = 3;
  display.innerHTML = `<div class="countdown-num">${count}</div>`;

  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      display.innerHTML = `<div class="countdown-num">${count}</div>`;
    } else if (count === 0) {
      display.innerHTML = `<div class="countdown-go">GO</div>`;
    } else {
      clearInterval(interval);
      overlay.classList.remove('active');
      goToSlide(1);
      startRoundTimer(1);
    }
  }, 800);
}

// ── Round timer ─────────────────────────────────────────────
function startRoundTimer(slideIdx) {
  stopActiveTimer();
  const slide = document.querySelectorAll('.slide')[slideIdx];
  if (!slide || (!slide.classList.contains('slide-round') && !slide.classList.contains('slide-rest'))) return;

  const seconds = parseInt(slide.dataset.seconds) || 180;
  const roundNum = parseInt(slide.dataset.round);
  let remaining = seconds;
  const timerEl = document.getElementById(`timer-${roundNum}`);
  if (!timerEl) return;

  timerEl.textContent = formatTime(remaining);
  timerEl.classList.remove('warning', 'pulse');

  activeTimerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      stopActiveTimer();
      timerEl.textContent = '0:00';
      timerEl.classList.add('warning');
      // Auto-advance after 2s
      setTimeout(() => {
        if (currentSlide === slideIdx && currentSlide < totalSlides - 1) {
          goToSlide(currentSlide + 1);
          startRoundTimer(currentSlide);
        }
      }, 2000);
      return;
    }

    timerEl.textContent = formatTime(remaining);

    if (remaining <= 10) {
      timerEl.classList.add('warning');
      timerEl.classList.remove('pulse');
      void timerEl.offsetWidth;
      timerEl.classList.add('pulse');
    }
  }, 1000);
}

function stopActiveTimer() {
  if (activeTimerInterval) {
    clearInterval(activeTimerInterval);
    activeTimerInterval = null;
  }
}

// ── Navigation ──────────────────────────────────────────────
function setupNavigation() {
  const viewport = document.getElementById('viewport');
  if (!viewport) return;

  viewport.addEventListener('touchstart', onTouchStart, { passive: true });
  viewport.addEventListener('touchmove', onTouchMove, { passive: false });
  viewport.addEventListener('touchend', onTouchEnd, { passive: true });
  document.addEventListener('keydown', onKeyDown);
  viewport.addEventListener('click', onClickNav);
}

function onTouchStart(e) {
  touchStartX = e.touches[0].clientX;
  touchDeltaX = 0;
  isDragging = false;
  const track = document.getElementById('track');
  if (track) track.style.transition = 'none';
}

function onTouchMove(e) {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - (e.touches[0].clientY || 0);

  if (!isDragging && Math.abs(dx) > 10) {
    isDragging = true;
    e.preventDefault();
  }

  if (isDragging) {
    touchDeltaX = dx;
    e.preventDefault();
    const track = document.getElementById('track');
    const base = -currentSlide * 100;
    const pct = (dx / window.innerWidth) * 100;
    track.style.transform = `translateX(${base + pct}%)`;
  }
}

function onTouchEnd() {
  if (!isDragging) return;
  isDragging = false;

  const track = document.getElementById('track');
  track.style.transition = `transform var(--normal) ease-out`;

  const threshold = window.innerWidth * 0.2;
  if (touchDeltaX < -threshold && currentSlide < totalSlides - 1) {
    goToSlide(currentSlide + 1);
    startRoundTimer(currentSlide);
  } else if (touchDeltaX > threshold && currentSlide > 0) {
    goToSlide(currentSlide - 1);
    startRoundTimer(currentSlide);
  } else {
    goToSlide(currentSlide);
  }
}

function onKeyDown(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (currentSlide < totalSlides - 1) {
      goToSlide(currentSlide + 1);
      startRoundTimer(currentSlide);
    }
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (currentSlide > 0) {
      goToSlide(currentSlide - 1);
      startRoundTimer(currentSlide);
    }
  }
}

function onClickNav(e) {
  if (e.target.closest('button')) return;
  const x = e.clientX;
  const w = window.innerWidth;
  if (x < w * 0.35 && currentSlide > 0) {
    goToSlide(currentSlide - 1);
    startRoundTimer(currentSlide);
  } else if (x > w * 0.65 && currentSlide < totalSlides - 1) {
    goToSlide(currentSlide + 1);
    startRoundTimer(currentSlide);
  }
}

function goToSlide(n) {
  currentSlide = n;
  const track = document.getElementById('track');
  if (track) {
    track.style.transition = `transform var(--normal) ease-out`;
    track.style.transform = `translateX(-${n * 100}%)`;
  }

  // Update progress bar
  document.querySelectorAll('.progress-seg').forEach((seg, i) => {
    seg.classList.remove('active', 'done', 'rest-active');
    if (i < n) seg.classList.add('done');
    else if (i === n) {
      seg.classList.add(isRest[n] ? 'rest-active' : 'active');
    }
  });
}

// ── Transport controls ──────────────────────────────────────
let isPaused = false;
let pausedRemaining = 0;
let pausedSlide = 0;

function transportPrev(e) {
  e.stopPropagation();
  if (currentSlide > 1) {
    stopActiveTimer();
    isPaused = false;
    goToSlide(currentSlide - 1);
    startRoundTimer(currentSlide);
  }
}

function transportNext(e) {
  e.stopPropagation();
  if (currentSlide < totalSlides - 1) {
    stopActiveTimer();
    isPaused = false;
    goToSlide(currentSlide + 1);
    startRoundTimer(currentSlide);
  }
}

function transportPause(roundNum, e) {
  e.stopPropagation();
  const btn = document.getElementById(`pauseBtn-${roundNum}`);

  if (!isPaused && activeTimerInterval) {
    isPaused = true;
    pausedSlide = currentSlide;
    const timerEl = document.getElementById(`timer-${roundNum}`);
    const parts = timerEl.textContent.split(':');
    pausedRemaining = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    stopActiveTimer();
    if (btn) btn.innerHTML = '&#9654;';
    timerEl.style.opacity = '0.5';
  } else if (isPaused) {
    isPaused = false;
    const timerEl = document.getElementById(`timer-${roundNum}`);
    if (timerEl) timerEl.style.opacity = '1';
    if (btn) btn.innerHTML = '&#10074;&#10074;';
    resumeTimer(roundNum, pausedRemaining);
  }
}

function transportReset(roundNum, totalSeconds, e) {
  e.stopPropagation();
  stopActiveTimer();
  isPaused = false;
  const timerEl = document.getElementById(`timer-${roundNum}`);
  if (timerEl) {
    timerEl.textContent = formatTime(totalSeconds);
    timerEl.classList.remove('warning', 'pulse');
    timerEl.style.opacity = '1';
  }
  const btn = document.getElementById(`pauseBtn-${roundNum}`);
  if (btn) btn.innerHTML = '&#10074;&#10074;';
  startRoundTimer(currentSlide);
}

function resumeTimer(roundNum, remaining) {
  stopActiveTimer();
  const timerEl = document.getElementById(`timer-${roundNum}`);
  if (!timerEl) return;

  let secs = remaining;
  timerEl.textContent = formatTime(secs);

  activeTimerInterval = setInterval(() => {
    secs--;
    if (secs <= 0) {
      stopActiveTimer();
      timerEl.textContent = '0:00';
      timerEl.classList.add('warning');
      setTimeout(() => {
        if (currentSlide < totalSlides - 1) {
          goToSlide(currentSlide + 1);
          startRoundTimer(currentSlide);
        }
      }, 2000);
      return;
    }
    timerEl.textContent = formatTime(secs);
    if (secs <= 10) {
      timerEl.classList.add('warning');
      timerEl.classList.remove('pulse');
      void timerEl.offsetWidth;
      timerEl.classList.add('pulse');
    }
  }, 1000);
}

// ── Nav bar ─────────────────────────────────────────────────
function toggleNav() {
  navVisible = !navVisible;
  document.getElementById('navBar').classList.toggle('visible', navVisible);
}

// ── Helpers ─────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function safeJSON(str, fallback) {
  if (!str) return fallback;
  if (typeof str === 'object') return str;
  try { return JSON.parse(str); }
  catch { return fallback; }
}

function detectEngines(segments, drillMap) {
  const counts = {};
  for (const seg of segments) {
    const drill = drillMap[seg.drill_id];
    if (!drill) continue;
    const engines = safeJSON(drill.engines, ['body']);
    for (const e of engines) counts[e] = (counts[e] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(e => e[0]);
}

// ── Boot ────────────────────────────────────────────────────
init();
</script>
