<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR Coaching Whiteboard</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --wall: #111110;
  --surface: #1a1a18;
  --board-bg: #e8e2d4;
  --board-line: #d0c8b8;
  --border: #222220;
  --gold: #f7b408;
  --gold-dim: rgba(247,180,8,0.12);
  --text: #e8e4dc;
  --text-dim: #6b6560;
  --text-muted: #3a3835;
  --ink: #1a1815;
  --ink-dim: #4a4640;
  --ink-light: #8a8580;
  --marker-red: #c0392b;
  --marker-blue: #2471a3;
  --marker-green: #27ae60;
  --green: #34d399;
  --amber: #f59e0b;
  --red: #ef4444;
  --card-shadow: rgba(0,0,0,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Epilogue', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.br-mark {
  width: 36px; height: 36px; border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: Impact, sans-serif; font-size: 16px; color: var(--gold);
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%);
}
.header h1 { font-size: 15px; font-weight: 600; }
.header small { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }

/* ── Mode tabs ── */
.mode-tabs {
  display: flex; gap: 0; background: var(--wall);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; overflow-x: auto;
}
.mode-tab {
  padding: 10px 16px; font-size: 12px; font-weight: 500;
  color: var(--text-dim); cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all 0.2s; user-select: none;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── Main layout ── */
.planner {
  display: flex; height: calc(100vh - 90px);
  background: var(--wall);
}

/* ── Drill palette (left sidebar) ── */
.palette {
  width: 240px; min-width: 240px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.palette-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.palette-header h3 {
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-weight: 600;
}
.palette-search {
  width: 100%; padding: 8px 12px; margin: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); font-size: 12px;
  font-family: inherit; outline: none;
}
.palette-search::placeholder { color: var(--text-muted); }
.palette-search:focus { border-color: var(--gold); }
.palette-body {
  flex: 1; overflow-y: auto; padding: 8px;
}
.palette-body::-webkit-scrollbar { width: 4px; }
.palette-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.domain-group { margin-bottom: 12px; }
.domain-label {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; padding: 4px 6px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.domain-label .count { font-size: 9px; color: var(--text-muted); }

.drill-card-mini {
  padding: 6px 8px; margin: 2px 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; cursor: grab; font-size: 11px;
  color: var(--text); transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
  position: relative;
}
.drill-card-mini:hover {
  border-color: var(--gold); background: rgba(247,180,8,0.04);
}
.drill-card-mini.used {
  opacity: 0.45; border-style: dashed;
}
.drill-card-mini.used::after {
  content: '✓'; position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%); font-size: 10px; color: var(--green);
}
.drill-card-mini .mode-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.mode-shadow { background: #9b59b6; }
.mode-partner { background: #e67e22; }
.mode-pads { background: var(--gold); }
.mode-bag { background: var(--marker-red); }
.mode-solo { background: var(--marker-blue); }
.mode-group { background: var(--green); }

.add-drill-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; margin: 8px;
  background: var(--gold-dim); border: 1px dashed rgba(247,180,8,0.25);
  border-radius: 4px; color: var(--gold); font-size: 11px;
  cursor: pointer; font-family: inherit; width: calc(100% - 16px);
  transition: all 0.2s;
}
.add-drill-btn:hover { background: rgba(247,180,8,0.15); }

/* ── Board area ── */
.board-area {
  flex: 1; overflow-x: auto; overflow-y: hidden;
  padding: 16px;
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent 199px, rgba(247,180,8,0.03) 199px, rgba(247,180,8,0.03) 200px),
    var(--wall);
}

.template-picker {
  display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
}
.template-picker label {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim); font-weight: 600;
}
.template-btn {
  padding: 4px 10px; font-size: 11px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.template-btn.active { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }

/* ── Section columns ── */
.sections-row {
  display: flex; gap: 12px; height: calc(100% - 44px);
  min-width: max-content;
}

.section-col {
  width: 200px; min-width: 200px;
  background: var(--board-bg);
  border-radius: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

.section-header {
  padding: 10px 12px;
  background: rgba(26,24,21,0.06);
  border-bottom: 2px solid var(--board-line);
  text-align: center;
}
.section-num {
  font-size: 10px; font-weight: 700; color: var(--ink-light);
  letter-spacing: 1px;
}
.section-name {
  font-size: 13px; font-weight: 700; color: var(--ink);
}
.section-purpose {
  font-size: 10px; color: var(--ink-light); line-height: 1.3;
  margin-top: 2px;
}
.section-time {
  font-size: 9px; color: var(--ink-light); margin-top: 4px;
  font-weight: 600;
}

.section-body {
  flex: 1; padding: 8px; overflow-y: auto;
  min-height: 120px;
}
.section-body::-webkit-scrollbar { width: 3px; }
.section-body::-webkit-scrollbar-thumb { background: var(--board-line); border-radius: 2px; }

/* Drop zone */
.section-body.drag-over {
  background: rgba(247,180,8,0.08);
  outline: 2px dashed var(--gold);
  outline-offset: -4px;
}

.section-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--ink-light); font-size: 11px;
  font-style: italic; text-align: center; padding: 12px;
}

/* ── Placed drill card ── */
.placed-card {
  background: #fffdf5;
  border: 1px solid var(--board-line);
  border-left: 4px solid var(--gold);
  border-radius: 3px;
  padding: 8px 10px;
  margin-bottom: 6px;
  box-shadow: 1px 2px 4px var(--card-shadow);
  position: relative;
  cursor: default;
  transition: transform 0.1s, box-shadow 0.1s;
}
.placed-card:hover {
  transform: translateY(-1px);
  box-shadow: 2px 3px 8px var(--card-shadow);
}
.placed-card .card-name {
  font-size: 12px; font-weight: 600; color: var(--ink);
  margin-bottom: 2px;
}
.placed-card .card-mode {
  font-size: 9px; color: var(--ink-light); text-transform: uppercase;
  letter-spacing: 1px;
}
.placed-card .card-block {
  font-size: 9px; color: var(--ink-light);
  margin-top: 4px;
}
.placed-card .card-actions {
  display: flex; gap: 4px; margin-top: 6px;
}
.card-action-btn {
  padding: 2px 6px; font-size: 9px; border-radius: 3px;
  border: 1px solid var(--board-line); background: var(--board-bg);
  color: var(--ink-dim); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.card-action-btn:hover { border-color: var(--ink-dim); }
.card-action-btn.progressive { color: var(--marker-green); border-color: rgba(39,174,96,0.3); }
.card-action-btn.progressive:hover { background: rgba(39,174,96,0.08); }
.card-action-btn.regressive { color: var(--marker-red); border-color: rgba(192,57,43,0.3); }
.card-action-btn.regressive:hover { background: rgba(192,57,43,0.06); }
.card-action-btn.remove { color: var(--ink-light); }

/* Direction badge on card */
.direction-badge {
  position: absolute; top: 4px; right: 4px;
  font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
  padding: 1px 5px; border-radius: 2px; font-weight: 700;
}
.direction-badge.prog { background: rgba(39,174,96,0.12); color: var(--marker-green); }
.direction-badge.reg { background: rgba(192,57,43,0.1); color: var(--marker-red); }

/* ── Previous class overlay ── */
.prev-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: center; justify-content: center;
}
.prev-overlay.open { display: flex; }
.prev-panel {
  background: var(--board-bg); border-radius: 8px;
  max-width: 800px; width: 90%; max-height: 85vh;
  overflow-y: auto; padding: 24px; color: var(--ink);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.prev-panel h2 { font-size: 18px; margin-bottom: 4px; }
.prev-panel .meta { font-size: 12px; color: var(--ink-dim); margin-bottom: 16px; }
.prev-section { margin-bottom: 16px; }
.prev-section h4 {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ink-light); font-weight: 600; margin-bottom: 6px;
  border-bottom: 1px solid var(--board-line); padding-bottom: 4px;
}
.prev-segment {
  padding: 4px 0; border-bottom: 1px dashed rgba(0,0,0,0.06);
  font-size: 12px;
}
.prev-fault {
  padding: 6px 10px; background: rgba(192,57,43,0.06);
  border-left: 3px solid var(--marker-red); margin-bottom: 4px;
  border-radius: 0 3px 3px 0; font-size: 12px;
}
.prev-suggestion {
  padding: 6px 10px; background: rgba(39,174,96,0.06);
  border-left: 3px solid var(--marker-green); margin-bottom: 4px;
  border-radius: 0 3px 3px 0; font-size: 12px;
}
.close-prev {
  position: absolute; top: 12px; right: 16px; background: none;
  border: none; font-size: 20px; color: var(--ink-light); cursor: pointer;
}

/* ── Clients / Internalization Spectrum ── */
.clients-view {
  padding: 16px; overflow-y: auto; height: 100%;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
  align-content: start;
}
.client-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.client-card-header {
  padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
.client-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--gold-dim); border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--gold);
}
.client-name { font-size: 13px; font-weight: 600; flex: 1; }
.client-block {
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-dim); background: var(--bg); padding: 2px 6px;
  border-radius: 3px;
}
.client-body { padding: 8px 12px; }
.client-body.collapsed { display: none; }
.skill-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.skill-row:last-child { border-bottom: none; }
.skill-name { font-size: 11px; color: var(--text-dim); width: 80px; flex-shrink: 0; }
.spectrum-dots {
  display: flex; gap: 3px; flex: 1;
}
.spectrum-dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: pointer; transition: all 0.15s;
  border: 1.5px solid transparent; color: var(--text-muted);
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.spectrum-dot:hover { border-color: var(--gold); }
.spectrum-dot.active { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
.spectrum-dot.active.l0 { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.1); }
.spectrum-dot.active.l1 { color: #f97316; border-color: #f97316; background: rgba(249,115,22,0.1); }
.spectrum-dot.active.l2 { color: #eab308; border-color: #eab308; background: rgba(234,179,8,0.1); }
.spectrum-dot.active.l3 { color: #22c55e; border-color: #22c55e; background: rgba(34,197,94,0.1); }
.spectrum-dot.active.l4 { color: #3b82f6; border-color: #3b82f6; background: rgba(59,130,246,0.1); }
.spectrum-dot.active.l5 { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
.spectrum-level-label {
  font-size: 9px; color: var(--text-muted); width: 50px; text-align: right; flex-shrink: 0;
}
.spectrum-legend {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.legend-item {
  display: flex; align-items: center; gap: 4px; font-size: 9px;
  color: var(--text-dim); letter-spacing: 0.5px;
}
.legend-dot { font-size: 12px; }
.add-client-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 20px; border: 1px dashed rgba(247,180,8,0.25);
  border-radius: 6px; color: var(--gold); font-size: 12px;
  cursor: pointer; background: var(--gold-dim); min-height: 80px;
  font-family: inherit; transition: all 0.2s;
}
.add-client-btn:hover { background: rgba(247,180,8,0.12); }

/* ── Mobile ── */
@media (max-width: 768px) {
  .palette { display: none; }
  .planner { height: auto; min-height: calc(100vh - 90px); }
  .section-col { width: 170px; min-width: 170px; }
  .clients-view { grid-template-columns: 1fr; }
}

/* ── Soundboard (Combo Composer) ── */
.soundboard-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.88); z-index:200;
  align-items:center; justify-content:center;
}
.soundboard-overlay.open { display:flex; }
.soundboard-panel {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  max-width:720px; width:95%; max-height:90vh; overflow-y:auto;
  padding:20px; box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.sb-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.sb-header h2 { font-size:15px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:2px; }
.sb-close { background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; padding:4px 8px; }

.sb-sequence {
  background:var(--surface); border:2px solid var(--gold); border-radius:6px;
  min-height:52px; padding:10px 14px; margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.sb-sequence.empty { border-color:var(--border); }
.sb-sequence-text {
  font-size:14px; font-weight:700; color:var(--text);
  letter-spacing:0.02em; line-height:1.8; flex:1; flex-wrap:wrap; display:flex; align-items:center; gap:4px;
}
.sb-sequence.empty .sb-sequence-text { color:var(--text-muted); font-size:12px; font-weight:400; letter-spacing:0.06em; }
.seq-chip {
  display:inline-block; padding:3px 8px; border-radius:4px; font-size:12px;
  font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
  border:1.5px solid; line-height:1.3; vertical-align:middle;
}
.seq-chip.c-red { color:#ef4444; border-color:rgba(220,38,38,0.35); background:rgba(220,38,38,0.08); }
.seq-chip.c-orange { color:#f97316; border-color:rgba(249,115,22,0.35); background:rgba(249,115,22,0.08); }
.seq-chip.c-green { color:#4ade80; border-color:rgba(74,222,128,0.35); background:rgba(74,222,128,0.08); }
.seq-chip.c-mod { color:#c87d3a; border-color:rgba(199,125,58,0.35); background:rgba(199,125,58,0.08); }
.seq-chip.c-concept { color:#a855f7; border-color:rgba(168,85,247,0.35); background:rgba(168,85,247,0.08); }
.seq-arrow { color:var(--text-muted); font-size:11px; margin:0 2px; vertical-align:middle; }

/* Combo families */
.combo-families { grid-column:1/-1; }
.combo-families-toggle {
  background:none; border:1px solid rgba(220,38,38,0.15); border-radius:4px;
  color:rgba(220,38,38,0.5); font-family:inherit; font-size:9px; font-weight:600;
  letter-spacing:2px; text-transform:uppercase; padding:6px 14px; cursor:pointer;
  width:100%; margin-bottom:8px;
}
.combo-families-toggle:hover { border-color:rgba(220,38,38,0.3); color:rgba(220,38,38,0.7); }
.combo-grid { display:none; gap:6px; }
.combo-grid.open { display:flex; flex-wrap:wrap; gap:6px; }
.combo-group-label {
  width:100%; font-size:8px; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:rgba(220,38,38,0.3); margin-top:4px;
}
.combo-btn {
  background:var(--surface); border:1.5px solid rgba(220,38,38,0.2);
  border-radius:4px; color:#ef4444; font-family:inherit; font-size:9px;
  font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  padding:4px 10px; cursor:pointer; white-space:nowrap;
  transition:background 0.1s, border-color 0.1s;
}
.combo-btn:hover { border-color:rgba(220,38,38,0.4); background:rgba(220,38,38,0.06); }
.combo-btn.flash { background:#ef4444; border-color:#ef4444; color:var(--bg); }
.sb-seq-actions { display:flex; gap:6px; flex-shrink:0; }
.sb-seq-btn {
  padding:5px 10px; background:var(--surface); border:1px solid var(--border);
  border-radius:4px; color:var(--text-dim); cursor:pointer; font-family:inherit;
  font-size:11px; transition:all 0.15s;
}
.sb-seq-btn:hover { border-color:var(--text-dim); color:var(--text); }

.sb-sections { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
@media (max-width:600px) { .sb-sections { grid-template-columns:1fr; } }
.sb-label {
  font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:5px; padding-left:2px;
}
.sb-label.c-punch { color:rgba(239,68,68,0.7); }
.sb-label.c-body { color:rgba(232,228,220,0.5); }
.sb-label.c-defense { color:rgba(249,115,22,0.7); }
.sb-label.c-foot { color:rgba(107,142,90,0.7); }
.sb-label.c-mod { color:rgba(199,125,58,0.7); }

.sb-grid { display:grid; gap:5px; }
.sb-grid.g6 { grid-template-columns:repeat(3,1fr); }
.sb-grid.g4 { grid-template-columns:repeat(4,1fr); }

.sb-btn {
  background:var(--surface); border:2px solid var(--border); border-radius:6px;
  padding:8px 4px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px;
  transition:background 0.1s, border-color 0.1s, transform 0.08s;
  min-height:48px; user-select:none; -webkit-tap-highlight-color:transparent;
}
.sb-btn:active { transform:scale(0.94); }
.sb-btn .sb-num { font-size:20px; font-weight:800; line-height:1; }
.sb-btn .sb-name { font-size:9px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; text-align:center; line-height:1.2; }
.sb-btn .sb-dir { font-size:8px; letter-spacing:0.04em; text-transform:uppercase; }

</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="br-mark">BR</div>
    <div>
      <h1>The Whiteboard</h1>
      <small>coaching cockpit</small>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="template-btn" id="prevBtn" style="color:var(--gold);border-color:rgba(247,180,8,0.3);">← Previous Class</button>
  </div>
</div>

<div class="mode-tabs">
  <div class="mode-tab active" data-mode="plan">Plan Next Class</div>
  <div class="mode-tab" data-mode="review">Review</div>
  <div class="mode-tab" data-mode="week">The Week</div>
  <div class="mode-tab" data-mode="clients">Clients</div>
</div>

<div class="planner" id="planView">
  <!-- Drill palette -->
  <div class="palette">
    <div class="palette-header">
      <h3>Drills</h3>
      <span style="font-size:10px;color:var(--text-muted)" id="drillCount">—</span>
    </div>
    <div style="padding:8px">
      <input class="palette-search" placeholder="Search drills..." id="drillSearch">
    </div>
    <div class="palette-body" id="drillPalette"></div>
    <button class="add-drill-btn" id="addDrillBtn" onclick="openSoundboard()">⚡ Compose</button>
  </div>

  <!-- Board area -->
  <div class="board-area">
    <div class="template-picker">
      <label>Template:</label>
      <button class="template-btn active" data-tmpl="paul_8">Paul 8</button>
      <button class="template-btn" data-tmpl="standard_6">Standard 6</button>
      <button class="template-btn" data-tmpl="kids_5">Kids 5</button>
    </div>
    <div class="sections-row" id="sectionsRow"></div>
  </div>
</div>

<!-- Previous class overlay -->
<div class="prev-overlay" id="prevOverlay">
  <div class="prev-panel" style="position:relative;" id="prevPanel">
    <button class="close-prev" id="closePrev">×</button>
    <div id="prevContent">Loading...</div>
  </div>
</div>

<!-- Soundboard (Combo Composer) -->
<div class="soundboard-overlay" id="soundboardOverlay">
  <div class="soundboard-panel">
    <div class="sb-header">
      <h2>Combo Composer</h2>
      <button class="sb-close" onclick="closeSoundboard()">×</button>
    </div>
    <div class="sb-sequence empty" id="sbSequence">
      <div class="sb-sequence-text" id="sbSequenceText">Tap atoms to compose</div>
      <div class="sb-seq-actions">
        <button class="sb-seq-btn" onclick="sbUndo()">← Undo</button>
        <button class="sb-seq-btn" onclick="sbClear()">Clear</button>
      </div>
    </div>
    <div class="sb-sections" id="sbSections"></div>
    <div class="sb-save-row">
      <input class="sb-name-input" id="sbDrillName" placeholder="Drill name (auto from sequence)" oninput="renderComboCard()">
      <select class="sb-domain-select" id="sbDomain">
        <option value="combos">Combos</option>
        <option value="defense">Defense</option>
        <option value="footwork">Footwork</option>
        <option value="conditioning">Conditioning</option>
        <option value="warm_up">Warm-Up</option>
        <option value="concepts">Concepts</option>
      </select>
      <button class="sb-save-btn secondary" onclick="sbSave(false)">Save</button>
      <button class="sb-save-btn primary" onclick="sbSave(true)">Save & Place</button>
    </div>
    <div class="sb-quick-row">
      <span class="sb-or">or quick add:</span>
      <input class="sb-name-input" id="sbQuickName" placeholder="Type a drill name..." style="flex:1">
      <button class="sb-save-btn secondary" onclick="sbQuickAdd()">+ Add</button>
    </div>
    <div class="series-builder-row">
      <span class="sb-or">series builder:</span>
      <button class="sb-save-btn secondary" onclick="addToSeries()" id="addToSeriesBtn">+ Add to Series</button>
      <button class="sb-save-btn secondary" onclick="clearSeries()" id="clearSeriesBtn" style="display:none">Clear Series</button>
      <span class="series-count-badge" id="seriesCountBadge" style="display:none">0 variants</span>
      <div class="series-items" id="seriesItems"></div>
    </div>
    <div class="series-presets-row">
      <span class="sb-or">foundation:</span>
      <button class="preset-btn red" onclick="loadPreset('jab')">Jab</button>
      <button class="preset-btn red" onclick="loadPreset('cross')">Cross</button>
      <button class="preset-btn red" onclick="loadPreset('hook')">Hook</button>
      <button class="preset-btn red" onclick="loadPreset('uppercut')">Uppercut</button>
      <button class="preset-btn orange" onclick="loadPreset('defense')">Defense</button>
      <button class="preset-btn green" onclick="loadPreset('footwork')">Footwork</button>
    </div>
    <div class="series-presets-row">
      <span class="sb-or">beginner week:</span>
      <button class="preset-btn" onclick="loadPreset('bw_day1')">Day 1</button>
      <button class="preset-btn" onclick="loadPreset('bw_day2')">Day 2</button>
      <button class="preset-btn" onclick="loadPreset('bw_day3')">Day 3</button>
      <button class="preset-btn" onclick="loadPreset('bw_day4')">Day 4</button>
      <button class="preset-btn" onclick="loadPreset('bw_day5')">Day 5</button>
    </div>
    <div class="series-presets-row">
      <span class="sb-or">kids:</span>
      <button class="preset-btn red" onclick="loadPreset('kids_punch')">Punching</button>
      <button class="preset-btn orange" onclick="loadPreset('kids_dodge')">Dodging</button>
      <button class="preset-btn green" onclick="loadPreset('kids_move')">Moving</button>
      <button class="preset-btn" onclick="loadPreset('kids_combo')">Combos</button>
    </div>
    <div class="combo-card-row" id="comboCardRow">
      <div id="comboCardPreview"></div>
      <div class="combo-card-actions">
        <button class="card-btn-primary" onclick="exportComboCard()">Download Card</button>
        <button class="card-btn-secondary" onclick="copyComboCard()">Copy Image</button>
        <button class="card-btn-secondary" onclick="batchExportPresets()" title="Download all Foundation + Beginner Week presets">Batch All</button>
        <div class="card-toggle-row">
          <span class="sb-or">skin:</span>
          <button class="skin-btn active" id="skinLight" onclick="setCardSkin('light')">Email</button>
          <button class="skin-btn" id="skinDark" onclick="setCardSkin('dark')">Instagram</button>
          <label style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-dim);margin-left:8px;cursor:pointer">
            <input type="checkbox" id="cardbackToggle" onchange="renderComboCard()"> Back
          </label>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api/coaching';
let allDrills = [];
let usedDrillIds = new Set();
let templates = {};
let currentTemplate = 'paul_8';
let placedCards = {}; // sectionNum -> [drillId, ...]
let journal = null;

// ── Load data ──
async function init() {
  await Promise.all([loadDrills(), loadTemplates(), loadJournal(), loadUsedDrills()]);
  renderPalette();
  renderSections();
}

async function loadDrills() {
  try {
    const r = await fetch('/api/coaching/drills');
    if (r.ok) { allDrills = await r.json(); return; }
  } catch(e) {}
  // Fallback: embedded drill data will be loaded from DB via API
  // If API not available, we'll use the static list
  allDrills = [];
}

async function loadTemplates() {
  try {
    const r = await fetch('/api/coaching/templates');
    if (r.ok) { const t = await r.json(); t.forEach(x => templates[x.id] = JSON.parse(x.segments)); return; }
  } catch(e) {}
  // Hardcoded fallback
  templates = {
    paul_8: [
      {num:1, name:"Warm-Up", purpose:"General movement, raise temperature", time_range:[5,8]},
      {num:2, name:"Coordination", purpose:"Fun coordination challenge, names, energy", time_range:[5,10]},
      {num:3, name:"Agility", purpose:"Footwork agility, line drills, reactions", time_range:[5,8]},
      {num:4, name:"Footwork", purpose:"Boxing-specific footwork patterns", time_range:[5,10]},
      {num:5, name:"Bagwork", purpose:"Technique on heavy bags", time_range:[10,15]},
      {num:6, name:"Padwork", purpose:"Partner pads — combinations and timing", time_range:[8,12]},
      {num:7, name:"Partner Drill", purpose:"Live partner work — defense, counters, pressure", time_range:[8,12]},
      {num:8, name:"Conditioning", purpose:"Finisher — high intensity or cool-down", time_range:[5,10]}
    ],
    standard_6: [
      {num:1, name:"Icebreaker", purpose:"Break tension, learn names, establish energy", time_range:[5,12]},
      {num:2, name:"Warm-Up", purpose:"Raise heart rate, build coordination", time_range:[8,15]},
      {num:3, name:"Main Drill", purpose:"Teaching block. Technique on bags or shadow", time_range:[12,20]},
      {num:4, name:"Correction", purpose:"Self-correcting drills that expose bad habits", time_range:[8,15]},
      {num:5, name:"Application", purpose:"Partner work. Live but controlled", time_range:[8,15]},
      {num:6, name:"Finisher", purpose:"Fun, shared suffering, or cool-down", time_range:[5,10]}
    ],
    kids_5: [
      {num:1, name:"Game", purpose:"High-energy game, set the tone", time_range:[8,12]},
      {num:2, name:"Movement", purpose:"Coordination and agility through play", time_range:[8,10]},
      {num:3, name:"Technique", purpose:"One thing. Keep it simple. Repetition.", time_range:[10,15]},
      {num:4, name:"Challenge", purpose:"Partner or bag challenge with technique", time_range:[8,12]},
      {num:5, name:"Finisher", purpose:"Team game or conditioning challenge", time_range:[5,8]}
    ]
  };
}

async function loadJournal() {
  try {
    const r = await fetch('/coaching-os/class-journal.json');
    if (r.ok) journal = await r.json();
  } catch(e) {}
}

async function loadUsedDrills() {
  try {
    const r = await fetch('/api/coaching/used-drills');
    if (r.ok) { const ids = await r.json(); usedDrillIds = new Set(ids); return; }
  } catch(e) {}
  // Fallback: hardcoded from class_segments
  usedDrillIds = new Set(['tennis-ball-foot-catch','fw-03','fw-08','df-02','df-01','cb-01','fw-07','line-drill-agility','cb-02']);
}

// ── Render palette ──
function renderPalette() {
  const palette = document.getElementById('drillPalette');
  if (!allDrills.length) {
    // Use hardcoded domain groups if API unavailable
    renderHardcodedPalette();
    return;
  }
  const byDomain = {};
  allDrills.forEach(d => {
    if (!byDomain[d.domain]) byDomain[d.domain] = [];
    byDomain[d.domain].push(d);
  });
  palette.innerHTML = Object.entries(byDomain).sort().map(([domain, drills]) => `
    <div class="domain-group" data-domain="${domain}">
      <div class="domain-label" onclick="this.parentElement.classList.toggle('collapsed')">
        ${domain.replace('_',' ')} <span class="count">${drills.length}</span>
      </div>
      ${drills.sort((a,b) => a.name.localeCompare(b.name)).map(d => drillMiniCard(d)).join('')}
    </div>
  `).join('');
  document.getElementById('drillCount').textContent = allDrills.length;
}

function renderHardcodedPalette() {
  const palette = document.getElementById('drillPalette');
  const domains = {
    combos: [{id:'cb-01',name:'1-2 (Jab-Cross)',mode:'pads',block_min:1,block_max:1},{id:'cb-02',name:'1-2-3 (Jab-Cross-Hook)',mode:'pads',block_min:1,block_max:1},{id:'cb-03',name:'1-1-2',mode:'pads',block_min:2,block_max:2},{id:'cb-04',name:'2-3-2',mode:'pads',block_min:3,block_max:3},{id:'cb-05',name:'1-2-3-2',mode:'pads',block_min:3,block_max:3},{id:'cb-06',name:'Body-Head Switch',mode:'pads',block_min:4,block_max:4},{id:'cb-07',name:'Jab-Body Cross',mode:'pads',block_min:3,block_max:3},{id:'cb-08',name:'3-2-1',mode:'pads',block_min:5,block_max:5},{id:'cb-09',name:'Counter 1-2 off Slip',mode:'partner',block_min:4,block_max:4},{id:'cb-10',name:'Uppercut Entry',mode:'pads',block_min:5,block_max:5},{id:'jab-defend-reset',name:'Jab → Defend → Reset',mode:'solo',block_min:1,block_max:10},{id:'one-two-defend-reset',name:'1-2 → Defend → Reset',mode:'solo',block_min:1,block_max:10},{id:'one-two-hook-defend',name:'1-2-3 → Defend → Reset',mode:'solo',block_min:1,block_max:10},{id:'partner-light-jab-defence',name:'Partner Light Jab + Defence',mode:'partner',block_min:1,block_max:10},{id:'shadow-boxing-free',name:'Shadow Boxing (Free)',mode:'solo',block_min:1,block_max:10}],
    conditioning: [{id:'cn-01',name:'Tabata Bag Rounds',mode:'bag',block_min:1,block_max:1},{id:'cn-02',name:'Burpee-Punch Complex',mode:'solo',block_min:2,block_max:2},{id:'cn-03',name:'Rope Intervals',mode:'solo',block_min:1,block_max:1},{id:'cn-04',name:'Medicine Ball Relay',mode:'partner',block_min:3,block_max:3},{id:'cn-05',name:'Shadow Sprint Intervals',mode:'shadow',block_min:2,block_max:2},{id:'cn-06',name:'Plank-Guard Complex',mode:'solo',block_min:1,block_max:1},{id:'circle-punches-core',name:'Circle Sit-Up Punches',mode:'solo',block_min:1,block_max:10}],
    defense: [{id:'df-01',name:'Slip Inside/Outside',mode:'partner',block_min:2,block_max:2},{id:'df-02',name:'Catch & Return',mode:'pads',block_min:1,block_max:1},{id:'df-03',name:'Roll Under Hook',mode:'partner',block_min:3,block_max:3},{id:'df-04',name:'Parry-Cross',mode:'pads',block_min:2,block_max:2},{id:'df-05',name:'Pull Counter',mode:'partner',block_min:5,block_max:5},{id:'df-06',name:'Shell Defense',mode:'partner',block_min:4,block_max:4},{id:'df-07',name:'Check Hook',mode:'pads',block_min:6,block_max:6},{id:'df-08',name:'Shoulder Roll',mode:'shadow',block_min:7,block_max:7},{id:'one-legged-bagwork',name:'One-Legged Bag Work',mode:'solo',block_min:1,block_max:10}],
    footwork: [{id:'fw-01',name:'L-Step Entry',mode:'shadow',block_min:2,block_max:2},{id:'fw-02',name:'Pendulum Step',mode:'shadow',block_min:1,block_max:1},{id:'fw-03',name:'Lateral Pivot',mode:'shadow',block_min:3,block_max:3},{id:'fw-04',name:'Triangle Step',mode:'partner',block_min:4,block_max:4},{id:'fw-05',name:'Cut-Off Angles',mode:'partner',block_min:5,block_max:5},{id:'fw-06',name:'Ring Generalship',mode:'partner',block_min:7,block_max:7},{id:'fw-07',name:'Cone Weave',mode:'solo',block_min:1,block_max:1},{id:'fw-08',name:'Step-Drag Basics',mode:'shadow',block_min:1,block_max:1},{id:'tennis-ball-basketball',name:'Tennis Ball Basketball',mode:'solo',block_min:1,block_max:10},{id:'numbers-footwork',name:'Numbers Footwork',mode:'solo',block_min:1,block_max:10},{id:'gen-1781020103875-0',name:'Duck & Drive',mode:'partner',block_min:5,block_max:5},{id:'gen-1781020103875-1',name:'Floor Touch Body Hunt',mode:'partner',block_min:5,block_max:5}],
    icebreaker: [{id:'tennis-ball-foot-catch',name:'Tennis Ball Foot Catch',mode:'solo',block_min:1,block_max:10},{id:'push-up-punishment',name:'Friendly Push-Up Tax',mode:'solo',block_min:1,block_max:10}],
    mindset: [{id:'ms-01',name:'Breathing Rounds',mode:'solo',block_min:1,block_max:1},{id:'ms-02',name:'Pressure Comfort',mode:'partner',block_min:3,block_max:3},{id:'ms-03',name:'One Punch Only',mode:'partner',block_min:2,block_max:2},{id:'ms-04',name:'Eyes Open Drill',mode:'partner',block_min:2,block_max:2},{id:'ms-05',name:'Recovery Round',mode:'solo',block_min:3,block_max:3},{id:'ms-06',name:'Visualization',mode:'solo',block_min:1,block_max:1}],
    strategy: [{id:'st-01',name:'Pressure Fighting',mode:'partner',block_min:6,block_max:6},{id:'st-02',name:'Counter Fighting',mode:'partner',block_min:5,block_max:5},{id:'st-03',name:'Range Control',mode:'partner',block_min:4,block_max:4},{id:'st-04',name:'Tempo Breaking',mode:'partner',block_min:7,block_max:7},{id:'st-05',name:'Feint Game',mode:'shadow',block_min:4,block_max:4},{id:'st-06',name:'Body Attack Plan',mode:'pads',block_min:5,block_max:5}],
    warm_up: [{id:'line-drill-agility',name:'Line Drill Agility',mode:'solo',block_min:1,block_max:10},{id:'reaction-drop-drill',name:'Reaction Drop Drill',mode:'solo',block_min:1,block_max:10},{id:'skip-rope-recovery',name:'Skip Rope Recovery',mode:'solo',block_min:1,block_max:10}],
    concepts: [{id:'con-balance',name:'Balance',mode:'concept',block_min:1,block_max:10},{id:'con-holding-line',name:'Holding the Line',mode:'concept',block_min:1,block_max:10},{id:'con-trapping',name:'Trapping',mode:'concept',block_min:3,block_max:10},{id:'con-clinching',name:'Clinching',mode:'concept',block_min:4,block_max:10},{id:'con-distance',name:'Distance Management',mode:'concept',block_min:2,block_max:10},{id:'con-timing',name:'Timing',mode:'concept',block_min:3,block_max:10},{id:'con-rhythm',name:'Rhythm',mode:'concept',block_min:2,block_max:10},{id:'con-body-mechanics',name:'Body Mechanics',mode:'concept',block_min:1,block_max:10},{id:'con-weight-transfer',name:'Weight Transfer',mode:'concept',block_min:1,block_max:10},{id:'con-guard',name:'Guard Position',mode:'concept',block_min:1,block_max:10},{id:'con-ring-iq',name:'Ring IQ',mode:'concept',block_min:5,block_max:10},{id:'con-pressure',name:'Pressure',mode:'concept',block_min:4,block_max:10},{id:'con-angles',name:'Angles',mode:'concept',block_min:3,block_max:10},{id:'con-recovery',name:'Recovery',mode:'concept',block_min:2,block_max:10}]
  };

  // Flatten for allDrills reference
  allDrills = Object.values(domains).flat();

  palette.innerHTML = Object.entries(domains).map(([domain, drills]) => `
    <div class="domain-group" data-domain="${domain}">
      <div class="domain-label" onclick="this.parentElement.classList.toggle('collapsed')">
        ${domain.replace('_',' ')} <span class="count">${drills.length}</span>
      </div>
      ${drills.map(d => drillMiniCard(d)).join('')}
    </div>
  `).join('');
  document.getElementById('drillCount').textContent = allDrills.length;
}

function drillMiniCard(d) {
  const used = usedDrillIds.has(d.id);
  return `
    <div class="drill-card-mini ${used ? 'used' : ''}"
         draggable="true"
         data-drill-id="${d.id}"
         data-name="${esc(d.name)}"
         data-mode="${d.mode || 'solo'}"
         data-block="${d.block_min || 1}-${d.block_max || 10}"
         title="${esc(d.name)} (${d.mode || 'solo'}, Block ${d.block_min || 1}${d.block_max && d.block_max !== d.block_min ? '-'+d.block_max : ''})">
      <span class="mode-dot mode-${d.mode || 'solo'}"></span>
      ${esc(d.name)}
    </div>
  `;
}

// ── Render sections ──
function renderSections() {
  const row = document.getElementById('sectionsRow');
  const segs = templates[currentTemplate] || [];
  placedCards = {};
  segs.forEach(s => placedCards[s.num] = []);

  row.innerHTML = segs.map(s => `
    <div class="section-col" data-section="${s.num}">
      <div class="section-header">
        <div class="section-num">${s.num}</div>
        <div class="section-name">${esc(s.name)}</div>
        <div class="section-purpose">${esc(s.purpose)}</div>
        <div class="section-time">${s.time_range[0]}–${s.time_range[1]} min</div>
      </div>
      <div class="section-body" data-section="${s.num}">
        <div class="section-empty">Drop a drill card here</div>
      </div>
    </div>
  `).join('');

  // Setup drop zones
  row.querySelectorAll('.section-body').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const drillId = e.dataTransfer.getData('text/plain');
      if (drillId) placeDrill(drillId, parseInt(zone.dataset.section));
    });
  });
}

function placeDrill(drillId, sectionNum) {
  const drill = allDrills.find(d => d.id === drillId);
  if (!drill) return;
  if (!placedCards[sectionNum]) placedCards[sectionNum] = [];
  placedCards[sectionNum].push({ id: drillId, direction: null });

  const zone = document.querySelector(`.section-body[data-section="${sectionNum}"]`);
  const empty = zone.querySelector('.section-empty');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'placed-card';
  card.dataset.drillId = drillId;
  card.dataset.mode = drill.mode || 'solo';
  card.innerHTML = `
    <div class="card-name">${esc(drill.name)}</div>
    <div class="card-mode">${drill.mode || 'solo'}</div>
    <div class="card-block">Block ${drill.block_min || 1}${drill.block_max && drill.block_max !== drill.block_min ? '–' + drill.block_max : ''}</div>
    <div class="card-actions">
      <button class="card-action-btn progressive" onclick="setDirection(this,'prog')" title="Progress: what comes next">▲ Next</button>
      <button class="card-action-btn regressive" onclick="setDirection(this,'reg')" title="Regress: fundamentals needed">▼ Back</button>
      <button class="card-action-btn remove" onclick="removeCard(this)" title="Remove">✕</button>
    </div>
  `;
  zone.appendChild(card);

  // Mark as used in palette
  const palCard = document.querySelector(`.drill-card-mini[data-drill-id="${drillId}"]`);
  if (palCard) palCard.classList.add('used');
}

function setDirection(btn, dir) {
  const card = btn.closest('.placed-card');
  const existing = card.querySelector('.direction-badge');
  if (existing) {
    if (existing.classList.contains(dir)) { existing.remove(); return; }
    existing.remove();
  }
  const badge = document.createElement('span');
  badge.className = `direction-badge ${dir}`;
  badge.textContent = dir === 'prog' ? '▲ PROGRESS' : '▼ REGRESS';
  card.appendChild(badge);
}

function removeCard(btn) {
  const card = btn.closest('.placed-card');
  const zone = card.parentElement;
  const drillId = card.dataset.drillId;
  card.remove();
  if (!zone.children.length) {
    zone.innerHTML = '<div class="section-empty">Drop a drill card here</div>';
  }
  // Un-mark in palette only if not in usedDrillIds (historical)
  if (!usedDrillIds.has(drillId)) {
    const palCard = document.querySelector(`.drill-card-mini[data-drill-id="${drillId}"]`);
    if (palCard) palCard.classList.remove('used');
  }
}

// ── Drag from palette ──
document.addEventListener('dragstart', e => {
  const card = e.target.closest('.drill-card-mini');
  if (!card) return;
  e.dataTransfer.setData('text/plain', card.dataset.drillId);
  e.dataTransfer.effectAllowed = 'copy';
});

// ── Click to place (alternative to drag) ──
document.addEventListener('click', e => {
  const card = e.target.closest('.drill-card-mini');
  if (!card || e.target.closest('.placed-card')) return;
  // Find first empty section or section with fewest cards
  const sections = templates[currentTemplate] || [];
  let targetSection = sections[0]?.num || 1;
  let minCards = Infinity;
  sections.forEach(s => {
    const count = (placedCards[s.num] || []).length;
    if (count < minCards) { minCards = count; targetSection = s.num; }
  });
  placeDrill(card.dataset.drillId, targetSection);
});

function renderPrevious() {
  const panel = document.getElementById('prevContent');
  if (!journal || !journal.classes || !journal.classes.length) {
    panel.innerHTML = '<p style="color:var(--ink-light);text-align:center;padding:40px;">No previous class data yet.</p>';
    return;
  }
  const classes = journal.classes.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const cls = classes[0];
  const faults = extractFaults(cls.summary);
  const segments = (cls.segments || []).filter(s => s.drill_name || (s.drill_notes && s.drill_notes !== 'Skipped - started late.'));

  panel.innerHTML = `
    <h2>${esc(cls.title)}</h2>
    <div class="meta">${cls.date || ''} · ${cls.group || ''} · ${cls.athletes || '?'} athletes</div>
    ${cls.summary ? `<div class="prev-section"><h4>Summary</h4><p style="font-size:12px;line-height:1.5">${esc(cls.summary)}</p></div>` : ''}
    ${segments.length ? `
      <div class="prev-section"><h4>Segments (${segments.length})</h4>
        ${segments.map((s,i) => `<div class="prev-segment"><strong>${i+1}. ${esc(s.drill_name || s.segment_name)}</strong>${s.drill_notes ? ' — <span style="color:var(--ink-dim)">'+esc(s.drill_notes)+'</span>' : ''}</div>`).join('')}
      </div>` : ''}
    ${faults.length ? `
      <div class="prev-section"><h4>Faults</h4>
        ${faults.map(f => `<div class="prev-fault">${esc(f)}</div>`).join('')}
      </div>` : ''}
    ${cls.suggestions?.length ? `
      <div class="prev-section"><h4>Corrections / Next Steps</h4>
        ${cls.suggestions.map(s => `<div class="prev-suggestion">${esc(s)}</div>`).join('')}
      </div>` : ''}
  `;
}

function extractFaults(summary) {
  if (!summary) return [];
  const m = summary.match(/(?:main\s+)?faults?:?\s*(.*?)$/i);
  if (!m) return [];
  return m[1].split(/,\s*/).map(f => f.trim()).filter(Boolean);
}

function sbTap(name, btn) {
  let color = 'green';
  if (btn.classList.contains('red')) color = 'red';
  else if (btn.classList.contains('orange')) color = 'orange';
  else if (btn.classList.contains('c-mod')) color = 'mod';
  else if (btn.classList.contains('c-concept')) color = 'concept';
  sbParts.push({ name, color });
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 180);
  if (navigator.vibrate) navigator.vibrate(30);
  sbUpdateDisplay();
}

function sbUndo() { if (sbParts.length) { sbParts.pop(); sbUpdateDisplay(); } }
function sbClear() { sbParts.length = 0; sbUpdateDisplay(); }

function sbUpdateDisplay() {
  const seq = document.getElementById('sbSequence');
  const text = document.getElementById('sbSequenceText');
  if (!sbParts.length) {
    seq.classList.add('empty');
    text.innerHTML = '';
    text.textContent = 'Tap atoms to compose';
  } else {
    seq.classList.remove('empty');
    text.innerHTML = sbParts.map((p, i) =>
      (i > 0 ? '<span class="seq-arrow">→</span>' : '') +
      `<span class="seq-chip c-${p.color}">${esc(p.name)}</span>`
    ).join('');
  }
  renderComboCard();
}

function loadPreset(key) {
  const allPresets = { ...SERIES_PRESETS, ...BEGINNER_WEEK_PRESETS, ...KIDS_PRESETS };
  const preset = allPresets[key];
  if (!preset) return;
  seriesVariants.length = 0;
  preset.variants.forEach(v => seriesVariants.push(v.map(p => ({ ...p }))));
  sbParts.length = 0;
  sbUpdateDisplay();
  document.getElementById('sbDrillName').value = preset.name;
  updateSeriesUI();
}

function updateSeriesUI() {
  const badge = document.getElementById('seriesCountBadge');
  const clearBtn = document.getElementById('clearSeriesBtn');
  const items = document.getElementById('seriesItems');
  if (!seriesVariants.length) {
    badge.style.display = 'none';
    clearBtn.style.display = 'none';
    items.innerHTML = '';
    renderComboCard();
    return;
  }
  badge.style.display = 'inline-block';
  badge.textContent = seriesVariants.length + ' variant' + (seriesVariants.length > 1 ? 's' : '');
  clearBtn.style.display = '';
  items.innerHTML = seriesVariants.map((variant, i) =>
    `<div class="series-item">
      <span class="series-item-num">${i + 1}</span>
      <span class="series-item-text">${variant.map(p => p.name).join(' → ')}</span>
      <button class="series-item-remove" onclick="removeFromSeries(${i})">×</button>
    </div>`
  ).join('');
  renderSeriesCard();
}

function renderSeriesCard() {
  const row = document.getElementById('comboCardRow');
  const preview = document.getElementById('comboCardPreview');
  if (!seriesVariants.length) { row.classList.remove('has-card'); preview.innerHTML = ''; return; }
  row.classList.add('has-card');
  const name = document.getElementById('sbDrillName').value.trim() || guessSeriesName();
  const totalSteps = seriesVariants.reduce((sum, v) => sum + v.length, 0);
  const variantsHTML = seriesVariants.map((variant, i) => {
    const chips = variant.map((p, j) =>
      (j > 0 ? '<span class="combo-card-arrow">→</span>' : '') +
      `<span class="combo-card-chip cc-${p.color}">${esc(p.name)}</span>`
    ).join('');
    return `<div class="series-card-variant">
      <span class="series-card-num">${i + 1}</span>
      <div class="series-card-var-chips">${chips}</div>
    </div>`;
  }).join('');

  const dk = cardSkin === 'dark' ? ' dark' : '';
  preview.innerHTML = `<div class="series-card${dk}" id="comboCardEl">
    <div class="series-card-inner">
      <div class="series-card-title-row">
        <div class="series-card-logo">BR</div>
        <div class="series-card-badge">Series Card</div>
      </div>
      <div class="series-card-name">${esc(name)}</div>
      <div class="series-card-subtitle">${seriesVariants.length} variants · ${totalSteps} total steps</div>
      <div class="series-card-variants">${variantsHTML}</div>
      <div class="series-card-footer">
        <span class="series-card-brand">Basic Reflex · Cuban School of Boxing</span>
        <span class="series-card-count">${seriesVariants.length} level progression</span>
      </div>
    </div>
  </div>` + getCardbackHTML(name, null, cardSkin === 'dark');
}

function guessSeriesName() {
  if (!seriesVariants.length) return 'Series';
  const first = seriesVariants[0];
  if (first.length === 1) return first[0].name + ' Series';
  return first.map(p => p.name).join('-') + ' Series';
}

function renderComboCard() {
  if (seriesVariants.length) { renderSeriesCard(); return; }
  const row = document.getElementById('comboCardRow');
  const preview = document.getElementById('comboCardPreview');
  if (!sbParts.length) { row.classList.remove('has-card'); preview.innerHTML = ''; return; }
  row.classList.add('has-card');
  const name = document.getElementById('sbDrillName').value.trim() || sbParts.map(p => p.name).join(' → ');
  const domainCounts = {};
  sbParts.forEach(p => { domainCounts[p.color] = (domainCounts[p.color] || 0) + 1; });
  const countParts = [];
  if (domainCounts.red) countParts.push(domainCounts.red + ' punch' + (domainCounts.red > 1 ? 'es' : ''));
  if (domainCounts.orange) countParts.push(domainCounts.orange + ' defense');
  if (domainCounts.green) countParts.push(domainCounts.green + ' footwork');
  if (domainCounts.mod) countParts.push(domainCounts.mod + ' mod' + (domainCounts.mod > 1 ? 's' : ''));
  const countText = sbParts.length + ' steps' + (countParts.length ? ' · ' + countParts.join(' · ') : '');
  const chips = sbParts.map((p, i) =>
    (i > 0 ? '<span class="combo-card-arrow">→</span>' : '') +
    `<span class="combo-card-chip cc-${p.color}">${esc(p.name)}</span>`
  ).join('');
  const watermarkNum = sbParts.filter(p => p.color === 'red').length || sbParts.length;
  const dk = cardSkin === 'dark' ? ' dark' : '';
  preview.innerHTML = `<div class="combo-card${dk}" id="comboCardEl">
    <div class="combo-card-watermark">${watermarkNum}</div>
    <div class="combo-card-inner">
      <div class="combo-card-logo-row">
        <div class="combo-card-logo">BR</div>
        <div class="combo-card-badge">Combo Card</div>
      </div>
      <div class="combo-card-name">${esc(name)}</div>
      <div class="combo-card-sequence">${chips}</div>
      <div class="combo-card-divider"></div>
      <div class="combo-card-footer">
        <span class="combo-card-brand">Basic Reflex · Cuban School of Boxing</span>
        <span class="combo-card-count">${countText}</span>
      </div>
    </div>
  </div>` + getCardbackHTML(name, sbParts, cardSkin === 'dark');
}

function exportComboCard() {
  const card = document.getElementById('comboCardEl');
  if (!card) return;
  const bgColor = cardSkin === 'dark' ? '#0a0a0a' : '#ffffff';
  html2canvas(card, { scale: 3, backgroundColor: bgColor, useCORS: true }).then(canvas => {
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      const drillName = document.getElementById('sbDrillName').value.trim() || sbParts.map(p => p.name).join('-');
      const skinSuffix = cardSkin === 'dark' ? '-ig' : '';
      a.download = 'combo-card-' + drillName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + skinSuffix + '.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  });
}

async function copyComboCard() {
  const card = document.getElementById('comboCardEl');
  if (!card) return;
  try {
    const bgColor = cardSkin === 'dark' ? '#0a0a0a' : '#ffffff';
    const canvas = await html2canvas(card, { scale: 3, backgroundColor: bgColor, useCORS: true });
    canvas.toBlob(async b => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
    }, 'image/png');
  } catch(e) { console.error('Copy failed', e); }
}

async function batchExportPresets() {
  const allPresets = { ...SERIES_PRESETS, ...BEGINNER_WEEK_PRESETS, ...KIDS_PRESETS };
  const keys = Object.keys(allPresets);
  const savedSkin = cardSkin;
  for (const key of keys) {
    loadPreset(key);
    renderSeriesCard();
    await new Promise(r => setTimeout(r, 100));
    const card = document.getElementById('comboCardEl');
    if (!card) continue;
    const bgColor = savedSkin === 'dark' ? '#0a0a0a' : '#ffffff';
    const canvas = await html2canvas(card, { scale: 3, backgroundColor: bgColor, useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const skinSuffix = savedSkin === 'dark' ? '-ig' : '';
    a.download = 'series-' + key.replace(/[^a-zA-Z0-9]/g, '-') + skinSuffix + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
    await new Promise(r => setTimeout(r, 300));
  }
}

function addDrillToPalette(drill, domain) {
  let group = document.querySelector(`.domain-group[data-domain="${domain}"]`);
  if (!group) {
    group = document.createElement('div');
    group.className = 'domain-group';
    group.dataset.domain = domain;
    group.innerHTML = `<div class="domain-label" onclick="this.parentElement.classList.toggle('collapsed')">${domain.replace('_',' ')} <span class="count">0</span></div>`;
    document.getElementById('drillPalette').prepend(group);
  }
  group.insertAdjacentHTML('beforeend', drillMiniCard(drill));
  group.querySelector('.count').textContent = group.querySelectorAll('.drill-card-mini').length;
  document.getElementById('drillCount').textContent = allDrills.length;
}

function sbSave(andPlace) {
  if (!sbParts.length) return;
  const name = document.getElementById('sbDrillName').value.trim() || sbParts.map(p => p.name).join(' → ');
  const domain = document.getElementById('sbDomain').value;
  const id = 'sb-' + Date.now();
  const drill = { id, name, mode: 'partner', block_min: 1, block_max: 10, domain };
  allDrills.push(drill);
  addDrillToPalette(drill, domain);
  if (andPlace) {
    const sections = templates[currentTemplate] || [];
    let target = sections[0]?.num || 1, min = Infinity;
    sections.forEach(s => { const c = (placedCards[s.num]||[]).length; if (c < min) { min = c; target = s.num; } });
    placeDrill(id, target);
  }
  sbClear();
  document.getElementById('sbDrillName').value = '';
  closeSoundboard();
}

function sbQuickAdd() {
  const input = document.getElementById('sbQuickName');
  const name = input.value.trim();
  if (!name) return;
  const id = 'idea-' + Date.now();
  const drill = { id, name, mode: 'solo', block_min: 1, block_max: 10, domain: 'ideas' };
  allDrills.push(drill);
  addDrillToPalette(drill, 'ideas');
  input.value = '';
  closeSoundboard();
}

// Soundboard event delegation
document.getElementById('sbSections').addEventListener('click', e => {
  const combo = e.target.closest('.combo-btn');
  if (combo && combo.dataset.combo) {
    const atoms = JSON.parse(combo.dataset.combo);
    atoms.forEach(a => sbParts.push({ name: a, color: 'red' }));
    combo.classList.add('flash');
    setTimeout(() => combo.classList.remove('flash'), 180);
    if (navigator.vibrate) navigator.vibrate(30);
    sbUpdateDisplay();
    return;
  }
  const btn = e.target.closest('.sb-btn') || e.target.closest('.compass-btn');
  if (!btn || !btn.dataset.atom) return;
  sbTap(btn.dataset.atom, btn);
});

document.getElementById('soundboardOverlay').addEventListener('click', e => {

  container.innerHTML = `
    <div class="clients-view">
      <div style="grid-column:1/-1;">
        <div class="spectrum-legend">
          ${SPECTRUM_LEVELS.map((l,i) => `<div class="legend-item"><span class="legend-dot" style="color:${['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','var(--gold)'][i]}">${l.sym}</span> ${i} ${l.name}</div>`).join('')}
        </div>
      </div>
      ${clients.map((c,ci) => `
        <div class="client-card">
          <div class="client-card-header" onclick="toggleClientCard(${ci})">
            <div class="client-avatar">${esc(c.initials)}</div>
            <div class="client-name">${esc(c.name)}</div>
            <div class="client-block">Block ${c.block || '?'}</div>
          </div>
          <div class="client-body" id="clientBody${ci}">
            ${CORE_SKILLS.map(sk => {
              const lvl = (c.skills && c.skills[sk]) || 0;
              return `<div class="skill-row">
                <div class="skill-name">${sk}</div>
                <div class="spectrum-dots">
                  ${SPECTRUM_LEVELS.map((l,li) => `<div class="spectrum-dot ${li <= lvl ? 'active l'+li : ''}" data-ci="${ci}" data-skill="${sk}" data-level="${li}" title="${l.name}: ${l.tip}" onclick="setSpectrumLevel(${ci},'${sk}',${li})">${l.sym}</div>`).join('')}
                </div>
                <div class="spectrum-level-label">${SPECTRUM_LEVELS[lvl].name}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `).join('')}
      <button class="add-client-btn" onclick="addClient()">+ Add Student</button>
    </div>
  `;
}

function toggleClientCard(ci) {
  const body = document.getElementById('clientBody'+ci);
  if (body) body.classList.toggle('collapsed');
}

function setSpectrumLevel(ci, skill, level) {
  const clients = loadClientData();
  if (!clients[ci]) return;
  if (!clients[ci].skills) clients[ci].skills = {};
  clients[ci].skills[skill] = level;
  saveClientData(clients);
  const container = document.getElementById('planView').querySelector('.board-area');
  renderClientsView(container);
}

function addClient() {
  const name = prompt('Student name:');
  if (!name) return;
  const clients = loadClientData();
  const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  clients.push({ name, initials, block: 1, skills: {} });
  saveClientData(clients);
  const container = document.getElementById('planView').querySelector('.board-area');
  renderClientsView(container);
}

// ── Mode tabs ──
document.querySelector('.mode-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.mode-tab');
  if (!tab) return;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const boardArea = document.getElementById('planView').querySelector('.board-area');
  if (tab.dataset.mode === 'clients') {
    renderClientsView(boardArea);
  } else if (tab.dataset.mode !== 'plan') {
    boardArea.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:14px;">
        ${tab.dataset.mode === 'review' ? 'Review mode — see Previous Class button ↑' :
          'Week view coming next — needs schedule data'}
      </div>
    `;
  } else {
    renderSections();
  }
});

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

init();
</script>
</body>
</html>
