<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching OS — Intelligence</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #09090f; color: #e4e4e7; font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; padding: 24px; }
h1 { font-size: 14px; text-transform: uppercase; letter-spacing: 3px; color: #71717a; margin-bottom: 8px; }
a { color: #7c3aed; text-decoration: none; }
.subtitle { color: #52525b; font-size: 11px; margin-bottom: 24px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.panel { background: #0f0f17; border: 1px solid #1c1c2e; border-radius: 6px; padding: 16px; }
.panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #52525b; margin-bottom: 12px; }

.suggestion { padding: 10px; border-radius: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1c1c2e; cursor: pointer; transition: border-color 150ms; }
.suggestion:hover { border-color: #7c3aed; }
.suggestion .left .name { font-size: 13px; color: #e4e4e7; }
.suggestion .left .meta { font-size: 10px; color: #52525b; margin-top: 2px; }
.suggestion .score { font-size: 18px; color: #7c3aed; font-weight: 500; }

.coverage-bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.coverage-bar .label { width: 80px; font-size: 10px; color: #71717a; text-transform: uppercase; }
.coverage-bar .bar { flex: 1; height: 8px; background: #1c1c2e; border-radius: 4px; overflow: hidden; }
.coverage-bar .fill { height: 100%; border-radius: 4px; transition: width 300ms; }
.fill-technique { background: #10b981; }
.fill-concept { background: #818cf8; }
.fill-combo_family { background: #f59e0b; }
.fill-style { background: #ef4444; }
.fill-physical { background: #3b82f6; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { text-align: center; }
.stat .num { font-size: 28px; color: #7c3aed; }
.stat .label { font-size: 10px; color: #52525b; text-transform: uppercase; margin-top: 4px; }

.obs-item { padding: 8px 0; border-bottom: 1px solid #1c1c2e; font-size: 12px; }
.obs-item:last-child { border: none; }
.obs-item .obs-text { color: #a1a1aa; }
.obs-item .obs-meta { color: #3f3f46; font-size: 10px; margin-top: 2px; }

.unused { display: flex; flex-wrap: wrap; gap: 4px; }
.unused .tag { font-size: 10px; padding: 3px 8px; border: 1px solid #27272a; border-radius: 3px; color: #71717a; }

.btn { padding: 6px 12px; border-radius: 4px; border: 1px solid #7c3aed; background: transparent; color: #7c3aed; font-family: inherit; font-size: 11px; cursor: pointer; }
.btn:hover { background: #7c3aed; color: white; }
</style>
</head>
<body>

<h1>Intelligence</h1>
<div class="subtitle"><a href="/coaching-os">&larr; Planner</a> · <a href="/series-graph">Graph</a> · What should you teach next?</div>

<div class="grid">
  <!-- Suggestions -->
  <div class="panel">
    <h2>Suggested Themes (ranked by need)</h2>
    <div id="suggestions"></div>
  </div>

  <!-- Coverage -->
  <div class="panel">
    <h2>Layer Coverage</h2>
    <div id="coverage"></div>
    <div style="margin-top:16px;">
      <h2>Weekly Stats</h2>
      <div class="stat-grid" id="weekStats"></div>
    </div>
  </div>

  <!-- Never-used drills -->
  <div class="panel">
    <h2>Unused Drills</h2>
    <p style="font-size:10px;color:#52525b;margin-bottom:8px;">These drills exist but haven't been taught yet</p>
    <div class="unused" id="unusedDrills"></div>
  </div>

  <!-- Recent observations -->
  <div class="panel">
    <h2>Recent Observations</h2>
    <div id="observations"></div>
  </div>
</div>

<script>
const API = 'http://localhost:8080/coaching';

async function init() {
  const [next, weekly, usage] = await Promise.all([
    fetch(`${API}/next`).then(r => r.json()),
    fetch(`${API}/weekly`).then(r => r.json()),
    fetch(`${API}/drill-usage`).then(r => r.json())
  ]);

  renderSuggestions(next.suggestions);
  renderCoverage(next.coverage);
  renderWeekly(weekly);
  renderUnused(usage.never_used);
  renderObservations(weekly.recent_observations || []);
}

function renderSuggestions(suggestions) {
  document.getElementById('suggestions').innerHTML = suggestions.map(s => `
    <div class="suggestion" onclick="window.location='/coaching-os'">
      <div class="left">
        <div class="name">${s.name}</div>
        <div class="meta">${s.layer} · ${s._days} · taught ${s._count}x</div>
      </div>
      <div class="score">${s._score}</div>
    </div>
  `).join('') || '<div style="color:#52525b;">Teach some classes first — intelligence builds from history</div>';
}

function renderCoverage(coverage) {
  const layers = ['technique', 'concept', 'combo_family', 'style', 'physical'];
  const total = coverage.total_taught || 1;
  document.getElementById('coverage').innerHTML = layers.map(l => {
    const count = (coverage.by_layer || {})[l] || 0;
    const pct = Math.round((count / total) * 100);
    return `
      <div class="coverage-bar">
        <span class="label">${l === 'combo_family' ? 'combo' : l}</span>
        <div class="bar"><div class="fill fill-${l}" style="width:${Math.max(pct, 2)}%"></div></div>
        <span style="font-size:10px;color:#52525b;width:30px;text-align:right;">${pct}%</span>
      </div>`;
  }).join('');
}

function renderWeekly(weekly) {
  document.getElementById('weekStats').innerHTML = `
    <div class="stat"><div class="num">${weekly.classes_taught}</div><div class="label">Classes</div></div>
    <div class="stat"><div class="num">${weekly.themes_covered?.length || 0}</div><div class="label">Themes</div></div>
    <div class="stat"><div class="num">${weekly.observations}</div><div class="label">Notes</div></div>
  `;
}

function renderUnused(unused) {
  const el = document.getElementById('unusedDrills');
  if (!unused.length) { el.innerHTML = '<span style="color:#52525b;font-size:11px;">All drills have been used!</span>'; return; }
  el.innerHTML = unused.slice(0, 30).map(d =>
    `<span class="tag">${d.name}</span>`
  ).join('') + (unused.length > 30 ? `<span class="tag">+${unused.length - 30} more</span>` : '');
}

function renderObservations(obs) {
  const el = document.getElementById('observations');
  if (!obs.length) { el.innerHTML = '<div style="color:#52525b;font-size:11px;">No observations this week</div>'; return; }
  el.innerHTML = obs.map(o => `
    <div class="obs-item">
      <div class="obs-text">${o.observation}</div>
      <div class="obs-meta">${o.timestamp}</div>
    </div>
  `).join('');
}

init();
</script>
</body>
</html>
