<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BR Gym Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #e8e4dc;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  overflow: hidden;
  height: 100vh;
  touch-action: manipulation;
}

.map-container {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}

.map-header h1 {
  font-family: Impact, 'Arial Narrow Bold', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #f7b408;
  font-weight: 400;
}

.map-header a {
  color: #6b6560;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.map-svg-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.map-svg-wrap svg {
  max-width: 380px;
  max-height: 100%;
}

/* Equipment markers */
.equip {
  cursor: pointer;
  transition: opacity 0.15s;
}
.equip:hover { opacity: 0.9; }
.equip.active .marker { filter: drop-shadow(0 0 8px #f7b408); }
.equip.active .marker-fill { fill-opacity: 0.3; }

.marker-fill {
  fill: #f7b408;
  fill-opacity: 0.08;
  transition: fill-opacity 0.2s;
}

.marker-stroke {
  fill: none;
  stroke: #f7b408;
  stroke-width: 2;
}

.marker-label {
  fill: #f7b408;
  font-family: Impact, 'Arial Narrow Bold', sans-serif;
  font-size: 14px;
  text-anchor: middle;
  dominant-baseline: central;
  letter-spacing: 1px;
  pointer-events: none;
}

.marker-sublabel {
  fill: #6b6560;
  font-family: system-ui, sans-serif;
  font-size: 8px;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

.room-outline {
  fill: none;
  stroke: #f7b408;
  stroke-width: 1.5;
  stroke-opacity: 0.2;
}

.room-floor {
  fill: #f7b408;
  fill-opacity: 0.02;
}

.grid-line {
  stroke: #f7b408;
  stroke-opacity: 0.04;
  stroke-width: 0.5;
}

.fixture {
  stroke: #f7b408;
  stroke-opacity: 0.25;
  stroke-width: 1.5;
  fill: none;
}

.fixture-fill {
  fill: #f7b408;
  fill-opacity: 0.04;
}

.fixture-label {
  fill: #6b6560;
  font-family: system-ui, sans-serif;
  font-size: 9px;
  text-anchor: middle;
  pointer-events: none;
}

/* Bottom sheet */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 10;
}
.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 70vh;
  background: #141414;
  border-top: 1px solid #f7b40833;
  border-radius: 16px 16px 0 0;
  transform: translateY(100%);
  transition: transform 0.3s ease-out;
  z-index: 11;
  display: flex;
  flex-direction: column;
}
.sheet.open {
  transform: translateY(0);
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: #333;
  border-radius: 2px;
  margin: 10px auto 0;
  flex-shrink: 0;
}

.sheet-header {
  padding: 12px 20px 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.sheet-icon {
  width: 40px;
  height: 40px;
  border: 2px solid #f7b408;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Impact, sans-serif;
  font-size: 14px;
  color: #f7b408;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.sheet-icon.square { border-radius: 6px; }

.sheet-title-group { flex: 1; }

.sheet-title {
  font-family: Impact, 'Arial Narrow Bold', sans-serif;
  font-size: 18px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #e8e4dc;
  font-weight: 400;
}

.sheet-type {
  font-size: 11px;
  color: #6b6560;
  margin-top: 2px;
}

.sheet-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #222;
  padding: 0 20px;
  flex-shrink: 0;
}

.sheet-tab {
  padding: 10px 16px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #6b6560;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.sheet-tab.active {
  color: #f7b408;
  border-bottom-color: #f7b408;
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 20px 24px;
  -webkit-overflow-scrolling: touch;
}

.drill-item {
  padding: 10px 12px;
  border: 1px solid #222;
  border-radius: 6px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.drill-item:hover {
  border-color: #f7b40844;
  background: #1a1a18;
}

.drill-name {
  font-size: 13px;
  color: #e8e4dc;
}

.drill-domain {
  font-size: 10px;
  color: #6b6560;
  margin-top: 2px;
}

.drill-badge {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 9px;
  padding: 2px 6px;
  border: 1px solid #333;
  color: #6b6560;
  text-transform: uppercase;
  border-radius: 3px;
  flex-shrink: 0;
}
.drill-badge.used {
  border-color: #34d39955;
  color: #34d399;
}

.empty-state {
  text-align: center;
  padding: 24px;
  color: #3a3835;
  font-size: 12px;
}

.drill-count {
  font-size: 11px;
  color: #3a3835;
  padding: 4px 0 8px;
}
</style>
</head>
<body>

<div class="map-container">
  <div class="map-header">
    <h1>Gym Map</h1>
    <a href="/hub">Hub</a>
  </div>

  <div class="map-svg-wrap">

        <text class="marker-label" style="font-size:10px" x="200" y="200">3</text>
        <circle class="marker-fill" cx="245" cy="200" r="10"/>
        <circle class="marker-stroke" cx="245" cy="200" r="10" stroke-width="1"/>
        <text class="marker-label" style="font-size:10px" x="245" y="200">4</text>

      <!-- HEAVY BAGS B1-B4 (right column) -->

        <text class="marker-label" x="305" y="200">B2</text>
      </g>
      <g class="equip" data-id="B3" data-name="B3" data-type="Heavy Bag" data-domains="combos,defense,strategy,conditioning">
        <circle class="marker-fill" cx="305" cy="270" r="22"/>

      <!-- BODY BAGS B6, B7 (upper area) -->

        <ellipse class="marker-stroke" cx="245" cy="100" rx="18" ry="22"/>

      <g class="equip" data-id="B7" data-name="B7" data-type="Body Bag" data-domains="combos,defense">

        <line stroke="#f7b408" stroke-opacity="0.2" stroke-width="1" x1="300" y1="565" x2="300" y2="605"/>
        <line stroke="#f7b408" stroke-opacity="0.2" stroke-width="1" x1="280" y1="585" x2="320" y2="585"/>
        <circle cx="300" cy="585" r="14" stroke="#f7b408" stroke-width="0.8" stroke-opacity="0.2" fill="none"/>

    </svg>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Bottom Sheet -->
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-icon" id="sheetIcon">B1</div>
    <div class="sheet-title-group">
      <div class="sheet-title" id="sheetTitle">B1</div>
      <div class="sheet-type" id="sheetType">Heavy Bag</div>
    </div>
  </div>
  <div class="sheet-tabs">
    <div class="sheet-tab active" data-tab="relevant">Relevant</div>
    <div class="sheet-tab" data-tab="all">All Drills</div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
const API = '/coaching/drill-usage';
let allDrills = [];
let activeEquip = null;
let activeTab = 'relevant';

async function loadDrills() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    allDrills = [
      ...data.used.map(d => ({ ...d, status: 'used' })),
      ...data.never_used.map(d => ({ ...d, status: 'never' }))
    ].sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
  } catch (e) {
    allDrills = [];
  }
}

function openSheet(el) {
  const id = el.dataset.id;
  const name = el.dataset.name;
  const type = el.dataset.type;
  const domains = (el.dataset.domains || '').split(',').filter(Boolean);

  if (activeEquip) activeEquip.classList.remove('active');
  el.classList.add('active');
  activeEquip = el;

  document.getElementById('sheetIcon').textContent = name;
  document.getElementById('sheetIcon').className = 'sheet-icon' + (['box', 'core', 'rack'].includes(id) ? ' square' : '');
  document.getElementById('sheetTitle').textContent = name;
  document.getElementById('sheetType').textContent = type;

  activeTab = 'relevant';
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'relevant'));

  renderDrills(domains);

  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  if (activeEquip) {
    activeEquip.classList.remove('active');
    activeEquip = null;
  }
}

function renderDrills(domains) {
  const body = document.getElementById('sheetBody');
  let drills;

  if (activeTab === 'relevant' && domains.length > 0) {
    drills = allDrills.filter(d => domains.includes(d.domain));
  } else {
    drills = allDrills;
  }

  if (drills.length === 0) {
    body.innerHTML = domains.length === 0
      ? '<div class="empty-state">No drills mapped to this equipment</div>'
      : '<div class="empty-state">No matching drills found</div>';
    return;
  }

  const countHtml = `<div class="drill-count">${drills.length} drill${drills.length !== 1 ? 's' : ''}</div>`;

  body.innerHTML = countHtml + drills.map(d => `
    <div class="drill-item">
      <div>
        <div class="drill-name">${d.name || d.id}</div>
        <div class="drill-domain">${d.domain}</div>
      </div>
      <span class="drill-badge ${d.status === 'used' ? 'used' : ''}">${d.status === 'used' ? 'used' : 'new'}</span>
    </div>
  `).join('');
}

// Event listeners
document.querySelectorAll('.equip').forEach(el => {
  el.addEventListener('click', () => openSheet(el));
});

document.getElementById('overlay').addEventListener('click', closeSheet);

document.querySelectorAll('.sheet-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t === tab));
    const domains = activeEquip ? (activeEquip.dataset.domains || '').split(',').filter(Boolean) : [];
    renderDrills(domains);
  });
});

// Init
loadDrills();
</script>
</body>
</html>
