<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth Agent — Basic Reflex</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0c0b09; --surface: #151412; --surface-2: #1c1a17;
  --border: #2a2723; --border-hover: #3d3832;
  --text: #EDE5D8; --text-muted: #a89f92; --text-dim: #6b6358;
  --maroon: #7B3040; --gold: #C4943A; --green: #4ade80; --red: #ef4444;
  --amber: #f59e0b; --blue: #60a5fa; --purple: #a855f7;
}
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

.header { display:flex; align-items:center; gap:16px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.header h1 { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:var(--green); }

.tabs { display:flex; gap:4px; margin-bottom:20px; }
.tab { padding:8px 16px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text-dim); font-family:inherit; font-size:13px; cursor:pointer; transition:all 0.2s; }
.tab:hover { color:var(--text-muted); }
.tab.active { background:var(--surface); border-color:var(--border); color:var(--text); }

.panel { display:none; }
.panel.active { display:block; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
.card-title { font-weight:600; font-size:15px; margin-bottom:8px; }
.card-meta { font-size:11px; color:var(--text-dim); margin-bottom:8px; }

.post-card { display:flex; gap:12px; align-items:flex-start; }
.post-day { font-family:'Bebas Neue',sans-serif; font-size:14px; color:var(--gold); min-width:60px; }
.post-type { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:600; text-transform:uppercase; }
.type-reel { background:rgba(168,85,247,0.15); color:var(--purple); }
.type-carousel { background:rgba(96,165,250,0.15); color:var(--blue); }
.type-post { background:rgba(74,222,128,0.15); color:var(--green); }
.type-story { background:rgba(245,158,11,0.15); color:var(--amber); }
.post-topic { font-size:14px; font-weight:500; }
.post-angle { font-size:13px; color:var(--text-muted); font-style:italic; }
.post-visual { font-size:12px; color:var(--text-dim); margin-top:4px; }

.pipeline-stage { display:inline-block; font-size:10px; padding:2px 8px; border-radius:4px; font-weight:600; }
.stage-cold { background:rgba(96,165,250,0.15); color:var(--blue); }
.stage-contacted { background:rgba(245,158,11,0.15); color:var(--amber); }
.stage-proposal { background:rgba(168,85,247,0.15); color:var(--purple); }
.stage-won { background:rgba(74,222,128,0.15); color:var(--green); }

.seo-keyword { font-family:'DM Mono',monospace; font-size:13px; }
.seo-rank { font-family:'DM Mono',monospace; font-size:12px; color:var(--gold); }

.btn { padding:8px 16px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-family:inherit; font-size:13px; cursor:pointer; transition:all 0.2s; }
.btn:hover { border-color:var(--border-hover); color:var(--text); }
.btn-green { border-color:var(--green); color:var(--green); }
.btn-green:hover { background:var(--green); color:var(--bg); }

.empty { text-align:center; padding:40px; color:var(--text-dim); }

.toast { position:fixed; bottom:24px; right:24px; padding:10px 20px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:13px; opacity:0; transform:translateY(10px); transition:all 0.3s; pointer-events:none; z-index:100; }
.toast.show { opacity:1; transform:translateY(0); }

@media (max-width:600px) { .post-card { flex-direction:column; gap:4px; } .post-day { min-width:auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>GROWTH AGENT</h1>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('calendar')">Content Calendar</button>
    <button class="tab" onclick="showTab('corporate')">Corporate</button>
    <button class="tab" onclick="showTab('newsletter')">Newsletter</button>
    <button class="tab" onclick="showTab('seo')">SEO</button>
  </div>

  <div class="panel active" id="panel-calendar"></div>
  <div class="panel" id="panel-corporate"></div>
  <div class="panel" id="panel-newsletter"></div>
  <div class="panel" id="panel-seo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${name}')"]`).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3000); }

async function loadCalendar() {
  const panel = document.getElementById('panel-calendar');
  try {
    const res = await fetch('/growth/calendar');
    const data = await res.json();
    if (!data.ok || !data.calendar) {
      panel.innerHTML = '<div class="empty">No calendar yet.<br><button class="btn btn-green" style="margin-top:12px" onclick="generateCalendar()">Generate This Week</button></div>';
      return;
    }
    const c = data.calendar;
    let html = `<div class="card"><div class="card-title">Week of ${esc(c.week)}</div>`;
    html += `<div class="card-meta">Principle: "${esc(c.principle)}"`;
    if (c.featuredBlock) html += ` | Block ${c.featuredBlock.num}: ${esc(c.featuredBlock.name)}`;
    html += `</div></div>`;
    for (const p of c.posts || []) {
      const tc = 'type-' + (p.type || 'post');
      html += `<div class="card"><div class="post-card">`;
      html += `<div class="post-day">${esc(p.day || '')}</div>`;
      html += `<div><span class="post-type ${tc}">${esc(p.type || 'post')}</span> `;
      html += `<span class="post-topic">${esc(p.topic || '')}</span>`;
      html += `<div class="post-angle">${esc(p.angle || '')}</div>`;
      if (p.visual) html += `<div class="post-visual">${esc(p.visual)}</div>`;
      html += `</div></div></div>`;
    }
    html += `<button class="btn" onclick="generateCalendar()" style="margin-top:8px">Regenerate</button>`;
    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = '<div class="empty">Error loading calendar</div>'; }
}

async function generateCalendar() {
  toast('Generating calendar...');
  try {
    const res = await fetch('/growth/calendar/generate', { method:'POST' });
    const data = await res.json();
    if (data.ok) { toast('Calendar generated!'); loadCalendar(); }
    else toast('Error: ' + (data.error || 'unknown'));
  } catch(e) { toast('Error: ' + e.message); }
}

async function loadCorporate() {
  const panel = document.getElementById('panel-corporate');
  try {
    const res = await fetch('/growth/corporate');
    const data = await res.json();
    if (!data.ok) { panel.innerHTML = '<div class="empty">Error loading pipeline</div>'; return; }
    const p = data.pipeline;
    if (!p.prospects || p.prospects.length === 0) {
      panel.innerHTML = '<div class="empty">No prospects yet. Add via /growth corporate add on Telegram.</div>';
      return;
    }
    let html = `<div class="card"><div class="card-title">Corporate Pipeline</div><div class="card-meta">${p.prospects.length} prospects | Updated: ${(p.lastUpdated||'never').split('T')[0]}</div></div>`;
    for (const pr of p.prospects) {
      const sc = 'stage-' + pr.stage;
      html += `<div class="card"><span class="pipeline-stage ${sc}">${esc(pr.stage)}</span> `;
      html += `<strong>${esc(pr.company)}</strong> — ${esc(pr.contact_name)} (${esc(pr.industry)})`;
      html += `<div class="card-meta">${esc(pr.email)} | ${esc(pr.area)}</div></div>`;
    }
    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = '<div class="empty">Error loading pipeline</div>'; }
}

async function loadNewsletter() {
  const panel = document.getElementById('panel-newsletter');
  try {
    const res = await fetch('/growth/newsletter');
    const data = await res.json();
    if (!data.ok || !data.newsletter) {
      panel.innerHTML = '<div class="empty">No newsletter draft yet.<br><button class="btn btn-green" style="margin-top:12px" onclick="generateNewsletter()">Generate Draft</button></div>';
      return;
    }
    const n = data.newsletter;
    let html = `<div class="card"><div class="card-title">Lab Report — ${esc(n.monthName)}</div>`;
    html += `<div class="card-meta">Status: ${n.status} | Generated: ${(n.generated||'').split('T')[0]}</div></div>`;
    html += `<div class="card" style="white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--text-muted)">${esc(n.draft || '(empty)')}</div>`;
    html += `<button class="btn" onclick="generateNewsletter()" style="margin-top:8px">Regenerate</button>`;
    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = '<div class="empty">Error loading newsletter</div>'; }
}

async function generateNewsletter() {
  toast('Generating newsletter...');
  try {
    const res = await fetch('/growth/newsletter/generate', { method:'POST' });
    const data = await res.json();
    if (data.ok) { toast('Newsletter drafted!'); loadNewsletter(); }
    else toast('Error: ' + (data.error || 'unknown'));
  } catch(e) { toast('Error: ' + e.message); }
}

async function loadSEO() {
  const panel = document.getElementById('panel-seo');
  try {
    const res = await fetch('/growth/seo');
    const data = await res.json();
    if (!data.ok) { panel.innerHTML = '<div class="empty">Error loading SEO</div>'; return; }
    const s = data.seo;
    let html = '<div class="card"><div class="card-title">Target Keywords</div>';
    for (const k of s.targetKeywords || []) {
      html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">`;
      html += `<span class="seo-keyword">${esc(k.keyword)}</span>`;
      html += `<span class="seo-rank">${k.currentRank ? '#'+k.currentRank : 'unranked'}</span></div>`;
    }
    html += '</div>';

    html += '<div class="card"><div class="card-title">Blog Pipeline</div>';
    for (const b of s.blogPipeline || []) {
      const icon = b.status === 'published' ? '✅' : b.status === 'writing' ? '✍️' : '📋';
      html += `<div style="padding:4px 0">${icon} ${esc(b.topic)}</div>`;
    }
    html += '</div>';

    html += '<div class="card"><div class="card-title">Pages</div>';
    for (const p of s.pages || []) {
      const icon = p.status === 'live' ? '✅' : '📝';
      html += `<div style="padding:4px 0">${icon} <strong>${esc(p.page)}</strong> — ${esc(p.metaTitle||'')}</div>`;
    }
    html += '</div>';
    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = '<div class="empty">Error loading SEO</div>'; }
}

loadCalendar(); loadCorporate(); loadNewsletter(); loadSEO();
</script>
</body>
</html>
