<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Health - Domain Heat Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&display=swap');

  :root {
    --bg: #0A0A0A;
    --surface: #141414;
    --border: #222;
    --gold: #f7b408;
    --gold-dim: #a07a06;
    --text: #e8e8e8;
    --text-dim: #888;
    --green: #22c55e;
    --green-dim: #166534;
    --yellow: #eab308;
    --yellow-dim: #854d0e;
    --red: #ef4444;
    --red-dim: #991b1b;
    --blue: #3b82f6;
    --purple: #a855f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Epilogue', system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -0.02em;
  }

  .meta {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .summary-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    min-width: 120px;
  }

  .stat-card .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .stat-card .value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .vital { color: var(--green); }
  .stable { color: var(--blue); }
  .aging { color: var(--yellow); }
  .weakened { color: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }

  .domain-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    transition: border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .domain-card:hover {
    border-color: var(--gold-dim);
  }

  .domain-card .heat-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .domain-card .name {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 8px;
    margin-top: 4px;
  }

  .domain-card .section-tag {
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--border);
    color: var(--text-dim);
    margin-left: 6px;
    vertical-align: middle;
  }

  .domain-card .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    padding: 3px 0;
    color: var(--text-dim);
  }

  .domain-card .row .val {
    color: var(--text);
    font-weight: 600;
  }

  .bar-row {
    display: flex;
    gap: 2px;
    height: 14px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }

  .bar-seg {
    height: 100%;
    transition: width 0.3s;
  }

  .bar-vital { background: var(--green); }
  .bar-stable { background: var(--blue); }
  .bar-aging { background: var(--yellow); }
  .bar-weakened { background: var(--red); }

  .most-connected {
    margin-top: 24px;
  }

  .most-connected h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .conn-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .conn-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
  }

  .conn-item .file {
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 12px;
  }

  .conn-item .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    min-width: 40px;
    text-align: center;
  }

  .badge-vital { background: var(--green-dim); color: var(--green); }
  .badge-stable { background: #1e3a5f; color: var(--blue); }
  .badge-aging { background: var(--yellow-dim); color: var(--yellow); }
  .badge-weakened { background: var(--red-dim); color: var(--red); }

  .conn-count {
    color: var(--gold);
    font-weight: 700;
    font-size: 0.9rem;
    min-width: 30px;
    text-align: right;
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
    font-size: 1rem;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--gold-dim);
    text-decoration: none;
    font-size: 0.8rem;
  }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>

<a class="back-link" href="/">&larr; Cathedral Home</a>

<div id="app">
  <div class="loading">Loading vault health data...</div>
</div>

<script>
(async function() {
  const app = document.getElementById('app');

  try {
    const res = await fetch('/api/vault-health');
    if (!res.ok) throw new Error('Failed to load data');
    const data = await res.json();

    const hc = data.healthCounts || {};
    const domains = data.domains || [];
    const mc = data.mostConnected || [];

    // Determine heat color for a domain
    function heatColor(d) {
      const pctHealthy = ((d.vital + d.stable) / Math.max(d.total, 1)) * 100;
      const avgConn = d.avgConnections || 0;
      if (pctHealthy >= 70 && avgConn >= 1.5) return 'var(--green)';
      if (pctHealthy >= 50 || avgConn >= 1.0) return 'var(--yellow)';
      return 'var(--red)';
    }

    function badgeClass(health) {
      return 'badge-' + health.toLowerCase();
    }

    let html = `
      <div class="header">
        <h1>Vault Health &mdash; Domain Heat Map</h1>
        <span class="meta">Generated: ${new Date(data.generated).toLocaleString()}</span>
      </div>

      <div class="summary-bar">
        <div class="stat-card">
          <div class="label">Total Files</div>
          <div class="value">${data.total}</div>
        </div>
        <div class="stat-card">
          <div class="label">VITAL</div>
          <div class="value vital">${hc.VITAL || 0}</div>
        </div>
        <div class="stat-card">
          <div class="label">STABLE</div>
          <div class="value stable">${hc.STABLE || 0}</div>
        </div>
        <div class="stat-card">
          <div class="label">AGING</div>
          <div class="value aging">${hc.AGING || 0}</div>
        </div>
        <div class="stat-card">
          <div class="label">WEAKENED</div>
          <div class="value weakened">${hc.WEAKENED || 0}</div>
        </div>
        <div class="stat-card">
          <div class="label">Isolated</div>
          <div class="value" style="color:var(--text-dim)">${data.isolated || 0}</div>
        </div>
      </div>

      <div class="grid">
    `;

    for (const d of domains) {
      const color = heatColor(d);
      const vPct = d.total > 0 ? (d.vital / d.total * 100) : 0;
      const sPct = d.total > 0 ? (d.stable / d.total * 100) : 0;
      const aPct = d.total > 0 ? (d.aging / d.total * 100) : 0;
      const wPct = d.total > 0 ? (d.weakened / d.total * 100) : 0;

      html += `
        <div class="domain-card">
          <div class="heat-bar" style="background:${color}"></div>
          <div class="name">${d.domain}<span class="section-tag">${d.section}</span></div>
          <div class="row"><span>Nuggets</span><span class="val">${d.total}</span></div>
          <div class="row"><span>Avg connections</span><span class="val">${d.avgConnections}</span></div>
          <div class="row"><span>% VITAL</span><span class="val vital">${d.pctVital}%</span></div>
          <div class="row"><span>% AGING</span><span class="val aging">${d.pctAging}%</span></div>
          <div class="bar-row">
            <div class="bar-seg bar-vital" style="width:${vPct}%"></div>
            <div class="bar-seg bar-stable" style="width:${sPct}%"></div>
            <div class="bar-seg bar-aging" style="width:${aPct}%"></div>
            <div class="bar-seg bar-weakened" style="width:${wPct}%"></div>
          </div>
        </div>
      `;
    }

    html += '</div>';

    // Most connected
    if (mc.length > 0) {
      html += '<div class="most-connected"><h2>Most Connected Nuggets</h2><div class="conn-list">';
      for (const f of mc) {
        html += `
          <div class="conn-item">
            <span class="file">${f.file}</span>
            <span class="badge ${badgeClass(f.health)}">${f.health}</span>
            <span class="conn-count">${f.connections}</span>
          </div>
        `;
      }
      html += '</div></div>';
    }

    app.innerHTML = html;

  } catch (err) {
    app.innerHTML = '<div class="loading">Error loading data: ' + err.message + '<br>Run: node vault-health-injector.js --dry</div>';
  }
})();
</script>
</body>
</html>
