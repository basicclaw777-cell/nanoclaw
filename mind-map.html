  }

  // Primary domain color (most frequent)
  const sortedDomains = Object.entries(cluster.domains).sort((a, b) => b[1] - a[1]);
  const primaryDomain = sortedDomains[0]?.[0] || 'technology';
  const color = domainColors[primaryDomain] || '#58a6ff';

  nodes.push({
    x, y, r,
    cluster,
    color,
    primaryDomain,
    sortedDomains,
    vx: 0, vy: 0,
    pulsePhase: Math.random() * Math.PI * 2
  });
});

// Simple force simulation to prevent overlap
for (let iter = 0; iter < 200; iter++) {
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = nodes[i].r + nodes[j].r + 15;
      if (dist < minDist && dist > 0) {
        const force = (minDist - dist) / dist * 0.3;
        const fx = dx * force;
        const fy = dy * force;
        if (i > 0) { nodes[i].x -= fx; nodes[i].y -= fy; }
        nodes[j].x += fx; nodes[j].y += fy;
      }
    }
    // Gentle pull toward center
    if (i > 0) {
      nodes[i].x += (cx - nodes[i].x) * 0.003;
      nodes[i].y += (cy - nodes[i].y) * 0.003;
    }
  }
}

// Map bridges to node positions
const domainToNodes = {};
for (const node of nodes) {
  for (const [domain] of node.sortedDomains) {
    if (!domainToNodes[domain]) domainToNodes[domain] = [];
    domainToNodes[domain].push(node);
  }
}

for (const bridge of DATA.bridges) {
  const sourceNodes = domainToNodes[bridge.source_domain];
  const targetNodes = domainToNodes[bridge.target_domain];
  if (sourceNodes && targetNodes && sourceNodes[0] !== targetNodes[0]) {
    bridgeLines.push({
      x1: sourceNodes[0].x, y1: sourceNodes[0].y,
      x2: targetNodes[0].x, y2: targetNodes[0].y,
      similarity: bridge.similarity,
      sourceDomain: bridge.source_domain,
      targetDomain: bridge.target_domain
    });
  }
}

// Deduplicate bridge lines
const seenBridges = new Set();
const uniqueBridges = bridgeLines.filter(b => {
  const key = [b.sourceDomain, b.targetDomain].sort().join('|');
  if (seenBridges.has(key)) return false;
  seenBridges.add(key);
  return true;
});

document.getElementById('bridge-count').textContent = uniqueBridges.length;

// Build legend
const legendEl = document.getElementById('legend');
const allDomains = [...new Set(clusters.flatMap(c => Object.keys(c.domains)))].sort();
for (const d of allDomains) {
  const el = document.createElement('span');
  el.className = 'legend-item';
  el.style.background = (domainColors[d] || '#888') + '22';
  el.style.color = domainColors[d] || '#888';
  el.style.border = `1px solid ${domainColors[d] || '#888'}44`;
  el.textContent = d;
  legendEl.appendChild(el);
}

// Mouse tracking
let mouseX = -1000, mouseY = -1000;
let hoveredNode = null;
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  hoveredNode = null;
  for (const node of nodes) {
    const dx = mouseX - node.x, dy = mouseY - node.y;
    if (Math.sqrt(dx * dx + dy * dy) < node.r + 5) {
      hoveredNode = node;
      break;
    }
  }
  updateHover();
});

function updateHover() {
  const panel = document.getElementById('hover-panel');
  if (!hoveredNode) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const c = hoveredNode.cluster;
  document.getElementById('hover-title').textContent =
    `Cluster ${c.id} — ${c.size} nuggets, ${c.domainCount} domains`;
  let html = '<strong>Domains:</strong> ' +
    hoveredNode.sortedDomains.map(([d, n]) =>
      `<span class="domain-tag" style="background:${domainColors[d] || '#888'}22;color:${domainColors[d] || '#888'}">${d} (${n})</span>`
    ).join(' ') + '<br><br><strong>Core nuggets:</strong><br>';
  for (const item of c.coreItems) {
    html += `<span class="domain-tag" style="background:${domainColors[item.domain] || '#888'}22;color:${domainColors[item.domain] || '#888'}">${item.domain}</span> ${item.title?.slice(0, 60)}<br>`;
  }
  document.getElementById('hover-items').innerHTML = html;
}

// Animation
let time = 0;
function draw() {
  time += 0.01;
  ctx.clearRect(0, 0, W, H);

  // Draw bridges first (behind nodes)
  for (const b of uniqueBridges) {
    const alpha = 0.06 + b.similarity * 0.08;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.strokeStyle = `rgba(88,166,255,${alpha})`;
    ctx.lineWidth = 0.5 + b.similarity * 1.5;
    ctx.stroke();
  }

  // Highlight bridges for hovered node
  if (hoveredNode) {
    for (const b of uniqueBridges) {
      const touchesHovered =
        (Math.abs(b.x1 - hoveredNode.x) < 5 && Math.abs(b.y1 - hoveredNode.y) < 5) ||
        (Math.abs(b.x2 - hoveredNode.x) < 5 && Math.abs(b.y2 - hoveredNode.y) < 5);
      if (touchesHovered) {
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        ctx.strokeStyle = `rgba(188,140,255,0.5)`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // Draw nodes
  for (const node of nodes) {
    const pulse = Math.sin(time * 1.5 + node.pulsePhase) * 0.08 + 1;
    const r = node.r * pulse;
    const isHovered = node === hoveredNode;

    // Glow
    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r * 2);
    grad.addColorStop(0, node.color + (isHovered ? '40' : '18'));
    grad.addColorStop(1, node.color + '00');
    ctx.beginPath();
    ctx.arc(node.x, node.y, r * 2, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Main circle
    ctx.beginPath();
    ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
    ctx.fillStyle = node.color + (isHovered ? '35' : '15');
    ctx.strokeStyle = node.color + (isHovered ? 'cc' : '55');
    ctx.lineWidth = isHovered ? 2.5 : 1;
    ctx.fill();
    ctx.stroke();

    // Domain pie segments (multi-domain clusters)
    if (node.sortedDomains.length > 1 && r > 20) {
      let startAngle = -Math.PI / 2;
      const total = Object.values(node.cluster.domains).reduce((s, n) => s + n, 0);
      for (const [domain, count] of node.sortedDomains) {
        const sweep = (count / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.arc(node.x, node.y, r * 0.7, startAngle, startAngle + sweep);
        ctx.closePath();
        ctx.fillStyle = (domainColors[domain] || '#888') + '30';
        ctx.fill();
        startAngle += sweep;
      }
    }

    // Size label
    ctx.fillStyle = node.color + (isHovered ? 'ff' : '99');
    ctx.font = `${isHovered ? 'bold ' : ''}${Math.max(10, r * 0.35)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(node.cluster.size, node.x, node.y);

    // Domain label for larger clusters
    if (r > 25 || isHovered) {
      ctx.fillStyle = var_dim;
      ctx.font = `${Math.max(8, r * 0.2)}px monospace`;
      const label = node.sortedDomains.slice(0, 2).map(([d]) => d).join('+');
      ctx.fillText(label, node.x, node.y + r + 12);
    }
  }

  requestAnimationFrame(draw);
}

const var_dim = '#6e7681';
draw();
</script>
</body>
</html>
