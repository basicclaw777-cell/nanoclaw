<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cathedral Index">
<meta name="theme-color" content="#f7f8fa">
<link rel="apple-touch-icon" href="/env/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>The Cathedral — Index</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #e4e7ec;
  --border-hover: #d0d5dd;
  --ink: #1a1d24;
  --ink-soft: #475067;
  --ink-faint: #8a93a6;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  --shadow-hover: 0 6px 20px rgba(16,24,40,0.10);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

/* ─── HEADER ─── */
.masthead { margin-bottom: 22px; }
.masthead h1 {
  font-size: 26px; font-weight: 800; letter-spacing: -0.6px; color: var(--ink);
}
.masthead .sub { font-size: 13.5px; color: var(--ink-faint); margin-top: 3px; font-weight: 500; }

/* ─── SEARCH ─── */
.searchbar { position: sticky; top: 0; z-index: 30; padding: 14px 0 16px; background: var(--bg); margin-bottom: 4px; }
.search-inner { position: relative; }
.search-input {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 46px 14px 44px; font-size: 15px; color: var(--ink);
  font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; box-shadow: var(--shadow);
}
.search-input:focus { border-color: #98a2b3; box-shadow: 0 0 0 4px rgba(152,162,179,0.12); }
.search-input::placeholder { color: var(--ink-faint); }
.search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: .5; pointer-events: none; }
.search-clear {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: var(--surface-2); border: none; border-radius: 8px; width: 26px; height: 26px;
  cursor: pointer; color: var(--ink-soft); font-size: 14px; display: none; align-items: center; justify-content: center;
}
.search-clear:hover { background: var(--border); }
.search-meta { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; font-weight: 500; min-height: 16px; }

/* ─── DISTRICT JUMP NAV ─── */
.jumpnav { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
.jump-pill {
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--border); cursor: pointer; color: var(--ink-soft);
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.jump-pill:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.jump-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ─── DISTRICT SECTION ─── */
.district { margin-bottom: 34px; scroll-margin-top: 86px; }
.district.hidden { display: none; }
.district-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  padding-bottom: 11px; border-bottom: 2px solid var(--district-c, var(--border));
}
.district-bar { width: 5px; height: 26px; border-radius: 3px; background: var(--district-c); flex-shrink: 0; }
.district-title { font-size: 17.5px; font-weight: 700; letter-spacing: -0.3px; color: var(--ink); }
.district-note { font-size: 12.5px; color: var(--ink-faint); font-weight: 500; margin-left: 2px; }
.district-count {
  margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 11px; border-radius: 999px;
  background: var(--district-tint); color: var(--district-c);
}

/* ─── CARD GRID ─── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }

.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 16px 16px 15px; box-shadow: var(--shadow); transition: all .18s;
  position: relative; overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
}
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--card-c); opacity: .85; }
.card:hover { border-color: var(--card-c); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.card.hidden { display: none; }
.card-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; padding-left: 4px; }
.card-icon {
  width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; background: var(--card-tint); flex-shrink: 0;
}
.card-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: var(--ink); }
.card-orc { font-size: 11px; color: var(--ink-faint); font-weight: 500; margin-top: 1px; }
.card-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; padding-left: 4px; flex: 1; }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; padding-left: 4px; }
.card-route {
  font-size: 11px; font-weight: 600; color: var(--card-c); background: var(--card-tint);
  padding: 3px 9px; border-radius: 6px; font-family: 'SF Mono', ui-monospace, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
}
.card-ext { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-weight: 600; }
.card:hover .card-ext { color: var(--card-c); }
.merge-note {
  font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 8px; padding-left: 4px;
  display: flex; align-items: center; gap: 5px;
}
.merge-note::before { content: '⤿'; font-style: normal; opacity: .6; }

/* ─── ARCHIVE (collapsed) ─── */
.archive { margin-top: 20px; border-top: 1px dashed var(--border-hover); padding-top: 20px; }
.archive-toggle {
  display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  font-size: 13px; font-weight: 600; color: var(--ink-faint); padding: 6px 0;
}
.archive-toggle:hover { color: var(--ink-soft); }
.archive-caret { transition: transform .2s; font-size: 11px; }
.archive.open .archive-caret { transform: rotate(90deg); }
.archive-body { display: none; margin-top: 12px; }
.archive.open .archive-body { display: block; }
.retired-card {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 15px; opacity: .82;
}
.retired-card .card-name { font-size: 14px; color: var(--ink-soft); }
.retired-reason { font-size: 12px; color: var(--ink-faint); margin-top: 3px; line-height: 1.45; }
.retired-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; }

/* ─── EMPTY STATE ─── */
.empty { text-align: center; padding: 50px 20px; color: var(--ink-faint); font-size: 14px; display: none; }
.empty.show { display: block; }

/* ─── FOOTER ─── */
.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-faint); text-align: center; }

@media (max-width: 640px) {
  .wrap { padding: 20px 14px 70px; }
  .grid { grid-template-columns: 1fr; }
  .masthead h1 { font-size: 22px; }
  .district-note { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">

// ── Forge terminal URL resolves to current host on :7681 ──
function resolveRoute(room) {
  if (room.route === 'FORGE_TTYD') return 'http://' + location.hostname + ':7681';
  return room.route;
}
function displayRoute(room) {
  if (room.route === 'FORGE_TTYD') return ':7681';
  return room.route.replace(/^https?:\/\/[^/]+/, '') || room.route;
}

const dEl = document.getElementById('districts');
const jumpEl = document.getElementById('jumpnav');

// ── Build jump nav ──
jumpEl.innerHTML = DISTRICTS.map(d => {
  const n = ROOMS.filter(r => r.d === d.id).length;
  return `<a class="jump-pill" href="#dist-${d.id}"><span class="jump-dot" style="background:${d.c}"></span>${d.name} <span style="opacity:.55">${n}</span></a>`;
}).join('');

// ── Build districts ──
dEl.innerHTML = DISTRICTS.map(d => {
  const rooms = ROOMS.filter(r => r.d === d.id);
  const cards = rooms.map(r => {
    const href = resolveRoute(r);
    const tgt = r.ext ? ' target="_blank" rel="noopener"' : '';
    const extLabel = r.ext ? 'Open ↗' : 'Enter →';
    const hay = (r.name + ' ' + r.orc + ' ' + r.desc).toLowerCase();
    return `
      <a class="card" href="${href}"${tgt} data-hay="${hay.replace(/"/g,'&quot;')}" style="--card-c:${d.c};--card-tint:${d.tint}">
        <div class="card-top">
          <div class="card-icon">${r.icon}</div>
          <div>
            <div class="card-name">${r.name}</div>
            <div class="card-orc">${r.orc}</div>
          </div>
        </div>
        <div class="card-desc">${r.desc}</div>
        ${r.merge ? `<div class="merge-note">${r.merge}</div>` : ''}
        <div class="card-foot">
          <span class="card-route">${displayRoute(r)}</span>
          <span class="card-ext">${extLabel}</span>
        </div>
      </a>`;
  }).join('');
  return `
    <section class="district" id="dist-${d.id}" style="--district-c:${d.c};--district-tint:${d.tint}">
      <div class="district-head">
        <div class="district-bar"></div>
        <div class="district-title">${d.name}</div>
        <div class="district-note">${d.note}</div>
        <div class="district-count">${rooms.length}</div>
      </div>
      <div class="grid">${cards}</div>
    </section>`;
}).join('');

// ── Archive section (retired rooms, collapsed) ──
dEl.insertAdjacentHTML('beforeend', `
  <div class="archive" id="archive">
    <div class="archive-toggle" onclick="document.getElementById('archive').classList.toggle('open')">
      <span class="archive-caret">▶</span> Retired rooms (${RETIRED.length}) — dead links removed from the floor
    </div>
    <div class="archive-body">
      <div class="retired-grid">
        ${RETIRED.map(r => `
          <div class="retired-card">
            <div class="card-name">${r.name}</div>
            <div class="retired-reason">${r.reason}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`);

// ── Masthead + footer counts ──
document.getElementById('masthead-sub').textContent =
  `${ROOMS.length} rooms across ${DISTRICTS.length} districts · ${RETIRED.length} retired`;
document.getElementById('foot').textContent =
  `${ROOMS.length} live rooms · ${RETIRED.length} retired · 9 districts. Every route preserved from the original lobby.`;

// ════════════════════════════════════════════════════════════
//  LIVE SEARCH / FILTER
// ════════════════════════════════════════════════════════════
const searchInput = document.getElementById('search');
const searchMeta  = document.getElementById('search-meta');
const searchClear = document.getElementById('search-clear');
const emptyEl     = document.getElementById('empty');

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  searchClear.style.display = q ? 'flex' : 'none';
  let shown = 0;

  document.querySelectorAll('.card').forEach(card => {
    const match = !q || card.dataset.hay.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) shown++;
  });

  // Hide districts with no visible cards (only while searching)
  document.querySelectorAll('.district').forEach(sec => {
    const anyVisible = sec.querySelectorAll('.card:not(.hidden)').length > 0;
    sec.classList.toggle('hidden', q && !anyVisible);
  });

  if (q) {
    searchMeta.textContent = shown === 1 ? '1 room matches' : `${shown} rooms match`;
    emptyEl.classList.toggle('show', shown === 0);
  } else {
    searchMeta.textContent = '';
    emptyEl.classList.remove('show');
  }
}

searchInput.addEventListener('input', applyFilter);
searchClear.addEventListener('click', () => { searchInput.value = ''; applyFilter(); searchInput.focus(); });
// "/" focuses search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
  if (e.key === 'Escape' && document.activeElement === searchInput) { searchInput.value=''; applyFilter(); searchInput.blur(); }
});
</script>
</body>
</html>
