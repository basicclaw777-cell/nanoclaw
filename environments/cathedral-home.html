<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cathedral">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Cathedral</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0a0c;
  --surface: #111114;
  --surface-2: #17171b;
  --surface-3: #1c1c21;
  --border: #222228;
  --border-hover: #333340;
  --text: #f0f0f2;
  --text-muted: #9d9da8;
  --text-dim: #5c5c6b;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; min-height:100vh; overflow-x:hidden; }
a { color:inherit; text-decoration:none; }

/* ─── TOP BAR ─── */
.topbar {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:16px;
  padding:12px 24px;
  background:rgba(10,10,12,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.topbar-brand { font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:var(--text-dim); }
.topbar-health { margin-left:auto; display:flex; align-items:center; gap:12px; }
.health-dot { width:8px; height:8px; border-radius:50%; animation:pulse-dot 2s infinite; }
.health-dot.green { background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,0.4); }
.health-dot.amber { background:#f59e0b; box-shadow:0 0 8px rgba(245,158,11,0.4); }
.health-dot.red { background:#ef4444; box-shadow:0 0 8px rgba(239,68,68,0.4); }
@keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
.health-label { font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }

/* ─── MORNING STRIP ─── */
.morning-strip {
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  font-size:12px; color:var(--text-muted);
  display:flex; align-items:center; gap:12px;
  cursor:pointer; transition:background var(--transition);
}
.morning-strip:hover { background:var(--surface-2); }
.morning-strip .time { color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:11px; }
.morning-strip .msg { flex:1; }
.morning-strip.collapsed .msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ─── LOBBY GRID ─── */
.lobby { max-width:1100px; margin:0 auto; padding:48px 24px 80px; }
.lobby-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:16px;
}

/* ─── ROOM CARD ─── */
.room-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  cursor:pointer;
  transition:all var(--transition);
  position:relative;
  overflow:hidden;
}
.room-card:hover {
  border-color:var(--border-hover);
  transform:translateY(-3px);
  box-shadow:0 16px 48px rgba(0,0,0,0.4);
}
.room-card::before {
  content:'';
  position:absolute;
  top:-60px; right:-60px;
  width:160px; height:160px;
  border-radius:50%;
  background:var(--card-color);
  opacity:0.04;
  transition:opacity var(--transition);
}
.room-card:hover::before { opacity:0.08; }
.room-card-header {
  display:flex; align-items:center; gap:14px; margin-bottom:16px;
}
.room-icon {
  width:48px; height:48px;
  border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  background:var(--card-color-dim);
  transition:transform var(--transition);
}
.room-card:hover .room-icon { transform:scale(1.08); }
.room-title { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
.room-pulse {
  width:8px; height:8px; border-radius:50%; margin-left:auto;
  background:var(--card-color);
  opacity:0.7;
}
.room-desc {
  font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px;
}
.room-tabs {
  display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;
}
.room-tab {
  font-size:10px; font-weight:600; letter-spacing:0.5px;
  padding:4px 10px; border-radius:var(--radius-xs);
  background:rgba(255,255,255,0.03);
  color:var(--text-dim);
  transition:all 0.2s;
}
.room-card:hover .room-tab { background:var(--card-color-dim); color:var(--card-color); }
.room-stat {
  font-size:11px; color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  padding-top:14px; border-top:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.room-stat-value { color:var(--card-color); font-weight:600; }

/* ─── FOOTER ─── */
.footer {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; align-items:center; justify-content:center; gap:24px;
  padding:10px 24px;
  background:rgba(10,10,12,0.9);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  font-size:11px; color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
}
.footer-item { display:flex; align-items:center; gap:6px; }
.footer-dot { width:6px; height:6px; border-radius:50%; }

/* ─── ROOM VIEW ─── */
.room-view { display:none; max-width:1100px; margin:0 auto; padding:24px; }
.room-view.active { display:block; animation:fadeUp 0.35s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.room-view-header {
  display:flex; align-items:center; gap:16px; margin-bottom:24px;
}
.back-btn {
  width:36px; height:36px; border-radius:var(--radius-xs);
  background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; transition:all 0.2s;
}
.back-btn:hover { background:var(--surface-3); border-color:var(--border-hover); }
.room-view-title { font-size:24px; font-weight:700; letter-spacing:-0.5px; }
.room-view-tabs {
  display:flex; gap:4px; margin-bottom:24px;
  overflow-x:auto; padding-bottom:4px;
}
.rv-tab {
  padding:8px 16px; border-radius:var(--radius-xs);
  font-size:12px; font-weight:600;
  background:var(--surface); border:1px solid var(--border);
  cursor:pointer; white-space:nowrap;
  transition:all 0.2s;
}
.rv-tab:hover { border-color:var(--border-hover); }
.rv-tab.active { background:var(--card-color-dim); border-color:var(--card-color); color:var(--card-color); }
.rv-content {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; min-height:500px;
}
.rv-content iframe { width:100%; height:75vh; border:none; }
.rv-placeholder {
  display:flex; align-items:center; justify-content:center;
  height:400px; color:var(--text-dim); font-size:14px;
}

/* ─── RESPONSIVE ─── */
@media (max-width:700px) {
  .lobby-grid { grid-template-columns:1fr; }
  .room-card { padding:22px; }
  .topbar { padding:10px 16px; }
  .lobby { padding:24px 16px 80px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Cathedral</div>
  <div class="topbar-health">
    <div class="health-dot green" id="health-dot"></div>
    <span class="health-label" id="health-label">--</span>
  </div>
</div>

<div class="morning-strip collapsed" id="morning-strip" onclick="this.classList.toggle('collapsed')">
  <span class="time" id="morning-time">--:--</span>
  <span class="msg" id="morning-msg">Loading...</span>
</div>

<div class="lobby" id="lobby">
  <div class="lobby-grid" id="lobby-grid"></div>
</div>

<div class="room-view" id="room-view">
  <div class="room-view-header">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="room-view-title" id="rv-title"></div>
  </div>
  <div class="room-view-tabs" id="rv-tabs"></div>
  <div class="rv-content" id="rv-content">
    <div class="rv-placeholder">Select a tab above</div>
  </div>
</div>

<div class="footer">
  <div class="footer-item"><div class="footer-dot" id="f-pm2-dot" style="background:#22c55e"></div><span id="f-pm2">-- processes</span></div>
  <div class="footer-item"><div class="footer-dot" style="background:#a855f7"></div><span id="f-vault">-- nuggets</span></div>
  <div class="footer-item"><div class="footer-dot" style="background:#3b82f6"></div><span id="f-disk">--GB free</span></div>
</div>

<script>
// ═══════════════════ ROOM DATA ═══════════════════
const ROOMS = [
  {
    id: 'gym',
    name: 'Gym',
    icon: '🥊',
    color: '#22c55e',
    colorDim: 'rgba(34,197,94,0.10)',
    desc: 'Everything Basic Reflex. Training, operations, content, members, merch, course.',
    stat: { label: 'Members', value: '73' },
    tabs: [
      { name: 'Gym Eyes', url: '/gym-eyes' },
      { name: 'Operations', url: '/dashboard' },
      { name: 'Client Comms', url: '/comms' },
      { name: 'Growth', url: '/growth' },
      { name: 'Merch', url: '/merch' },
      { name: 'Course', url: '/course' },
      { name: 'Screening Room', url: '/screening' },
      { name: 'Opponents', url: '/opponents-film-room' },
      { name: 'Cuba Combos', url: '/cuba-combos' },
      { name: 'Techniques', url: '/techniques' },
      { name: 'BR Command', url: '/br-command' },
      { name: 'Engineering', url: '/gym-eyes' }
    ]
  },
  {
    id: 'wealth',

    icon: '💰',
    color: '#f59e0b',
    colorDim: 'rgba(245,158,11,0.10)',
    desc: 'Trading experiment, property scout, financial architecture.',
    stat: { label: 'Paper P&L', value: '+$152' },
    tabs: [
      { name: 'Trading Desk', url: '/trader/hub' },

    ]
  },
  {
    id: 'research',
    name: 'Research',
    icon: '🔬',
    color: '#a855f7',
    colorDim: 'rgba(168,85,247,0.10)',
    desc: 'Knowledge systems, ancient corpora, convergence detection, the vault watching itself.',
    stat: { label: 'Convergences', value: '98' },
    tabs: [
      { name: 'Cathedral Rosetta', url: '/cathedral-rosetta' },
      { name: 'Rosetta Bridge', url: '/rosetta-bridge' },
      { name: 'Sumerian', url: '/sumerian' },
      { name: 'Ancient Corpus', url: '/ancient-corpus' },
      { name: 'Forgotten Shelf', url: '/archaeologist' },
      { name: 'Cosmology', url: '/cosmology' },
      { name: 'Mind Map', url: '/mind-map.html' },
      { name: 'Convergence Map', url: '/convergence-map' },
      { name: 'Looking Glass', url: '/looking-glass' },
      { name: 'Predictive', url: '/predictive/map' }
    ]
  },
  {
    id: 'studio',
    name: 'Studio',
    icon: '🎬',
    color: '#ec4899',
    colorDim: 'rgba(236,72,153,0.10)',
    desc: 'Visual production, content pipeline, characters, creative lab.',
    stat: { label: 'Styles', value: '10 proven' },
    tabs: [
      { name: 'Reed Studio', url: '/reed-studio' },
      { name: 'Content Studio', url: '/api/content-studio/wishlist' },
      { name: 'Logan Universe', url: '/logan-universe' },

      { name: 'Creative Lab', url: '/reed-slides' }
    ]
  },
  {
    id: 'life',
    name: 'Life',
    icon: '🧭',
    color: '#06b6d4',
    colorDim: 'rgba(6,182,212,0.10)',
    desc: 'Personal architecture. Pulse channels, open questions, influences, time capsules.',
    stat: { label: 'Channels', value: '11 active' },
    tabs: [
      { name: 'Architect Pulse', url: '/pulse' },
      { name: 'Advisors\' Library', url: '/advisors-library' },
      { name: 'Open Questions', url: '/open-questions' },
      { name: 'What Built Me', url: '/what-built-me' },
      { name: 'Time Capsule', url: '/time-capsule' }
    ]
  },
  {
    id: 'system',
    name: 'System',
    icon: '⚡',
    color: '#3b82f6',
    colorDim: 'rgba(59,130,246,0.10)',
    desc: 'Cathedral infrastructure. Agents, emergence, processes, the nervous system.',
    stat: { label: 'Agents', value: '7 active' },
    tabs: [
      { name: 'Agent Hub', url: '/agents' },
      { name: 'Emergence', url: '/emergence' },
      { name: 'Feed', url: '/cathedral-city/feed-dashboard' },
      { name: 'Team Programme', url: '/cathedral-city/team-programme' },
      { name: 'Neural Map', url: '/mind-map.html' },
      { name: 'Voice Chamber', url: 'http://localhost:12400' },
      { name: 'Move Detector', url: null }
    ]
  },
  {
    id: 'cathedral',
    name: 'Cathedral',
    icon: '🏛️',
    color: '#8b5cf6',
    colorDim: 'rgba(139,92,246,0.10)',
    desc: 'The meta-layer. The Cathedral watching itself — methods, principles, identity.',
    stat: { label: 'Vault', value: '10K+ nuggets' },
    tabs: [
      { name: 'Cathedral Deck', url: '/cathedral-deck' },
      { name: 'Knowledge Graph', url: '/graph/html' },
      { name: 'Mega Surgery', url: '/mega-surgery-viz.html' },
      { name: 'Publisher', url: '/publisher' },
      { name: 'Constellation', url: 'http://localhost:8889' }
    ]
  },
  {
    id: 'world',
    name: 'World',
    icon: '🌏',
    color: '#14b8a6',
    colorDim: 'rgba(20,184,166,0.10)',
    desc: 'External intelligence. HK pulse, competitors, news, scraper outputs.',
    stat: { label: 'Sources', value: '7 targets' },
    tabs: [
      { name: 'Intelligence Hub', url: '/scraper/hub' },
      { name: 'Simpsons', url: '/simpsons' },
      { name: 'Truth Corpus', url: '/truth-corpus' }
    ]
  }
];

// ═══════════════════ RENDER ═══════════════════
function renderLobby() {
  const grid = document.getElementById('lobby-grid');
  grid.innerHTML = ROOMS.map(r => `
    <div class="room-card" onclick="openRoom('${r.id}')" style="--card-color:${r.color};--card-color-dim:${r.colorDim}">
      <div class="room-card-header">
        <div class="room-icon">${r.icon}</div>
        <div class="room-title">${r.name}</div>
        <div class="room-pulse"></div>
      </div>
      <div class="room-desc">${r.desc}</div>
      <div class="room-tabs">
        ${r.tabs.slice(0, 5).map(t => `<span class="room-tab">${t.name}</span>`).join('')}
        ${r.tabs.length > 5 ? `<span class="room-tab">+${r.tabs.length - 5}</span>` : ''}
      </div>
      <div class="room-stat">
        <span>${r.stat.label}</span>
        <span class="room-stat-value">${r.stat.value}</span>
      </div>
    </div>
  `).join('');
}

// ═══════════════════ ROOM VIEW ═══════════════════
let currentRoom = null;
let currentTab = null;

function openRoom(id) {
  const room = ROOMS.find(r => r.id === id);
  if (!room) return;
  currentRoom = room;

  document.getElementById('lobby').style.display = 'none';
  const rv = document.getElementById('room-view');
  rv.classList.add('active');
  rv.style.setProperty('--card-color', room.color);
  rv.style.setProperty('--card-color-dim', room.colorDim);

  document.getElementById('rv-title').textContent = room.icon + ' ' + room.name;

  // Render tabs
  const tabsEl = document.getElementById('rv-tabs');
  tabsEl.innerHTML = room.tabs.map((t, i) => `
    <div class="rv-tab${i === 0 ? ' active' : ''}" onclick="switchTab(${i}, this)" style="--card-color:${room.color};--card-color-dim:${room.colorDim}">${t.name}</div>
  `).join('');

  // Load first tab
  switchTab(0);

  history.pushState({ room: id }, '', `/home/${id}`);
}

function switchTab(idx, el) {
  if (!currentRoom) return;
  const tab = currentRoom.tabs[idx];
  currentTab = tab;

  // Update active tab styling
  if (el) {
    document.querySelectorAll('.rv-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  } else {
    const tabs = document.querySelectorAll('.rv-tab');
    tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
  }

  // Load content
  const content = document.getElementById('rv-content');
  if (!tab.url) {
    content.innerHTML = '<div class="rv-placeholder">This system runs in the background — no visual dashboard. Use /moves on Telegram.</div>';
  } else if (tab.url.startsWith('http://')) {
    content.innerHTML = `<div class="rv-placeholder"><a href="${tab.url}" target="_blank" style="color:var(--card-color);font-weight:600;">Open ${tab.name} →</a></div>`;
  } else {
    content.innerHTML = `<iframe src="${tab.url}"></iframe>`;
  }
}

function goHome() {
  document.getElementById('room-view').classList.remove('active');
  document.getElementById('lobby').style.display = 'block';
  document.getElementById('rv-content').innerHTML = '';
  currentRoom = null;
  history.pushState({}, '', '/home');
}

// ═══════════════════ STATUS POLLING ═══════════════════
async function pollStatus() {
  try {
    const resp = await fetch('/villa/snapshot');
    const data = await resp.json();

    // Health dot
    const dot = document.getElementById('health-dot');
    const label = document.getElementById('health-label');
    const online = (data.pm2 || []).filter(p => p.status === 'online').length;
    const total = (data.pm2 || []).length;
    const stopped = total - online;
    dot.className = 'health-dot ' + (stopped > 5 ? 'red' : stopped > 2 ? 'amber' : 'green');
    label.textContent = `${online}/${total} online`;

    // Footer
    document.getElementById('f-pm2').textContent = `${online} processes`;
    document.getElementById('f-vault').textContent = `${data.vaultCount || '--'} nuggets`;
    document.getElementById('f-disk').textContent = `${data.diskFree || '--'}GB free`;

    // Morning
    const now = new Date();
    document.getElementById('morning-time').textContent = now.toTimeString().slice(0, 5);
    if (data.museFinding) {
      document.getElementById('morning-msg').textContent = data.museFinding;
    }
  } catch {}
}

// ═══════════════════ INIT ═══════════════════
window.addEventListener('popstate', (e) => {
  if (e.state?.room) openRoom(e.state.room);
  else goHome();
});

renderLobby();
pollStatus();
setInterval(pollStatus, 30000);
</script>
