// ═══ PHYSICS ENGINE ═══
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Domain cluster positions (radial layout)
const domainAngles = {};
const domainKeys = Object.keys(DOMAINS);
domainKeys.forEach((d, i) => {
  domainAngles[d] = (i / domainKeys.length) * Math.PI * 2 - Math.PI/2;
});

// Initialize node positions in domain clusters
const R = Math.min(W, H) * 0.32;
nodes.forEach(n => {
  const angle = domainAngles[n.domain] || 0;
  const domainNodes = nodes.filter(x => x.domain === n.domain);
  const idx = domainNodes.indexOf(n);
  const spread = 0.3 + idx * 0.12;
  const jitter = (Math.random() - 0.5) * 80;
  n.x = W/2 + Math.cos(angle) * R * spread + jitter;
  n.y = H/2 + Math.sin(angle) * R * spread + jitter;
  n.vx = 0; n.vy = 0;
  n.radius = n.type === 'store' ? 12 : (n.type === 'module' ? 8 : 10);
});

// Camera
let camX = 0, camY = 0, zoom = 1;
let dragging = false, lastMX = 0, lastMY = 0;

canvas.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (dragging) {
    camX += (e.clientX - lastMX) / zoom;
    camY += (e.clientY - lastMY) / zoom;
    lastMX = e.clientX; lastMY = e.clientY;
  }
  handleHover(e);
});
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(3, zoom));
}, { passive: false });

// Tooltip
const tooltip = document.getElementById('tooltip');
let hoveredNode = null;

function handleHover(e) {
  const mx = (e.clientX - W/2) / zoom - camX + W/2;
  const my = (e.clientY - H/2) / zoom - camY + H/2;
  hoveredNode = null;
  for (const n of nodes) {
    const dx = n.x - mx, dy = n.y - my;
    if (dx*dx + dy*dy < (n.radius+5)*(n.radius+5)) {
      hoveredNode = n;
      break;
    }
  }
  if (hoveredNode) {
    const n = hoveredNode;
    const conns = edges.filter(e => e.from === n.id || e.to === n.id);
    const inputs = conns.filter(e => e.to === n.id).map(e => `← ${e.from} (${e.label})`);
    const outputs = conns.filter(e => e.from === n.id).map(e => `→ ${e.to} (${e.label})`);
    tooltip.innerHTML = `
      <div class="name">${n.label}</div>
      <div class="detail">${n.domain} | ${n.type} | ${n.status}</div>
      ${n.detail ? `<div class="detail">${n.detail}</div>` : ''}
      <div class="connections">
        ${inputs.length ? '<b>Inputs:</b><br>' + inputs.join('<br>') : '<b>No inputs</b> (source node)'}
        <br>
        ${outputs.length ? '<b>Outputs:</b><br>' + outputs.join('<br>') : '<b>No outputs</b> (dead end)'}
      </div>
    `;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

// Force simulation
function simulate() {
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const f = 800 / d2;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }

  // Attraction along edges
  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 1) return;
    const f = (d - 120) * 0.003;
    a.vx += dx/d * f; a.vy += dy/d * f;
    b.vx -= dx/d * f; b.vy -= dy/d * f;
  });

  // Domain clustering
  nodes.forEach(n => {
    const angle = domainAngles[n.domain];
    const cx = W/2 + Math.cos(angle) * R * 0.6;
    const cy = H/2 + Math.sin(angle) * R * 0.6;
    n.vx += (cx - n.x) * 0.002;
    n.vy += (cy - n.y) * 0.002;
  });

  // Apply velocity with damping
  nodes.forEach(n => {
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  });
}

// Render
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2 + camX, -H/2 + camY);

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);
  const time = Date.now() * 0.001;

  // Draw edges
  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);

    if (e.cross) {
      ctx.strokeStyle = `rgba(250, 204, 21, ${0.15 + Math.sin(time * 2) * 0.1})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
    } else if (hoveredNode && (e.from === hoveredNode.id || e.to === hoveredNode.id)) {
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = 'rgba(100, 100, 130, 0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrow
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(-3, -3);
    ctx.lineTo(-3, 3);
    ctx.closePath();
    ctx.fillStyle = e.cross ? 'rgba(250, 204, 21, 0.4)' : 'rgba(100, 100, 130, 0.3)';
    ctx.fill();
    ctx.restore();
  });

  // Draw nodes
  nodes.forEach(n => {
    const color = DOMAINS[n.domain]?.color || '#666';
    const isHovered = hoveredNode === n;
    const isConnected = hoveredNode && edges.some(e =>
      (e.from === hoveredNode.id && e.to === n.id) ||
      (e.to === hoveredNode.id && e.from === n.id)
    );

    // Glow
    if (isHovered || isConnected) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(n.x, n.y, n.radius, n.x, n.y, n.radius + 8);
      grad.addColorStop(0, color + '40');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Pulse for active stores
    if (n.type === 'store') {
      const pulse = Math.sin(time * 1.5 + n.x * 0.01) * 3;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + pulse, 0, Math.PI * 2);
      ctx.fillStyle = color + '15';
      ctx.fill();
    }

    // Node
    ctx.beginPath();
    if (n.type === 'store') {
      // Diamond for stores
      ctx.moveTo(n.x, n.y - n.radius);
      ctx.lineTo(n.x + n.radius, n.y);
      ctx.lineTo(n.x, n.y + n.radius);
      ctx.lineTo(n.x - n.radius, n.y);
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    }

    const alpha = n.status === 'stopped' ? '40' : (n.status === 'online' ? 'cc' : '88');
    ctx.fillStyle = color + alpha;
    ctx.fill();
    ctx.strokeStyle = isHovered ? '#fff' : color;
    ctx.lineWidth = isHovered ? 2 : 1;
    ctx.stroke();

    // Status dot
    if (n.status === 'online') {
      ctx.beginPath();
      ctx.arc(n.x + n.radius * 0.7, n.y - n.radius * 0.7, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#34d399';
      ctx.fill();
    } else if (n.status === 'stopped') {
      ctx.beginPath();
      ctx.arc(n.x + n.radius * 0.7, n.y - n.radius * 0.7, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
    }

    // Label
    if (zoom > 0.6 || isHovered || isConnected) {
      ctx.font = `${isHovered ? 'bold ' : ''}${11/Math.max(zoom,0.8)}px 'SF Mono', monospace`;
      ctx.fillStyle = isHovered ? '#fff' : (n.status === 'stopped' ? '#555' : '#999');
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + n.radius + 14);
    }
  });

  // Domain labels
  if (zoom > 0.4) {
    domainKeys.forEach(d => {
      const angle = domainAngles[d];
      const lx = W/2 + Math.cos(angle) * R * 1.15;
      const ly = H/2 + Math.sin(angle) * R * 1.15;
      ctx.font = `bold ${13/Math.max(zoom,0.6)}px 'SF Mono', monospace`;
      ctx.fillStyle = DOMAINS[d].color + '88';
      ctx.textAlign = 'center';
      ctx.fillText(DOMAINS[d].label, lx, ly);
    });
  }

  ctx.restore();
}

// Stats
const crossEdges = edges.filter(e => e.cross);
const deadEnds = nodes.filter(n => !edges.some(e => e.from === n.id));
document.getElementById('nodeCount').textContent = nodes.length;
document.getElementById('edgeCount').textContent = edges.length;
document.getElementById('domainCount').textContent = domainKeys.length;
document.getElementById('crossCount').textContent = crossEdges.length;
document.getElementById('deadCount').textContent = deadEnds.length;

// Legend
const legendEl = document.getElementById('legend');
legendEl.innerHTML = Object.entries(DOMAINS).map(([k, v]) =>
  `<div class="item"><div class="dot" style="background:${v.color}"></div>${v.label}</div>`
).join('') + `
<div class="item" style="margin-top:8px"><div class="dot" style="background:#34d399"></div> Online</div>
<div class="item"><div class="dot" style="background:#ef4444"></div> Stopped</div>
<div class="item" style="margin-top:4px;color:#facc15">--- Cross-domain link</div>
`;

// Gaps panel
const gapsEl = document.getElementById('gaps');
gapsEl.innerHTML = '<h2>MISSING CONNECTIONS</h2>' + gaps.map(g =>
  `<div class="gap">${g.title}</div><div class="suggestion">${g.desc}</div>`
).join('');

// Animation loop
function loop() {
  simulate();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
