<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cathedral Episodes</title>
<style>
  :root{
    --bg:#0a0b0e;--panel:#14161c;--panel2:#1b1e26;--line:#2a2f3a;
    --gold:#c9a24b;--gold-bright:#e3bd63;--ember:#c8542f;
    --ink:#e9e7e1;--muted:#888d99;--green:#22c55e;--blue:#378ADD;--purple:#9333ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 'SF Mono','Fira Code',monospace;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:30px 20px 80px}
  header{text-align:center;margin-bottom:20px}
  h1{font-size:24px;letter-spacing:1px} h1 .g{color:var(--gold)}
  .tag{color:var(--muted);font-size:12px;margin-top:4px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat .n{font-size:26px;font-weight:700;color:var(--gold)}
  .stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .seasons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .season-pill{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px;
    padding:5px 12px;border-radius:16px;cursor:pointer;white-space:nowrap}
  .season-pill:hover{border-color:var(--gold);color:var(--ink)}
  .season-pill.active{background:var(--gold);color:#1a1405;border-color:var(--gold)}
  .season-pill .cnt{opacity:.6;margin-left:4px}

  .timeline{position:relative;margin:20px 0}
  .timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--line)}

  .ep{position:relative;margin-bottom:12px;padding-left:44px}
  .ep .dot{position:absolute;left:12px;top:8px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
  .ep.high .dot{border-color:var(--gold);background:var(--gold)}
  .ep.crisis .dot{border-color:var(--ember);background:var(--ember)}
  .ep.breakthrough .dot{border-color:var(--green);background:var(--green)}

  .ep-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s}
  .ep-card:hover{border-color:var(--gold);transform:translateX(4px)}
  .ep-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .ep-id{font-weight:700;color:var(--gold);font-size:13px}
  .ep-date{font-size:11px;color:var(--muted)}
  .ep-opener{font-size:13px;color:var(--ink);line-height:1.5;max-height:3.2em;overflow:hidden}
  .ep-meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
  .pill.topic{border-color:#378ADD44;color:var(--blue)}
  .pill.principle{border-color:#c9a24b44;color:var(--gold)}
  .pill.emotion{border-color:#9333ea44;color:var(--purple)}
  .pill.weight{border-color:var(--green);color:var(--green);font-weight:700}

  .ep-detail{display:none;margin-top:10px;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px}
  .ep-detail.open{display:block}
  .ep-detail h4{color:var(--gold);font-size:11px;text-transform:uppercase;margin:8px 0 4px;letter-spacing:.5px}
  .ep-detail h4:first-child{margin-top:0}
  .ep-detail .files{color:var(--muted);font-size:11px}
  .ep-detail .breakthrough-sig{color:var(--green)}
  .ep-detail .crisis-sig{color:var(--ember)}

  .search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    padding:10px 14px;border-radius:10px;font-family:inherit;font-size:13px;margin-bottom:16px}
  .search:focus{outline:none;border-color:var(--gold)}
  .search::placeholder{color:var(--muted)}

  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:40px;line-height:1.8}
  .empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cathedral <span class="g">Episodes</span></h1>
    <div class="tag">The story of the build. Every session that shifted something.</div>
  </header>

  <div class="stats" id="stats"></div>
  <input class="search" id="search" placeholder="Search episodes — topics, principles, text...">
  <div class="seasons" id="seasons"></div>
  <div class="timeline" id="timeline"></div>

  <div class="foot">
    The Cathedral's own creation story, told from primary sources.<br>
    Episodic intelligence — not what was built, but what changed.
  </div>
</div>

<script>
let DATA = null;
let activeSeason = 'all';

function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function load(){
  const r = await fetch('/episodes/data');
  DATA = await r.json();
  renderStats();
  renderSeasons();
  renderTimeline();
}

function renderStats(){
  const d = DATA;
  const totalHours = Math.round(d.episodes.reduce((s,e)=>s+e.durationMin,0)/60);
  const allTopics = new Set();
  const allPrinciples = new Set();
  d.episodes.forEach(e=>{
    e.signals.topics.forEach(t=>allTopics.add(t));
    e.signals.principlesMentioned.forEach(p=>allPrinciples.add(p));
  });
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${d.totalEpisodes}</div><div class="label">Episodes</div></div>
    <div class="stat"><div class="n">${Object.keys(d.seasonSummary).length}</div><div class="label">Seasons</div></div>
    <div class="stat"><div class="n">${totalHours}</div><div class="label">Hours</div></div>
    <div class="stat"><div class="n">${allTopics.size}</div><div class="label">Topics</div></div>
    <div class="stat"><div class="n">${allPrinciples.size}</div><div class="label">Principles</div></div>
  `;
}

function renderSeasons(){
  const pills = ['<div class="season-pill active" data-s="all">All<span class="cnt">' + DATA.totalEpisodes + '</span></div>'];
  for(const [label, info] of Object.entries(DATA.seasonSummary).sort()){
    pills.push(`<div class="season-pill" data-s="${esc(label)}">${esc(label)}<span class="cnt">${info.count}</span></div>`);
  }
  document.getElementById('seasons').innerHTML = pills.join('');
  document.querySelectorAll('.season-pill').forEach(p=>{
    p.onclick=()=>{
      document.querySelectorAll('.season-pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      activeSeason = p.dataset.s;
      renderTimeline();
    };
  });
}

function renderTimeline(){
  const q = document.getElementById('search').value.toLowerCase();
  let eps = DATA.episodes;

  if(activeSeason !== 'all'){
    eps = eps.filter(e=>e.seasonLabel === activeSeason);
  }
  if(q){
    eps = eps.filter(e=>{
      const haystack = [e.opener, ...e.signals.topics, ...e.signals.principlesMentioned, e.seasonLabel, e.date].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }

  if(!eps.length){
    document.getElementById('timeline').innerHTML='<div class="empty">No episodes match.</div>';
    return;
  }

  document.getElementById('timeline').innerHTML = eps.map(ep=>{
    const isCrisis = ep.signals.crisisSignals.length > 3;
    const isBreakthrough = ep.signals.breakthroughSignals.length > 0;
    const isHigh = ep.weight > 20;
    const cls = isBreakthrough ? 'breakthrough' : isCrisis ? 'crisis' : isHigh ? 'high' : '';

    const topicPills = ep.signals.topics.slice(0,6).map(t=>`<span class="pill topic">${esc(t)}</span>`).join('');
    const principlePills = ep.signals.principlesMentioned.slice(0,4).map(p=>`<span class="pill principle">${esc(p)}</span>`).join('');
    const emotionPills = ep.signals.emotionalMarkers.slice(0,3).map(e=>`<span class="pill emotion">${esc(e)}</span>`).join('');

    return `
      <div class="ep ${cls}">
        <div class="dot"></div>
        <div class="ep-card" onclick="toggleDetail('${ep.id}')">
          <div class="ep-head">
            <span class="ep-id">${ep.id} · ${esc(ep.seasonLabel)}</span>
            <span class="ep-date">${ep.date} · ${ep.durationMin}m · ${ep.userMessageCount} msgs</span>
          </div>
          <div class="ep-opener">${esc(ep.opener)}</div>
          <div class="ep-meta">
            <span class="pill weight">w${ep.weight}</span>
            ${topicPills}${principlePills}${emotionPills}
          </div>
          <div class="ep-detail" id="detail-${ep.id}">
            ${ep.signals.breakthroughSignals.length ? `<h4>Breakthrough signals</h4><div class="breakthrough-sig">${ep.signals.breakthroughSignals.map(esc).join(', ')}</div>` : ''}
            ${ep.signals.crisisSignals.length ? `<h4>Crisis signals</h4><div class="crisis-sig">${ep.signals.crisisSignals.map(esc).join(', ')}</div>` : ''}
            ${ep.signals.filesBuilt.length ? `<h4>Files built</h4><div class="files">${ep.signals.filesBuilt.map(esc).join('<br>')}</div>` : ''}
            ${ep.signals.principlesMentioned.length ? `<h4>Principles touched</h4><div>${ep.signals.principlesMentioned.map(p=>`<span class="pill principle">${esc(p)}</span>`).join(' ')}</div>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleDetail(id){
  const el = document.getElementById('detail-'+id);
  if(el) el.classList.toggle('open');
}

document.getElementById('search').addEventListener('input', renderTimeline);

load();
</script>
</body>
</html>
